name: Generate Debug Keystore

# One-off helper: produces a stable Android debug keystore so every APK build
# is signed with the SAME key (lets updates install over each other). Run once
# via Actions → Run workflow, download the artifact, and commit it to
# music-player-app/debug.keystore. Safe to delete this workflow afterward.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Generate debug keystore (standard Android debug credentials)
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -v -keystore debug.keystore -storepass android | head -20

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore
          retention-days: 1
