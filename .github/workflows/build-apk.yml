name: Build Android APK

on:
  push:
    branches: [claude/mobile-document-scanner-EOLSL, main]
  workflow_dispatch:   # allows triggering manually from GitHub UI

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Let Flutter pick the latest stable — avoids version-pin download errors
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Accept SDK licenses non-interactively (required for first-run builds)
      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses 2>/dev/null || true

      # Helpful for debugging future failures
      - name: Flutter doctor
        run: flutter doctor -v

      # Generate the full Android boilerplate we don't store in git
      - name: Scaffold Flutter project
        run: |
          flutter create \
            --project-name paperless_scanner \
            --org com.paperlessscanner \
            --platforms android \
            /tmp/build

      - name: Overlay our source files
        run: |
          cp -r paperless_scanner/lib          /tmp/build/
          cp    paperless_scanner/pubspec.yaml  /tmp/build/
          cp    paperless_scanner/android/app/src/main/AndroidManifest.xml \
                /tmp/build/android/app/src/main/AndroidManifest.xml

      # Ensure minSdk 21 (ML Kit requirement). Flutter 3.22+ already defaults to
      # 21, but we patch both DSL flavours explicitly so it never regresses.
      - name: Patch minSdkVersion to 21
        working-directory: /tmp/build/android/app
        run: |
          if [ -f build.gradle ]; then
            sed -i 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 21/' build.gradle
            echo "=== build.gradle (after patch) ===" && cat build.gradle
          fi
          if [ -f build.gradle.kts ]; then
            sed -i 's/minSdk = flutter\.minSdkVersion/minSdk = 21/' build.gradle.kts
            echo "=== build.gradle.kts (after patch) ===" && cat build.gradle.kts
          fi

      - name: Get dependencies
        working-directory: /tmp/build
        run: flutter pub get

      - name: Build APK
        working-directory: /tmp/build
        run: flutter build apk --debug

      - name: Show build output
        run: ls -lh /tmp/build/build/app/outputs/flutter-apk/

      # Single universal APK — works on all Android CPU architectures
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paperless-scanner
          path: /tmp/build/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
