name: Build Android APK

on:
  push:
    branches: [claude/mobile-document-scanner-EOLSL, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Install android-35 if not present — required by google_mlkit_document_scanner
      - name: Install Android 35 platform
        run: |
          echo "Installed platforms:" && ls $ANDROID_HOME/platforms/ 2>/dev/null || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager -type f 2>/dev/null | head -1)
            if [ -n "$SDKMANAGER" ]; then
              echo "Installing android-35 via $SDKMANAGER"
              yes | sudo "$SDKMANAGER" "platforms;android-35" 2>&1 | tail -5
            else
              echo "sdkmanager not found"
            fi
          else
            echo "android-35 already installed"
          fi

      # Cache Gradle downloads so re-runs finish in ~3 min instead of ~15
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Scaffold Flutter project
        timeout-minutes: 3
        run: |
          flutter create \
            --project-name paperless_scanner \
            --org com.paperlessscanner \
            --platforms android \
            /tmp/build

      - name: Overlay our source files
        run: |
          cp -r paperless_scanner/lib         /tmp/build/
          cp    paperless_scanner/pubspec.yaml /tmp/build/
          sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>|' \
            /tmp/build/android/app/src/main/AndroidManifest.xml

      # Use broad patterns that match regardless of spacing or Groovy/Kotlin DSL variant
      - name: Patch SDK versions in build.gradle
        working-directory: /tmp/build/android/app
        run: |
          for f in build.gradle build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i 's/flutter\.minSdkVersion/23/g'      "$f"
            sed -i 's/flutter\.compileSdkVersion/35/g'  "$f"
            echo "=== $f after patch ===" && cat "$f"
          done

      - name: Get Flutter packages
        timeout-minutes: 5
        working-directory: /tmp/build
        run: flutter pub get

      - name: Build debug APK
        timeout-minutes: 20
        working-directory: /tmp/build
        run: flutter build apk --debug

      - name: List build output
        run: ls -lh /tmp/build/build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paperless-scanner
          path: /tmp/build/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
