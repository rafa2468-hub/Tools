name: Build Android APK

on:
  push:
    branches: [claude/mobile-document-scanner-EOLSL, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Pre-built image with Flutter, Android SDK, build-tools, and licenses
    # all ready to go. Skips ~10 min of setup time.
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Container runs as root; mark the checkout dir safe to avoid
      # "dubious ownership" errors from git inside the container.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory '*'

      - name: Show tool versions
        run: |
          flutter --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Scaffold Flutter project
        timeout-minutes: 3
        run: |
          flutter create \
            --project-name paperless_scanner \
            --org com.paperlessscanner \
            --platforms android \
            /tmp/build

      - name: Overlay our source files
        run: |
          cp -r paperless_scanner/lib          /tmp/build/
          cp    paperless_scanner/pubspec.yaml  /tmp/build/
          cp    paperless_scanner/android/app/src/main/AndroidManifest.xml \
                /tmp/build/android/app/src/main/AndroidManifest.xml

      - name: Patch minSdkVersion to 21
        working-directory: /tmp/build/android/app
        run: |
          if [ -f build.gradle ]; then
            sed -i 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 21/' build.gradle
          fi
          if [ -f build.gradle.kts ]; then
            sed -i 's/minSdk = flutter\.minSdkVersion/minSdk = 21/' build.gradle.kts
          fi

      - name: Resolve Flutter packages
        timeout-minutes: 5
        working-directory: /tmp/build
        run: flutter pub get

      - name: Build debug APK
        timeout-minutes: 20
        working-directory: /tmp/build
        run: flutter build apk --debug

      - name: List build output
        run: ls -lh /tmp/build/build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paperless-scanner
          path: /tmp/build/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
