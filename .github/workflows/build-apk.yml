name: Build Android APK

on:
  push:
    branches: [claude/mobile-document-scanner-EOLSL, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Cache Gradle downloads so re-runs finish faster
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Scaffold Flutter project
        timeout-minutes: 3
        run: |
          flutter create \
            --project-name paperless_scanner \
            --org com.paperlessscanner \
            --platforms android \
            /tmp/build

      - name: Overlay our source files
        run: |
          cp -r paperless_scanner/lib          /tmp/build/
          cp    paperless_scanner/pubspec.yaml  /tmp/build/
          # Replace the generated build.gradle.kts with ours (hardcoded SDK versions)
          cp paperless_scanner/android/build.gradle.kts \
             /tmp/build/android/app/build.gradle.kts
          # Add camera permission to the generated manifest
          sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>|' \
            /tmp/build/android/app/src/main/AndroidManifest.xml
          echo "--- build.gradle.kts after copy ---"
          grep -E "compileSdk|minSdk|targetSdk|namespace|applicationId" \
            /tmp/build/android/app/build.gradle.kts

      - name: Get Flutter packages
        timeout-minutes: 5
        working-directory: /tmp/build
        run: flutter pub get

      - name: Build debug APK
        id: build_apk
        timeout-minutes: 20
        working-directory: /tmp/build
        continue-on-error: true
        run: |
          flutter build apk --debug 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      # Runs only on failure; ordered so the most useful info is at the BOTTOM
      # (visible without scrolling up on a small screen).
      - name: Diagnose build failure
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "=== Last 50 lines of build log ==="
          tail -50 /tmp/build.log
          echo ""
          echo "=== Constraint / AAR errors (grep) ==="
          grep -E "Dependency '|requires.*version|Execution failed for task|minSdk|compileSdk" \
            /tmp/build.log | head -40 || echo "(no specific patterns matched)"
          exit 1

      - name: List build output
        run: ls -lh /tmp/build/build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paperless-scanner
          path: /tmp/build/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
