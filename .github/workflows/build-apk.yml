name: Build Paperless Scanner APK

# Builds only when the scanner (or this file) changes, not on every push.
on:
  push:
    branches: [main]
    paths:
      - 'paperless_scanner/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'paperless_scanner/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    # Pinned, like the music player's build, so a runner image change can't
    # break the build with no change on our side.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'

      # Pinned Flutter version: bump it on purpose, in its own change.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      # Cache Gradle downloads so re-runs finish faster
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Scaffold Flutter project
        timeout-minutes: 3
        run: |
          flutter create \
            --project-name paperless_scanner \
            --org com.paperlessscanner \
            --platforms android \
            /tmp/build

      - name: Overlay our source files
        run: |
          cp -r paperless_scanner/lib          /tmp/build/
          # Replace the template's test (it references a MyApp we don't have)
          rm -rf /tmp/build/test
          cp -r paperless_scanner/test         /tmp/build/
          cp    paperless_scanner/pubspec.yaml  /tmp/build/
          # flutter create leaves the template's own lock file; never use it.
          rm -f /tmp/build/pubspec.lock
          if [ -f paperless_scanner/pubspec.lock ]; then
            cp paperless_scanner/pubspec.lock /tmp/build/
          fi
          # Replace the generated app-level build file with ours (hardcoded SDK versions)
          cp paperless_scanner/android/build.gradle.kts \
             /tmp/build/android/app/build.gradle.kts

          # Permissions in the main manifest (the template only puts INTERNET
          # in the debug manifest). Fail loudly if the patch didn't land.
          MANIFEST=/tmp/build/android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <application|' "$MANIFEST"
          grep -q 'android.permission.INTERNET' "$MANIFEST"
          grep -q 'android.permission.CAMERA' "$MANIFEST"
          echo "--- manifest permissions ---"
          grep -E "uses-permission|uses-feature" "$MANIFEST"

          echo "--- app/build.gradle.kts after copy ---"
          grep -E "compileSdk|minSdk|targetSdk|namespace|applicationId" \
            /tmp/build/android/app/build.gradle.kts
          # (1.1.0 forced every plugin to compileSdk 35 and relaxed the JVM
          # target check here. Current plugins need newer SDKs, and the
          # app's build file now matches Flutter's template, so both are gone.)

      - name: Get Flutter packages
        timeout-minutes: 5
        working-directory: /tmp/build
        run: |
          if [ -f pubspec.lock ]; then
            flutter pub get --enforce-lockfile
          else
            echo "No committed pubspec.lock yet: resolving fresh (commit the uploaded one)."
            flutter pub get
          fi

      # The resolved lock file, so it can be committed and builds stay repeatable.
      - name: Upload pubspec.lock
        uses: actions/upload-artifact@v7
        with:
          name: pubspec-lock
          path: /tmp/build/pubspec.lock
          retention-days: 7

      - name: Analyze
        working-directory: /tmp/build
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: /tmp/build
        run: flutter test

      # Release build: smaller and faster than debug. Universal (all CPU
      # types), so it installs on any phone.
      - name: Build release APK
        id: build_apk
        timeout-minutes: 20
        working-directory: /tmp/build
        continue-on-error: true
        run: |
          flutter build apk --release 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      # Runs only on failure; ordered so the most useful info is at the BOTTOM
      # (visible without scrolling up on a small screen).
      - name: Diagnose build failure
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "=== Last 80 lines of build log ==="
          tail -80 /tmp/build.log
          echo ""
          echo "=== Constraint / AAR / compileSdk errors ==="
          grep -E "currently compiled against|compiled against version|requires.*compiled|minSdkVersion.*required|compileSdk|error:|Error:|FAILED|Exception" \
            /tmp/build.log | head -40 || echo "(no specific patterns matched)"
          exit 1

      # Same key on every build, so a new APK installs over the old one and
      # keeps the saved settings. The key lives in repo secrets, never in the
      # repo (it's public).
      - name: Re-sign APK with the app's own key
        env:
          KS_B64: ${{ secrets.PAPERLESS_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.PAPERLESS_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Signing secrets PAPERLESS_KEYSTORE_B64 / PAPERLESS_KEYSTORE_PASSWORD are missing."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/paperless.p12"
          APK=/tmp/build/build/app/outputs/flutter-apk/app-release.apk
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/paperless.p12" \
            --ks-type PKCS12 \
            --ks-pass env:KS_PASS \
            --ks-key-alias paperless \
            --key-pass env:KS_PASS \
            "$APK"
          rm -f "$RUNNER_TEMP/paperless.p12"
          echo "--- signing cert (must be identical across builds) ---"
          "$APKSIGNER" verify --print-certs "$APK" | grep -iE "certificate (SHA-256|DN)"
          VERSION=$(grep -E '^version:' paperless_scanner/pubspec.yaml | awk '{print $2}' | tr '+' '-')
          cp "$APK" "paperless-scanner-$VERSION.apk"
          ls -lh paperless-scanner-*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: paperless-scanner
          path: paperless-scanner-*.apk
          retention-days: 14
