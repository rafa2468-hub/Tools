name: Build Android APK

on:
  push:
    branches: [claude/mobile-document-scanner-EOLSL, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Cache Gradle downloads so re-runs finish faster
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Scaffold Flutter project
        timeout-minutes: 3
        run: |
          flutter create \
            --project-name paperless_scanner \
            --org com.paperlessscanner \
            --platforms android \
            /tmp/build

      - name: Overlay our source files
        run: |
          cp -r paperless_scanner/lib         /tmp/build/
          cp    paperless_scanner/pubspec.yaml /tmp/build/
          sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>|' \
            /tmp/build/android/app/src/main/AndroidManifest.xml

      - name: Patch and verify SDK versions
        working-directory: /tmp/build/android/app
        run: |
          for f in build.gradle build.gradle.kts; do
            [ -f "$f" ] || continue
            echo "--- Before patch: $f ---"
            grep -E "compileSdk|minSdk|targetSdk" "$f" || echo "(no SDK lines found)"
            sed -i 's/flutter\.minSdkVersion/23/g'     "$f"
            sed -i 's/flutter\.compileSdkVersion/35/g' "$f"
            sed -i 's/flutter\.targetSdkVersion/35/g'  "$f"
            echo "--- After patch: $f ---"
            grep -E "compileSdk|minSdk|targetSdk" "$f" || echo "(no SDK lines found)"
          done

      - name: Get Flutter packages
        timeout-minutes: 5
        working-directory: /tmp/build
        run: flutter pub get

      # Run flutter build; if Gradle fails, re-run Gradle directly with --info
      # so the actual error is visible in the log.
      - name: Build debug APK
        timeout-minutes: 20
        working-directory: /tmp/build
        run: |
          flutter build apk --debug 2>&1 || {
            echo ""
            echo "====== Flutter build failed — re-running Gradle with --info ======"
            cd android
            ./gradlew assembleDebug --info 2>&1 | \
              grep -E "(> |error:|Error:|FAILED|Exception|Could not|minCompile|minSdk|Unable|warning)" | \
              head -80
            exit 1
          }

      - name: List build output
        run: ls -lh /tmp/build/build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paperless-scanner
          path: /tmp/build/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
