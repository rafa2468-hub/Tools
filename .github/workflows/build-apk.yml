name: Build Android APK

on:
  push:
    branches: [claude/mobile-document-scanner-EOLSL, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4.5.0
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Cache Gradle downloads so re-runs finish faster
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Scaffold Flutter project
        timeout-minutes: 3
        run: |
          flutter create \
            --project-name paperless_scanner \
            --org com.paperlessscanner \
            --platforms android \
            /tmp/build

      - name: Overlay our source files
        run: |
          cp -r paperless_scanner/lib          /tmp/build/
          cp    paperless_scanner/pubspec.yaml  /tmp/build/
          # Replace the generated app-level build file with ours (hardcoded SDK versions)
          cp paperless_scanner/android/build.gradle.kts \
             /tmp/build/android/app/build.gradle.kts
          # Add camera permission to the generated manifest
          sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>|' \
            /tmp/build/android/app/src/main/AndroidManifest.xml
          # Diagnose: show what Gradle files were generated (Groovy vs Kotlin DSL)
          echo "--- Gradle files generated by flutter create ---"
          find /tmp/build/android -maxdepth 2 \( -name "*.gradle" -o -name "*.gradle.kts" \) | sort
          echo "--- app/build.gradle.kts after copy ---"
          grep -E "compileSdk|minSdk|targetSdk|namespace|applicationId" \
            /tmp/build/android/app/build.gradle.kts
          # Suppress Kotlin/Java JVM-target consistency check (turn ERROR → WARNING).
          # Flutter's Gradle plugin sets Kotlin to JVM 17; Java compileOptions stays at 1.8.
          echo "kotlin.jvm.target.validation.mode=WARNING" \
            >> /tmp/build/android/gradle.properties
          # Force ALL Android subprojects (Flutter plugins such as :printing, :cunning_document_scanner)
          # to compileSdk 35.  Plugins often ship with old compileSdkVersion values.
          # Use a Gradle init script — works regardless of whether the project-level build
          # file is Groovy (build.gradle) or Kotlin DSL (build.gradle.kts).
          mkdir -p "${HOME}/.gradle/init.d"
          {
            echo "allprojects {"
            echo "  afterEvaluate {"
            echo "    if (plugins.hasPlugin('com.android.library') || plugins.hasPlugin('com.android.application')) {"
            echo "      extensions.findByName('android')?.compileSdkVersion(35)"
            echo "    }"
            echo "  }"
            echo "}"
          } > "${HOME}/.gradle/init.d/compile-sdk.gradle"
          echo "--- init.d/compile-sdk.gradle ---"
          cat "${HOME}/.gradle/init.d/compile-sdk.gradle"

      - name: Get Flutter packages
        timeout-minutes: 5
        working-directory: /tmp/build
        run: flutter pub get

      - name: Build debug APK
        id: build_apk
        timeout-minutes: 20
        working-directory: /tmp/build
        continue-on-error: true
        run: |
          flutter build apk --debug 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      # Runs only on failure; ordered so the most useful info is at the BOTTOM
      # (visible without scrolling up on a small screen).
      - name: Diagnose build failure
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "=== Last 80 lines of build log ==="
          tail -80 /tmp/build.log
          echo ""
          echo "=== Constraint / AAR / compileSdk errors ==="
          grep -E "currently compiled against|compiled against version|requires.*compiled|minSdkVersion.*required|compileSdk|error:|Error:|FAILED|Exception" \
            /tmp/build.log | head -40 || echo "(no specific patterns matched)"
          echo ""
          echo "=== Dependency failure details ==="
          grep -A 2 "^      [0-9]*\. Dependency" /tmp/build.log | head -60 \
            || grep -A 2 "Dependency '.*' requires" /tmp/build.log | head -60 \
            || echo "(no dependency failure patterns matched)"
          exit 1

      - name: List build output
        run: ls -lh /tmp/build/build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paperless-scanner
          path: /tmp/build/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
