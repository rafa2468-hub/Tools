name: Build Android APK

on:
  push:
    branches: [claude/mobile-document-scanner-EOLSL, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Cache Gradle downloads so re-runs finish faster
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Scaffold Flutter project
        timeout-minutes: 3
        run: |
          flutter create \
            --project-name paperless_scanner \
            --org com.paperlessscanner \
            --platforms android \
            /tmp/build

      - name: Overlay our source files
        run: |
          cp -r paperless_scanner/lib         /tmp/build/
          cp    paperless_scanner/pubspec.yaml /tmp/build/
          sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>|' \
            /tmp/build/android/app/src/main/AndroidManifest.xml

      - name: Patch and verify SDK versions
        working-directory: /tmp/build/android/app
        run: |
          for f in build.gradle build.gradle.kts; do
            [ -f "$f" ] || continue
            echo "--- Before patch: $f ---"
            grep -E "compileSdk|minSdk|targetSdk" "$f" || echo "(no SDK lines found)"
            # Replace flutter.xxx property references
            sed -i 's/flutter\.minSdkVersion/29/g'     "$f"
            sed -i 's/flutter\.compileSdkVersion/35/g' "$f"
            sed -i 's/flutter\.targetSdkVersion/35/g'  "$f"
            # Also replace any hardcoded numeric values (Kotlin DSL: minSdk = N)
            sed -i 's/\bminSdk *= *[0-9][0-9]*/minSdk = 29/g'        "$f"
            sed -i 's/\bcompileSdk *= *[0-9][0-9]*/compileSdk = 35/g' "$f"
            sed -i 's/\btargetSdk *= *[0-9][0-9]*/targetSdk = 35/g'   "$f"
            # Groovy DSL variants (minSdkVersion N, no equals sign)
            sed -i 's/\bminSdkVersion [0-9][0-9]*/minSdkVersion 29/g'        "$f"
            sed -i 's/\bcompileSdkVersion [0-9][0-9]*/compileSdkVersion 35/g' "$f"
            sed -i 's/\btargetSdkVersion [0-9][0-9]*/targetSdkVersion 35/g'   "$f"
            echo "--- After patch: $f ---"
            grep -E "compileSdk|minSdk|targetSdk" "$f" || echo "(no SDK lines found)"
          done

      - name: Get Flutter packages
        timeout-minutes: 5
        working-directory: /tmp/build
        run: flutter pub get

      # Capture full output so we can tail it on failure — errors always appear
      # near the end of flutter/Gradle output, not the beginning.
      - name: Build debug APK
        id: build_apk
        timeout-minutes: 20
        working-directory: /tmp/build
        continue-on-error: true
        run: |
          flutter build apk --debug 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      # Separate step so it appears as its own expandable section in the UI.
      # Ordered so the most useful info is at the BOTTOM (visible on mobile).
      - name: Diagnose build failure
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "=== Last 40 lines of build log ==="
          tail -40 /tmp/build.log
          echo ""
          echo "=== Constraint / version errors (grep) ==="
          grep -E "Dependency '|requires.*version|Execution failed for task|minSdk|compileSdk" \
            /tmp/build.log | head -40 || echo "(no specific patterns matched)"
          echo ""
          echo "=== Patched build.gradle(.kts) — scroll here to verify SDK values ==="
          cat /tmp/build/android/app/build.gradle.kts 2>/dev/null \
            || cat /tmp/build/android/app/build.gradle 2>/dev/null \
            || echo "(file not found)"
          exit 1

      - name: List build output
        run: ls -lh /tmp/build/build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paperless-scanner
          path: /tmp/build/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
