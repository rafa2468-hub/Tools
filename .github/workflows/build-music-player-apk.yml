name: Build Music Player APK

on:
  push:
    branches: [claude/music-player-apk, main]
    paths:
      - 'music-player/**'
      - 'music-player-app/**'
      - '.github/workflows/build-music-player-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Needed so the build can publish the APK as a GitHub Release asset.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # Cache Gradle downloads so re-runs finish faster
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('music-player-app/package.json') }}
          restore-keys: gradle-

      - name: Install Capacitor deps
        working-directory: music-player-app
        run: npm install

      - name: Stage web assets into www/
        working-directory: music-player-app
        run: |
          rm -rf www && mkdir -p www
          cp -r ../music-player/. www/
          echo "--- www contents ---"
          ls -la www

      - name: Add Android platform
        working-directory: music-player-app
        run: npx cap add android

      - name: Apply custom MainActivity + AudioFocus plugin
        working-directory: music-player-app
        run: |
          dest="android/app/src/main/java/com/brokis/musicplayer"
          mkdir -p "$dest"
          cp MainActivity.java "$dest/MainActivity.java"
          cp AudioFocusPlugin.java "$dest/AudioFocusPlugin.java"
          cp NativePlayerPlugin.java "$dest/NativePlayerPlugin.java"
          echo "--- copied java sources ---"; ls -1 "$dest"

      - name: Add media-playback foreground-service permissions to manifest
        working-directory: music-player-app
        run: |
          M="android/app/src/main/AndroidManifest.xml"
          # The media-session plugin runs a foregroundServiceType=mediaPlayback
          # service; Android 14 (targetSdk 34) requires these permissions declared.
          sed -i '/android.permission.INTERNET/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.WAKE_LOCK"/>' "$M"
          echo "--- manifest permissions ---"; grep -i "uses-permission" "$M"

      - name: Generate launcher icons from the PWA icon (best-effort)
        working-directory: music-player-app
        continue-on-error: true
        run: |
          mkdir -p resources
          cp ../music-player/icons/icon-512.png resources/icon.png
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#0b0b10' \
            --iconBackgroundColorDark '#0b0b10'

      - name: Sync web assets into the Android project
        working-directory: music-player-app
        run: npx cap sync android

      - name: Build debug APK
        id: build_apk
        working-directory: music-player-app/android
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Diagnose build failure
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "=== Last 80 lines of build log ==="
          tail -80 /tmp/build.log
          echo ""
          echo "=== Error / SDK lines ==="
          grep -E "error:|Error:|FAILED|Exception|compileSdk|minSdk|Could not|not found" /tmp/build.log | head -40 || echo "(no patterns matched)"
          exit 1

      - name: Re-sign APK with the committed keystore (deterministic signature)
        run: |
          APK="music-player-app/android/app/build/outputs/apk/debug/app-debug.apk"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          # Strip Gradle's per-run debug signature and re-sign with OUR fixed key.
          # apksigner is deterministic: same keystore in -> same signing cert out,
          # so updates install in place across every build.
          "$APKSIGNER" sign \
            --ks "$GITHUB_WORKSPACE/music-player-app/debug.keystore" \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            "$APK"
          echo "--- signing cert (must be identical across builds) ---"
          "$APKSIGNER" verify --print-certs "$APK" | grep -iE "certificate (SHA-256|DN)" || "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" music-player-debug.apk

      - name: Stage APK artifact
        run: test -f music-player-debug.apk && echo "APK staged"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: music-player-apk
          path: music-player-debug.apk
          retention-days: 30

      # Read the app version so the release is labelled with it.
      - name: Read app version
        id: ver
        run: |
          V=$(grep -oE "APP_VERSION = '[^']+'" music-player/index.html | head -1 | sed "s/.*'\([^']*\)'.*/\1/")
          [ -n "$V" ] || V="unknown"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "App version: $V"

      # Publish the APK to a fixed 'music-player-latest' release so there's a
      # stable, phone-friendly download URL that always points at the newest
      # build — no zip, no login, tap-to-install. Only on main.
      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: music-player-latest
          name: Music Player APK (latest)
          body: |
            Latest **Music Player** debug APK — **v${{ steps.ver.outputs.version }}**
            (commit ${{ github.sha }}).

            Tap **music-player-debug.apk** below to download and install on your
            phone. It installs over any previous build (same debug signing key),
            so your library, Jellyfin login and favourites are preserved.
          files: music-player-debug.apk
          make_latest: true
