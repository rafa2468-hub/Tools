<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Music">
<meta name="mobile-web-app-capable" content="yes">
<title>Music Player</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>
  :root {
    --bg: #0b0b10;
    --bg-2: #15151d;
    --surface: #1d1d27;
    --text: #f2f2f5;
    --muted: #9b9bb0;
    --accent: #7c5cff;
    --accent-2: #4ad6ff;
    --danger: #ff5d6c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(140% 90% at 50% 0%, #21214a 0%, var(--bg) 55%, #06060a 100%);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    overscroll-behavior: contain;
    user-select: none;
    -webkit-user-select: none;
  }
  header {
    padding: 16px 18px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .header-actions { display: flex; gap: 6px; }
  .pick-btn {
    appearance: none;
    border: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(124, 92, 255, 0.35);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .pick-btn.ghost {
    background: rgba(255,255,255,0.08);
    color: var(--text);
    box-shadow: none;
    font-weight: 500;
  }
  .pick-btn:active { transform: translateY(1px); }
  .pick-btn input { display: none; }
  .pick-btn svg { width: 14px; height: 14px; fill: currentColor; }

  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  .now-playing {
    padding: 8px 18px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
  }
  .artwork {
    width: min(58vw, 260px);
    aspect-ratio: 1 / 1;
    border-radius: 22px;
    background:
      radial-gradient(120% 120% at 30% 20%, rgba(124,92,255,0.7), rgba(74,214,255,0.3) 60%, rgba(0,0,0,0.4) 100%),
      var(--surface);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.85);
    overflow: hidden;
  }
  .artwork svg { width: 38%; height: 38%; opacity: 0.85; }
  .track-meta { width: 100%; padding: 0 8px; }
  .track-title {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .track-sub {
    font-size: 13px;
    color: var(--muted);
    margin: 4px 0 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .progress-wrap { padding: 0 18px; width: 100%; }
  .progress {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    height: 24px;
  }
  .progress::-webkit-slider-runnable-track {
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 999px;
  }
  .progress::-moz-range-track {
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 999px;
  }
  .progress::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    margin-top: -5px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .progress::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    border: 0;
  }
  .times {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 14px 18px 4px;
  }
  .ctrl {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .ctrl svg { width: 26px; height: 26px; fill: currentColor; }
  .ctrl.toggle.active { color: var(--accent-2); }
  .ctrl:active { background: rgba(255,255,255,0.08); }
  .ctrl.play {
    width: 72px;
    height: 72px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    box-shadow: 0 12px 30px rgba(124, 92, 255, 0.4);
  }
  .ctrl.play svg { width: 32px; height: 32px; }

  .volume-row {
    padding: 6px 18px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
  }
  .volume-row svg { width: 18px; height: 18px; fill: currentColor; }
  .volume-row input[type=range] { flex: 1; }

  .library {
    flex: 1;
    min-height: 160px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: rgba(255,255,255,0.02);
    border-top: 1px solid rgba(255,255,255,0.06);
    padding-bottom: 8px;
  }
  .tabs {
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(11, 11, 16, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    padding: 8px 12px;
    gap: 4px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .tab {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .tab.active { background: rgba(124,92,255,0.18); color: var(--text); }
  .tabs .spacer { flex: 1; }
  .tabs .clear-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 11px;
    cursor: pointer;
  }
  .tabs .clear-btn:active { background: rgba(255,255,255,0.08); }

  .back-row {
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(11, 11, 16, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .back-btn {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .back-btn:active { background: rgba(255,255,255,0.08); }
  .back-btn svg { width: 22px; height: 22px; fill: currentColor; }
  .back-title { flex: 1; min-width: 0; }
  .back-title h2 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .back-title .meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
  }
  .play-album-btn {
    appearance: none;
    border: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .play-album-btn svg { width: 12px; height: 12px; fill: currentColor; }
  .play-album-btn:active { transform: translateY(1px); }

  .album-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 14px;
  }
  .album-card {
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: column;
  }
  .album-card:active { transform: scale(0.98); }
  .album-art {
    aspect-ratio: 1 / 1;
    background:
      radial-gradient(120% 120% at 30% 20%, rgba(124,92,255,0.7), rgba(74,214,255,0.3) 60%, rgba(0,0,0,0.4) 100%),
      var(--bg-2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.7);
  }
  .album-art svg { width: 38%; height: 38%; fill: currentColor; }
  .album-name {
    font-size: 13px;
    font-weight: 600;
    padding: 8px 10px 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .album-count {
    font-size: 11px;
    color: var(--muted);
    padding: 0 10px 10px;
  }

  .track {
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    border-left: 3px solid transparent;
  }
  .track:active { background: rgba(255,255,255,0.06); }
  .track.playing { border-left-color: var(--accent-2); background: rgba(124,92,255,0.08); }
  .track-num {
    width: 24px;
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .track-info { flex: 1; min-width: 0; }
  .track-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 14px;
  }
  .track-album-sub {
    font-size: 11px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 2px;
  }
  .track-menu {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .track-menu:active { background: rgba(255,255,255,0.08); }
  .track-menu svg { width: 18px; height: 18px; fill: currentColor; }
  .track.playing .track-name { color: var(--accent-2); font-weight: 600; }

  .empty {
    color: var(--muted);
    text-align: center;
    padding: 32px 24px;
    font-size: 14px;
    line-height: 1.5;
  }
  .empty .hint { font-size: 12px; margin-top: 6px; opacity: 0.8; }

  .install-banner {
    margin: 8px 18px 0;
    padding: 10px 14px;
    background: rgba(124, 92, 255, 0.12);
    border: 1px solid rgba(124, 92, 255, 0.3);
    border-radius: 12px;
    font-size: 12px;
    color: var(--text);
    display: none;
    align-items: center;
    gap: 10px;
  }
  .install-banner.visible { display: flex; }
  .install-banner button {
    appearance: none;
    border: 0;
    background: var(--accent);
    color: #fff;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    margin-left: auto;
  }
  .install-banner .dismiss {
    background: transparent;
    color: var(--muted);
    padding: 6px 8px;
    margin-left: 4px;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom) + 24px);
    transform: translateX(-50%) translateY(20px);
    background: rgba(20, 20, 30, 0.95);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 10px 14px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 100;
  }
  .toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 200;
  }
  .sheet-backdrop.visible { display: flex; }
  .sheet {
    background: var(--bg-2);
    border-radius: 18px 18px 0 0;
    width: 100%;
    max-width: 480px;
    padding: 12px 0 max(12px, env(safe-area-inset-bottom));
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .sheet-title {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    padding: 8px 16px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .sheet-action {
    display: block;
    width: 100%;
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text);
    text-align: left;
    padding: 14px 18px;
    font-size: 15px;
    cursor: pointer;
  }
  .sheet-action:active { background: rgba(255,255,255,0.06); }
  .sheet-action.danger { color: var(--danger); }
  .sheet-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 4px 0; }

  @media (min-width: 720px) {
    body { padding: 0; }
    main, header { max-width: 480px; margin-left: auto; margin-right: auto; width: 100%; }
    .album-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<header>
  <h1>Music</h1>
  <div class="header-actions">
    <label class="pick-btn ghost" id="folder-pick" hidden>
      <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
      Folder
      <input id="folder-input" type="file" webkitdirectory directory multiple>
    </label>
    <label class="pick-btn">
      Add files
      <input id="file-input" type="file" accept="audio/*,.mp3,.m4a,.aac,.ogg,.oga,.opus,.wav,.flac,.wma,.webm" multiple>
    </label>
  </div>
</header>

<div class="install-banner" id="install-banner" role="region" aria-label="Install app">
  <span>Install this player as an app on your home screen</span>
  <button id="install-btn" type="button">Install</button>
  <button class="dismiss" id="install-dismiss" type="button" aria-label="Dismiss">×</button>
</div>

<main>
  <section class="now-playing">
    <div class="artwork" id="artwork">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
    </div>
    <div class="track-meta">
      <p class="track-title" id="title">No track loaded</p>
      <p class="track-sub" id="subtitle">Tap "Add files" to load music</p>
    </div>
  </section>

  <div class="progress-wrap">
    <input id="seek" class="progress" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
    <div class="times">
      <span id="current">0:00</span>
      <span id="duration">0:00</span>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl toggle" id="shuffle" type="button" aria-label="Shuffle" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
    </button>
    <button class="ctrl" id="prev" type="button" aria-label="Previous">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6V6zm3.5 6 8.5 6V6l-8.5 6z"/></svg>
    </button>
    <button class="ctrl play" id="play" type="button" aria-label="Play">
      <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="ctrl" id="next" type="button" aria-label="Next">
      <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2V6zM6 18l8.5-6L6 6v12z"/></svg>
    </button>
    <button class="ctrl toggle" id="repeat" type="button" aria-label="Repeat" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
    </button>
  </div>

  <div class="volume-row">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
  </div>

  <section class="library" id="library">
    <div class="tabs" id="tabs">
      <button class="tab active" data-view="albums" type="button">Albums</button>
      <button class="tab" data-view="songs" type="button">Songs</button>
      <div class="spacer"></div>
      <button class="clear-btn" id="clear" type="button">Clear all</button>
    </div>
    <div id="view"></div>
  </section>
</main>

<div class="sheet-backdrop" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet" id="sheet-body"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<audio id="audio" preload="metadata"></audio>

<script>
"use strict";

/* ---------- IndexedDB persistence ---------- */
const DB_NAME = 'music-player-db';
const DB_VERSION = 1;
const STORE = 'tracks';
const UNSORTED = 'Unsorted';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) {
        const store = db.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
        store.createIndex('addedAt', 'addedAt');
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbAll(db) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).index('addedAt').getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

function idbAdd(db, record) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).add(record);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbPut(db, record) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).put(record);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbDelete(db, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function idbClear(db) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

/* ---------- DOM refs ---------- */
const audio = document.getElementById('audio');
const fileInput = document.getElementById('file-input');
const folderInput = document.getElementById('folder-input');
const folderPickLabel = document.getElementById('folder-pick');
const titleEl = document.getElementById('title');
const subtitleEl = document.getElementById('subtitle');
const seek = document.getElementById('seek');
const currentEl = document.getElementById('current');
const durationEl = document.getElementById('duration');
const playBtn = document.getElementById('play');
const playIcon = document.getElementById('play-icon');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const shuffleBtn = document.getElementById('shuffle');
const repeatBtn = document.getElementById('repeat');
const volume = document.getElementById('volume');
const view = document.getElementById('view');
const tabs = document.getElementById('tabs');
const clearBtn = document.getElementById('clear');
const toast = document.getElementById('toast');
const sheetBackdrop = document.getElementById('sheet');
const sheetBody = document.getElementById('sheet-body');

const PLAY_ICON = '<path d="M8 5v14l11-7z"/>';
const PAUSE_ICON = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
const PREFS_KEY = 'music-player-prefs';

/* ---------- State ---------- */
const state = {
  tracks: [],          // master list, indexed by position
  currentIndex: -1,    // index into state.tracks
  shuffle: false,
  repeat: 'off',
  queue: [],           // array of track indices to play in order
  queuePos: -1,        // position in queue
  seeking: false,
  view: 'albums',      // 'albums' | 'songs' | 'album-detail'
  currentAlbum: null,  // album name when view === 'album-detail'
  db: null,
};

/* ---------- Feature detection ---------- */
// webkitdirectory works on desktop and Android Chromium; not on iOS Safari.
{
  const supports = 'webkitdirectory' in folderInput || 'directory' in folderInput;
  // Best heuristic for iOS: known UA strings. webkitdirectory the attribute exists but
  // the picker does not in iOS Safari, so also gate on non-iOS.
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  if (supports && !isIOS) {
    folderPickLabel.hidden = false;
  }
}

/* ---------- Prefs ---------- */
function loadPrefs() {
  try {
    const raw = localStorage.getItem(PREFS_KEY);
    if (!raw) return;
    const p = JSON.parse(raw);
    if (typeof p.volume === 'number') {
      audio.volume = p.volume;
      volume.value = String(p.volume);
    }
    if (typeof p.shuffle === 'boolean') {
      state.shuffle = p.shuffle;
      shuffleBtn.classList.toggle('active', p.shuffle);
      shuffleBtn.setAttribute('aria-pressed', String(p.shuffle));
    }
    if (typeof p.repeat === 'string' && ['off','all','one'].includes(p.repeat)) {
      state.repeat = p.repeat;
      applyRepeatVisual();
    }
  } catch (e) { /* ignore */ }
}

function savePrefs() {
  try {
    localStorage.setItem(PREFS_KEY, JSON.stringify({
      volume: audio.volume,
      shuffle: state.shuffle,
      repeat: state.repeat,
    }));
  } catch (e) { /* ignore */ }
}

function applyRepeatVisual() {
  const active = state.repeat !== 'off';
  repeatBtn.classList.toggle('active', active);
  repeatBtn.setAttribute('aria-pressed', String(active));
  repeatBtn.title = `Repeat: ${state.repeat}`;
  repeatBtn.innerHTML = state.repeat === 'one'
    ? '<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm6 11v-5h-1l-2 1v1h1.5v3H13zm4-1H7v-4l-4 4 4 4v-3h12v-4h-2v3z"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>';
}

/* ---------- Utilities ---------- */
let toastTimer = null;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('visible'), 2400);
}

function formatTime(s) {
  if (!isFinite(s) || s < 0) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

function formatBytes(b) {
  if (b < 1024) return `${b} B`;
  if (b < 1024 * 1024) return `${(b / 1024).toFixed(1)} KB`;
  return `${(b / (1024 * 1024)).toFixed(1)} MB`;
}

function titleFromName(name) {
  const stripped = name.replace(/\.[^.]+$/, '');
  return stripped.replace(/^\d+[\s._-]+/, '').trim() || name;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// Derive album name from a File's webkitRelativePath. For
// "Artist/Album/01 Track.mp3" returns "Album". For "Album/01 Track.mp3" returns
// "Album". For files without a path, returns UNSORTED.
function deriveAlbum(file) {
  const path = file.webkitRelativePath || '';
  if (!path) return UNSORTED;
  const parts = path.split('/').filter(Boolean);
  if (parts.length >= 3) return parts[parts.length - 2];
  if (parts.length === 2) return parts[0];
  return UNSORTED;
}

function albumOf(track) { return track.album || UNSORTED; }

function groupedAlbums() {
  const map = new Map();
  state.tracks.forEach((t, i) => {
    const a = albumOf(t);
    if (!map.has(a)) map.set(a, []);
    map.get(a).push(i);
  });
  // Sort albums alphabetically; UNSORTED at the end.
  const names = Array.from(map.keys()).sort((a, b) => {
    if (a === UNSORTED) return 1;
    if (b === UNSORTED) return -1;
    return a.localeCompare(b, undefined, { sensitivity: 'base' });
  });
  return names.map(name => ({ name, indices: map.get(name) }));
}

/* ---------- Queue management ---------- */
function setQueue(indices, startIndex) {
  // indices: array of track indices into state.tracks
  // startIndex: which track to play first (a value present in indices)
  let queue = indices.slice();
  if (state.shuffle) {
    for (let i = queue.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [queue[i], queue[j]] = [queue[j], queue[i]];
    }
    if (startIndex !== undefined && startIndex !== null) {
      const pos = queue.indexOf(startIndex);
      if (pos > 0) {
        [queue[0], queue[pos]] = [queue[pos], queue[0]];
      }
    }
  }
  state.queue = queue;
  if (startIndex !== undefined && startIndex !== null) {
    state.queuePos = queue.indexOf(startIndex);
  } else {
    state.queuePos = queue.length > 0 ? 0 : -1;
  }
}

function reshuffleQueueKeepingCurrent() {
  if (state.queue.length === 0) return;
  const current = state.queuePos >= 0 ? state.queue[state.queuePos] : null;
  const indices = state.queue.slice();
  if (state.shuffle) {
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    if (current !== null) {
      const pos = indices.indexOf(current);
      if (pos > 0) [indices[0], indices[pos]] = [indices[pos], indices[0]];
    }
  } else {
    indices.sort((a, b) => a - b);
  }
  state.queue = indices;
  if (current !== null) state.queuePos = indices.indexOf(current);
}

/* ---------- View rendering ---------- */
function render() {
  // Update tab visuals
  tabs.querySelectorAll('.tab').forEach(t => {
    const active = t.dataset.view === state.view || (state.view === 'album-detail' && t.dataset.view === 'albums');
    t.classList.toggle('active', active);
  });
  // Toggle sticky header type
  if (state.view === 'album-detail') {
    tabs.style.display = 'none';
  } else {
    tabs.style.display = '';
  }

  if (state.tracks.length === 0) {
    view.innerHTML = '<div class="empty">Your library is empty.<div class="hint">Pick audio files or a folder — they\'re stored locally on your phone, not uploaded anywhere.</div></div>';
    return;
  }

  if (state.view === 'albums') renderAlbumsGrid();
  else if (state.view === 'songs') renderSongsList();
  else if (state.view === 'album-detail') renderAlbumDetail();
}

function renderAlbumsGrid() {
  const albums = groupedAlbums();
  if (albums.length === 0) {
    view.innerHTML = '<div class="empty">No albums yet.</div>';
    return;
  }
  const html = '<div class="album-grid">' + albums.map(a => `
    <div class="album-card" data-album="${escapeHtml(a.name)}">
      <div class="album-art">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
      </div>
      <div class="album-name">${escapeHtml(a.name)}</div>
      <div class="album-count">${a.indices.length} track${a.indices.length === 1 ? '' : 's'}</div>
    </div>
  `).join('') + '</div>';
  view.innerHTML = html;
}

function renderAlbumDetail() {
  const album = state.currentAlbum;
  const indices = state.tracks
    .map((t, i) => albumOf(t) === album ? i : -1)
    .filter(i => i !== -1);
  if (indices.length === 0) {
    // Album disappeared (last track removed) — bounce back
    state.view = 'albums';
    state.currentAlbum = null;
    render();
    return;
  }
  const header = `
    <div class="back-row">
      <button class="back-btn" id="back" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div class="back-title">
        <h2>${escapeHtml(album)}</h2>
        <div class="meta">${indices.length} track${indices.length === 1 ? '' : 's'}</div>
      </div>
      <button class="play-album-btn" id="play-album" type="button">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Play
      </button>
    </div>
  `;
  const list = indices.map((i, n) => trackRow(i, n + 1, false)).join('');
  view.innerHTML = header + list;
}

function renderSongsList() {
  const html = state.tracks.map((t, i) => trackRow(i, i + 1, true)).join('');
  view.innerHTML = html;
}

function trackRow(trackIndex, number, showAlbumSub) {
  const t = state.tracks[trackIndex];
  const playing = trackIndex === state.currentIndex;
  const sub = showAlbumSub
    ? `<div class="track-album-sub">${escapeHtml(albumOf(t))}</div>`
    : '';
  return `
    <div class="track${playing ? ' playing' : ''}" data-track="${trackIndex}">
      <span class="track-num">${number}</span>
      <div class="track-info">
        <div class="track-name">${escapeHtml(t.title)}</div>
        ${sub}
      </div>
      <button class="track-menu" data-menu="${trackIndex}" aria-label="Track menu" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      </button>
    </div>
  `;
}

/* ---------- Track sheet (per-track menu) ---------- */
function openTrackSheet(trackIndex) {
  const t = state.tracks[trackIndex];
  if (!t) return;
  const albums = groupedAlbums().map(a => a.name).filter(n => n !== albumOf(t));
  sheetBody.innerHTML = `
    <div class="sheet-title">${escapeHtml(t.title)}</div>
    <button class="sheet-action" data-act="play">Play</button>
    <button class="sheet-action" data-act="rename">Rename track…</button>
    <button class="sheet-action" data-act="move">Move to album…</button>
    <div class="sheet-divider"></div>
    <button class="sheet-action danger" data-act="remove">Remove from library</button>
    <button class="sheet-action" data-act="cancel" style="text-align:center;color:var(--muted)">Cancel</button>
  `;
  sheetBackdrop.classList.add('visible');
  sheetBackdrop.dataset.track = String(trackIndex);
}

function closeSheet() {
  sheetBackdrop.classList.remove('visible');
  delete sheetBackdrop.dataset.track;
  sheetBody.innerHTML = '';
}

async function handleSheetAction(act, trackIndex) {
  const t = state.tracks[trackIndex];
  if (!t) { closeSheet(); return; }
  if (act === 'play') {
    closeSheet();
    playTrackFromCurrentView(trackIndex);
  } else if (act === 'rename') {
    closeSheet();
    const next = prompt('Rename track', t.title);
    if (next !== null) {
      const trimmed = next.trim();
      if (trimmed) {
        t.title = trimmed;
        await persistTrack(t);
        if (trackIndex === state.currentIndex) titleEl.textContent = trimmed;
        render();
      }
    }
  } else if (act === 'move') {
    closeSheet();
    const existing = groupedAlbums().map(a => a.name).filter(n => n !== albumOf(t));
    const hint = existing.length ? `\n\nExisting albums:\n• ${existing.join('\n• ')}` : '';
    const next = prompt(`Move "${t.title}" to album:${hint}`, albumOf(t));
    if (next !== null) {
      const trimmed = next.trim() || UNSORTED;
      t.album = trimmed;
      await persistTrack(t);
      render();
      showToast(`Moved to "${trimmed}"`);
    }
  } else if (act === 'remove') {
    closeSheet();
    removeTrack(trackIndex);
  } else {
    closeSheet();
  }
}

async function persistTrack(t) {
  try {
    await idbPut(state.db, t);
  } catch (e) {
    console.error('Persist failed', e);
    showToast('Could not save change');
  }
}

/* ---------- Playback ---------- */
function loadTrack(index, autoplay) {
  if (index < 0 || index >= state.tracks.length) return;
  state.currentIndex = index;
  const track = state.tracks[index];
  audio.src = track.url;
  titleEl.textContent = track.title;
  subtitleEl.textContent = albumOf(track) === UNSORTED
    ? formatBytes(track.size || 0)
    : albumOf(track);
  render();
  updateMediaSession();
  if (autoplay) audio.play().catch(() => {});
}

function playTrackFromCurrentView(trackIndex) {
  // Queue depends on the current view.
  if (state.view === 'album-detail' && state.currentAlbum) {
    const album = state.currentAlbum;
    const indices = state.tracks
      .map((t, i) => albumOf(t) === album ? i : -1)
      .filter(i => i !== -1);
    setQueue(indices, trackIndex);
  } else {
    // Songs view or albums grid play-all: queue all tracks
    const indices = state.tracks.map((_, i) => i);
    setQueue(indices, trackIndex);
  }
  loadTrack(trackIndex, true);
}

function playPause() {
  if (state.currentIndex === -1 && state.tracks.length > 0) {
    const indices = state.tracks.map((_, i) => i);
    setQueue(indices, indices[0]);
    loadTrack(state.queue[0], true);
    return;
  }
  if (audio.paused) audio.play().catch(() => {});
  else audio.pause();
}

function nextTrack(auto) {
  if (state.tracks.length === 0 || state.queue.length === 0) return;
  if (state.repeat === 'one' && auto) {
    audio.currentTime = 0;
    audio.play().catch(() => {});
    return;
  }
  let pos = state.queuePos + 1;
  if (pos >= state.queue.length) {
    if (state.repeat === 'all' || !auto) {
      pos = 0;
      if (state.shuffle) reshuffleQueueKeepingCurrent();
    } else {
      audio.pause();
      return;
    }
  }
  state.queuePos = pos;
  loadTrack(state.queue[pos], true);
}

function prevTrack() {
  if (state.tracks.length === 0 || state.queue.length === 0) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  let pos = state.queuePos - 1;
  if (pos < 0) pos = state.queue.length - 1;
  state.queuePos = pos;
  loadTrack(state.queue[pos], true);
}

/* ---------- File ingestion ---------- */
async function addFiles(files) {
  const audioFiles = Array.from(files).filter(f =>
    f.type.startsWith('audio/') || /\.(mp3|m4a|aac|ogg|oga|opus|wav|flac|wma|webm)$/i.test(f.name)
  );
  if (audioFiles.length === 0) {
    showToast('No supported audio files in selection');
    return;
  }
  audioFiles.sort((a, b) => {
    const ap = a.webkitRelativePath || a.name;
    const bp = b.webkitRelativePath || b.name;
    return ap.localeCompare(bp, undefined, { numeric: true, sensitivity: 'base' });
  });
  const startedEmpty = state.tracks.length === 0;

  for (const file of audioFiles) {
    const record = {
      name: file.name,
      title: titleFromName(file.name),
      album: deriveAlbum(file),
      type: file.type || 'audio/mpeg',
      size: file.size,
      addedAt: Date.now(),
      blob: file,
    };
    try {
      const id = await idbAdd(state.db, record);
      record.id = id;
      record.url = URL.createObjectURL(record.blob);
      state.tracks.push(record);
    } catch (err) {
      console.error('Failed to store track', file.name, err);
      showToast(`Couldn't save "${file.name}"`);
    }
  }
  render();
  if (startedEmpty && state.tracks.length > 0) {
    const indices = state.tracks.map((_, i) => i);
    setQueue(indices, indices[0]);
    loadTrack(indices[0], false);
  }
  showToast(`Added ${audioFiles.length} track${audioFiles.length === 1 ? '' : 's'}`);
}

async function removeTrack(index) {
  if (index < 0 || index >= state.tracks.length) return;
  const track = state.tracks[index];
  const wasPlaying = index === state.currentIndex && !audio.paused;
  const wasCurrent = index === state.currentIndex;

  try { await idbDelete(state.db, track.id); } catch (e) { /* ignore */ }
  URL.revokeObjectURL(track.url);
  state.tracks.splice(index, 1);

  // Fix up state.currentIndex and queue indices after removal.
  state.queue = state.queue.filter(i => i !== index).map(i => i > index ? i - 1 : i);
  if (wasCurrent) {
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
    state.currentIndex = -1;
    titleEl.textContent = 'No track loaded';
    subtitleEl.textContent = state.tracks.length ? 'Tap a track to play' : 'Tap "Add files" to load music';
    if (state.queue.length > 0) {
      state.queuePos = Math.min(state.queuePos, state.queue.length - 1);
      if (state.queuePos < 0) state.queuePos = 0;
      loadTrack(state.queue[state.queuePos], wasPlaying);
    } else {
      state.queuePos = -1;
    }
  } else if (state.currentIndex > index) {
    state.currentIndex--;
    // queuePos refers to position within queue, not affected by reindexing tracks
  }
  render();
}

async function clearPlaylist() {
  for (const t of state.tracks) URL.revokeObjectURL(t.url);
  state.tracks = [];
  state.currentIndex = -1;
  state.queue = [];
  state.queuePos = -1;
  try { await idbClear(state.db); } catch (e) { /* ignore */ }
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
  titleEl.textContent = 'No track loaded';
  subtitleEl.textContent = 'Tap "Add files" to load music';
  state.view = 'albums';
  state.currentAlbum = null;
  render();
}

function updateMediaSession() {
  if (!('mediaSession' in navigator)) return;
  const track = state.tracks[state.currentIndex];
  if (!track) { navigator.mediaSession.metadata = null; return; }
  navigator.mediaSession.metadata = new MediaMetadata({
    title: track.title,
    artist: '',
    album: albumOf(track) === UNSORTED ? '' : albumOf(track),
  });
}

async function restoreLibrary() {
  try {
    state.db = await openDB();
    const records = await idbAll(state.db);
    let needsMigration = false;
    for (const r of records) {
      if (!r.album) {
        r.album = UNSORTED;
        needsMigration = true;
      }
      r.url = URL.createObjectURL(r.blob);
      state.tracks.push(r);
    }
    if (needsMigration) {
      for (const r of state.tracks) {
        if (r.album === UNSORTED) await idbPut(state.db, r).catch(() => {});
      }
    }
    if (state.tracks.length > 0) {
      const indices = state.tracks.map((_, i) => i);
      setQueue(indices, indices[0]);
      loadTrack(indices[0], false);
    } else {
      render();
    }
  } catch (err) {
    console.error('Failed to open library', err);
    showToast('Could not load saved library');
    render();
  }
}

/* ---------- Event wiring ---------- */
fileInput.addEventListener('change', e => {
  addFiles(e.target.files);
  fileInput.value = '';
});
folderInput.addEventListener('change', e => {
  addFiles(e.target.files);
  folderInput.value = '';
});

playBtn.addEventListener('click', playPause);
nextBtn.addEventListener('click', () => nextTrack(false));
prevBtn.addEventListener('click', prevTrack);

shuffleBtn.addEventListener('click', () => {
  state.shuffle = !state.shuffle;
  shuffleBtn.classList.toggle('active', state.shuffle);
  shuffleBtn.setAttribute('aria-pressed', String(state.shuffle));
  reshuffleQueueKeepingCurrent();
  savePrefs();
});

repeatBtn.addEventListener('click', () => {
  state.repeat = state.repeat === 'off' ? 'all' : state.repeat === 'all' ? 'one' : 'off';
  applyRepeatVisual();
  savePrefs();
});

volume.addEventListener('input', () => {
  audio.volume = Number(volume.value);
  savePrefs();
});

seek.addEventListener('input', () => { state.seeking = true; });
seek.addEventListener('change', () => {
  if (audio.duration) audio.currentTime = (Number(seek.value) / 1000) * audio.duration;
  state.seeking = false;
});

audio.addEventListener('timeupdate', () => {
  if (state.seeking) return;
  if (audio.duration) seek.value = String(Math.floor((audio.currentTime / audio.duration) * 1000));
  currentEl.textContent = formatTime(audio.currentTime);
  if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession && audio.duration) {
    try {
      navigator.mediaSession.setPositionState({
        duration: audio.duration,
        playbackRate: audio.playbackRate,
        position: audio.currentTime,
      });
    } catch (e) { /* iOS may reject */ }
  }
});
audio.addEventListener('loadedmetadata', () => {
  durationEl.textContent = formatTime(audio.duration);
});
audio.addEventListener('play', () => {
  playIcon.innerHTML = PAUSE_ICON;
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
});
audio.addEventListener('pause', () => {
  playIcon.innerHTML = PLAY_ICON;
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
});
audio.addEventListener('ended', () => nextTrack(true));
audio.addEventListener('error', () => {
  showToast('Playback error — skipping');
  setTimeout(() => nextTrack(true), 500);
});

tabs.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  state.view = tab.dataset.view;
  state.currentAlbum = null;
  view.scrollTop = 0;
  render();
});

view.addEventListener('click', e => {
  const menu = e.target.closest('.track-menu');
  if (menu) {
    e.stopPropagation();
    const idx = Number(menu.dataset.menu);
    if (!Number.isNaN(idx)) openTrackSheet(idx);
    return;
  }
  const trackRow = e.target.closest('.track');
  if (trackRow) {
    const idx = Number(trackRow.dataset.track);
    if (!Number.isNaN(idx)) playTrackFromCurrentView(idx);
    return;
  }
  const albumCard = e.target.closest('.album-card');
  if (albumCard) {
    state.view = 'album-detail';
    state.currentAlbum = albumCard.dataset.album;
    view.scrollTop = 0;
    render();
    return;
  }
  if (e.target.closest('#back')) {
    state.view = 'albums';
    state.currentAlbum = null;
    view.scrollTop = 0;
    render();
    return;
  }
  if (e.target.closest('#play-album')) {
    const album = state.currentAlbum;
    const indices = state.tracks
      .map((t, i) => albumOf(t) === album ? i : -1)
      .filter(i => i !== -1);
    if (indices.length === 0) return;
    setQueue(indices, indices[0]);
    loadTrack(state.queue[0], true);
    return;
  }
});

sheetBackdrop.addEventListener('click', e => {
  if (e.target === sheetBackdrop) { closeSheet(); return; }
  const action = e.target.closest('.sheet-action');
  if (!action) return;
  const trackIndex = Number(sheetBackdrop.dataset.track);
  handleSheetAction(action.dataset.act, trackIndex);
});

clearBtn.addEventListener('click', () => {
  if (state.tracks.length === 0) return;
  if (confirm('Remove all tracks from your library? Your music files on your phone are not affected — only the references this app stores.')) {
    clearPlaylist();
  }
});

// Lock-screen / Bluetooth / headphone key controls
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => audio.play().catch(() => {}));
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
  navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack(false));
  try {
    navigator.mediaSession.setActionHandler('seekto', (e) => {
      if (e.fastSeek && 'fastSeek' in audio) audio.fastSeek(e.seekTime);
      else audio.currentTime = e.seekTime;
    });
  } catch (e) { /* some browsers don't support seekto */ }
  try {
    navigator.mediaSession.setActionHandler('seekbackward', (e) => {
      audio.currentTime = Math.max(0, audio.currentTime - (e.seekOffset || 10));
    });
    navigator.mediaSession.setActionHandler('seekforward', (e) => {
      audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + (e.seekOffset || 10));
    });
  } catch (e) { /* optional */ }
}

/* ---------- Service worker + install prompt ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.warn('SW registration failed', err);
    });
  });
}

let deferredPrompt = null;
const installBanner = document.getElementById('install-banner');
const installBtn = document.getElementById('install-btn');
const installDismiss = document.getElementById('install-dismiss');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (localStorage.getItem('install-dismissed') !== '1') {
    installBanner.classList.add('visible');
  }
});

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  installBanner.classList.remove('visible');
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
});
installDismiss.addEventListener('click', () => {
  installBanner.classList.remove('visible');
  localStorage.setItem('install-dismissed', '1');
});

window.addEventListener('appinstalled', () => {
  installBanner.classList.remove('visible');
  showToast('Installed — launch from your home screen');
});

if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().catch(() => {});
}

/* ---------- Boot ---------- */
loadPrefs();
applyRepeatVisual();
restoreLibrary();
</script>
