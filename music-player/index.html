function openSettingsSheet() {
  const cfg = state.jellyfin.config;
  const connected = !!cfg.accessToken;
  const status = connected
    ? `<div class="conn-status ok">Connected to <strong>${escapeHtml(cfg.serverUrl)}</strong> as <strong>${escapeHtml(cfg.username)}</strong>${state.jellyfin.lastSync ? ` · ${state.jellyfin.tracks.length} track${state.jellyfin.tracks.length === 1 ? '' : 's'}` : ''}</div>`
    : `<div class="conn-status">Not connected.</div>`;
  const buttons = connected
    ? `<div class="settings-row">
         <button class="primary" data-settings-act="refresh" type="button">Refresh library</button>
         <button class="danger" data-settings-act="disconnect" type="button">Disconnect</button>
       </div>`
    : `<div class="settings-row">
         <button class="primary" data-settings-act="connect" type="button">Connect</button>
         <button class="secondary" data-settings-act="cancel" type="button">Cancel</button>
       </div>`;
  const sleepActiveMin = state.sleep.expiresAt > 0
    ? Math.ceil((state.sleep.expiresAt - Date.now()) / 60000)
    : 0;
  const sleepOptions = [0, 15, 30, 45, 60, 90];
  const sleepHtml = sleepOptions.map(m => {
    const label = m === 0 ? 'Off' : `${m} min`;
    const active = (m === 0 && sleepActiveMin === 0) || (m > 0 && sleepActiveMin > 0 && sleepActiveMin <= m && sleepActiveMin > (m - 15));
    return `<button class="sleep-btn${active ? ' active' : ''}" data-sleep="${m}" type="button">${label}</button>`;
  }).join('');
  sheetBody.innerHTML = `
    <div class="sheet-section-title">Sleep timer</div>
    <div class="sleep-grid">${sleepHtml}</div>
    <div class="sheet-divider"></div>
    <div class="sheet-title">Jellyfin</div>
    ${status}
    <div class="settings-form">
      <label for="jf-url">Server URL</label>
      <input id="jf-url" type="url" inputmode="url" autocomplete="url" placeholder="https://jellyfin.home.lab" value="${escapeHtml(cfg.serverUrl)}" ${connected ? 'disabled' : ''}>
      <label for="jf-user">Username</label>
      <input id="jf-user" type="text" autocomplete="username" placeholder="username" value="${escapeHtml(cfg.username)}" ${connected ? 'disabled' : ''}>
      ${connected ? '' : `
        <label for="jf-pass">Password</label>
        <input id="jf-pass" type="password" autocomplete="current-password" placeholder="password">
      `}
    </div>
    ${buttons}
    <div class="conn-hint">
      ${connected
        ? 'Your password is not stored — only the access token. Refresh re-fetches your library.'
        : 'The server must allow CORS from <code>' + escapeHtml(location.origin) + '</code>. On Jellyfin: Dashboard → Networking → CORS Hosts.'}
    </div>
    <div class="conn-hint" style="text-align:center;opacity:0.6">Music Player v${APP_VERSION}</div>
  `;
  sheetBackdrop.classList.add('visible');
  sheetBackdrop.dataset.settings = 'jellyfin';
}

async function handleSettingsAction(act) {
  if (act === 'cancel') { closeSheet(); return; }
  if (act === 'disconnect') {
    closeSheet();
    if (!confirm('Disconnect from Jellyfin? The cached library will be cleared from this device.')) return;
    await JF.logout(state.jellyfin.config);
    clearJellyfinConfig();
    state.jellyfin.tracks = [];
    state.jellyfin.playlists.length = 0;
    state.jellyfin.playlistsLoaded = false;
    state.jellyfin.lastSync = 0;
    // A playing Jellyfin track just lost its stream token — stop it.
    if (state.playingSource === 'jellyfin') {
      audio.pause();
      audio.removeAttribute('src');
      audio.load();
      state.playingTrack = null;
      state.playingSource = null;
      state.queue = [];
      state.queuePos = -1;
      titleEl.textContent = 'No track loaded';
      setNowPlayingArt(null);
    }
    if (state.source === 'jellyfin') {
      await setActiveSource('local');
    }
    showToast('Disconnected from Jellyfin');
    return;
  }
  if (act === 'refresh') {
    closeSheet();
    await syncJellyfin({ feedback: true });
    return;
  }
  if (act === 'connect') {
    const urlInput = document.getElementById('jf-url');
    const userInput = document.getElementById('jf-user');
    const passInput = document.getElementById('jf-pass');
    const serverUrl = JF.trimUrl(urlInput.value);
    const username = (userInput.value || '').trim();
    const password = passInput.value || '';
    if (!serverUrl || !username || !password) {
      showToast('Fill in server, username, and password');
      return;
    }
    // Mixed-content guard
    if (location.protocol === 'https:' && serverUrl.startsWith('http://')) {
      showToast('HTTPS page can\'t talk to an HTTP server — use https:// on Jellyfin');
      return;
    }
    const deviceId = state.jellyfin.config.deviceId;
    const btn = sheetBody.querySelector('button[data-settings-act="connect"]');
    if (btn) { btn.textContent = 'Connecting…'; btn.disabled = true; }
    try {
      const result = await JF.authenticate(serverUrl, username, password, deviceId);
      if (!result || !result.AccessToken || !result.User) throw new Error('No token returned');
      state.jellyfin.config = {
        serverUrl,
        accessToken: result.AccessToken,
        userId: result.User.Id,
        username: result.User.Name || username,
        deviceId,
      };
      saveJellyfinConfig();
      closeSheet();
      showToast('Connected to Jellyfin');
      await setActiveSource('jellyfin', { force: true });
    } catch (err) {
      console.error('Jellyfin connect failed', err);
      const msg = String(err.message || err);
      const friendly = msg.includes('Failed to fetch')
        ? 'Can\'t reach the server. Check the URL, network, and CORS.'
        : msg;
      showToast(friendly);
      if (btn) { btn.textContent = 'Connect'; btn.disabled = false; }
    }
  }
}

async function renameAlbum(oldName, newName) {
  if (state.source !== 'local') return;
  const target = (newName || '').trim() || UNSORTED;
  if (target === oldName) return;
  const affected = state.tracks.filter(t => albumOf(t) === oldName);
  for (const t of affected) {
    t.album = target;
    await persistTrack(t);
  }
  if (state.currentAlbum === oldName) state.currentAlbum = target;
  render();
  showToast(`Renamed to "${target}"`);
}

async function removeAlbum(albumName) {
  if (state.source !== 'local') return;
  const indices = [];
  state.tracks.forEach((t, i) => { if (albumOf(t) === albumName) indices.push(i); });
  if (indices.length === 0) return;

  // Remember the currently-playing track by id so we can find its new index after splicing.
  const currentId = state.playingTrack ? state.playingTrack.id : null;
  const removedIds = new Set(indices.map(i => state.tracks[i].id));
  const playingRemoved = currentId !== null && removedIds.has(currentId);

  // Splice descending so earlier indices stay valid.
  for (const i of indices.slice().sort((a, b) => b - a)) {
    const t = state.tracks[i];
    try { await idbDelete(state.db, t.id); } catch (e) { /* ignore */ }
    URL.revokeObjectURL(t.url);
    if (t.pictureUrl) URL.revokeObjectURL(t.pictureUrl);
    state.tracks.splice(i, 1);
  }

  const remaining = state.tracks.map((_, i) => i);
  if (playingRemoved) {
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
    state.playingTrack = null;
    titleEl.textContent = 'No track loaded';
    subtitleEl.textContent = state.tracks.length ? 'Tap a track to play' : 'Tap "Add files" to load music';
    if (remaining.length > 0) {
      setQueue(remaining, remaining[0]);
      loadQueueCurrent(false);
    } else {
      state.queue = [];
      state.queuePos = -1;
    }
  } else if (currentId !== null) {
    const startIdx = state.tracks.findIndex(t => t.id === currentId);
    if (startIdx !== -1) {
      setQueue(remaining, startIdx);
    } else {
      state.queue = state.tracks.map(t => t.id);
      state.queuePos = state.tracks.length > 0 ? 0 : -1;
    }
  }

  if (state.currentAlbum === albumName) {
    state.view = 'albums';
    state.currentAlbum = null;
  }
  render();
  showToast(`Removed "${albumName}"`);
}

async function handleSheetAction(act, trackIndex) {
  const t = state.tracks[trackIndex];
  if (!t) { closeSheet(); return; }
  if (act === 'play') {
    closeSheet();
    playTrackFromCurrentView(trackIndex);
  } else if (act === 'rename') {
    closeSheet();
    const next = prompt('Rename track', t.title);
    if (next !== null) {
      const trimmed = next.trim();
      if (trimmed) {
        t.title = trimmed;
        await persistTrack(t);
        if (state.playingTrack && t.id === state.playingTrack.id) titleEl.textContent = trimmed;
        render();
      }
    }
  } else if (act === 'move') {
    closeSheet();
    const existing = groupedAlbums().map(a => a.name).filter(n => n !== albumOf(t));
    const hint = existing.length ? `\n\nExisting albums:\n• ${existing.join('\n• ')}` : '';
    const next = prompt(`Move "${t.title}" to album:${hint}`, albumOf(t));
    if (next !== null) {
      const trimmed = next.trim() || UNSORTED;
      t.album = trimmed;
      await persistTrack(t);
      render();
      showToast(`Moved to "${trimmed}"`);
    }
  } else if (act === 'remove') {
    closeSheet();
    removeTrack(trackIndex);
  } else if (act === 'add-to-playlist') {
    openAddToPlaylistSheet('track', trackIndex);
  } else if (act === 'favorite') {
    closeSheet();
    toggleFavorite(state.tracks[trackIndex]);
  } else {
    closeSheet();
  }
}

async function persistTrack(t) {
  try {
    await idbPut(state.db, t);
  } catch (e) {
    console.error('Persist failed', e);
    showToast('Could not save change');
  }
}

/* ---------- Playlists (source-aware dispatch) ---------- */
async function createPlaylist(name) {
  const trimmed = (name || '').trim();
  if (!trimmed) return null;
  if (state.source === 'jellyfin') {
    try {
      const result = await JF.createPlaylistOnServer(state.jellyfin.config, trimmed, []);
      const record = {
        id: result.Id,
        name: trimmed,
        trackIds: [],
        entryIds: [],
        trackCount: 0,
        source: 'jellyfin',
        loaded: true,
      };
      state.jellyfin.playlists.push(record);
      return record;
    } catch (e) {
      console.error('Jellyfin create playlist failed', e);
      showToast('Could not create playlist');
      return null;
    }
  }
  // Local
  const record = { name: trimmed, trackIds: [], createdAt: Date.now(), source: 'local' };
  try {
    const id = await idbAddPlaylist(state.db, record);
    record.id = id;
    state.local.playlists.push(record);
    return record;
  } catch (e) {
    console.error('Create playlist failed', e);
    showToast('Could not create playlist');
    return null;
  }
}

async function ensurePlaylistLoaded(playlist) {
  if (playlist.source !== 'jellyfin' || playlist.loaded) return;
  if (playlist.loadFailed) return; // don't hammer a server we know is unreachable
  if (playlist.loading) return;    // re-entry guard so render+click can't double-fetch
  playlist.loading = true;
  try {
    const items = await JF.fetchPlaylistItems(state.jellyfin.config, playlist.id);
    playlist.trackIds = items.map(it => 'jf:' + it.Id);
    playlist.entryIds = items.map(it => it.PlaylistItemId);
    playlist.trackCount = items.length;
    playlist.loaded = true;
    playlist.loadFailed = false;
  } catch (e) {
    console.error('Load playlist items failed', e);
    playlist.loadFailed = true; // breaks the renderPlaylistDetail retry loop
    showToast('Could not load playlist — check Jellyfin connection');
  } finally {
    playlist.loading = false;
  }
}

async function addTrackToPlaylist(playlist, trackId) {
  if (playlist.trackIds.includes(trackId)) return false;
  if (playlist.source === 'jellyfin') {
    // Resolve trackId 'jf:xxx' back to raw Jellyfin item id
    const rawId = typeof trackId === 'string' && trackId.startsWith('jf:') ? trackId.slice(3) : trackId;
    try {
      await JF.addToServerPlaylist(state.jellyfin.config, playlist.id, [rawId]);
      // Refetch items to get the new PlaylistItemId for the added entry
      const items = await JF.fetchPlaylistItems(state.jellyfin.config, playlist.id);
      playlist.trackIds = items.map(it => 'jf:' + it.Id);
      playlist.entryIds = items.map(it => it.PlaylistItemId);
      playlist.trackCount = items.length;
      return true;
    } catch (e) {
      console.error('Jellyfin add failed', e);
      return false;
    }
  }
  // Local
  playlist.trackIds.push(trackId);
  try { await idbPutPlaylist(state.db, playlist); return true; }
  catch (e) { console.error(e); return false; }
}

async function removeTrackFromPlaylist(playlist, positionInPlaylist) {
  if (positionInPlaylist < 0 || positionInPlaylist >= playlist.trackIds.length) return;
  if (playlist.source === 'jellyfin') {
    const entryId = playlist.entryIds[positionInPlaylist];
    if (!entryId) return;
    try {
      await JF.removeFromServerPlaylist(state.jellyfin.config, playlist.id, [entryId]);
      playlist.trackIds.splice(positionInPlaylist, 1);
      playlist.entryIds.splice(positionInPlaylist, 1);
      playlist.trackCount = playlist.trackIds.length;
    } catch (e) {
      console.error('Jellyfin remove failed', e);
      showToast('Could not remove from playlist');
    }
    return;
  }
  playlist.trackIds.splice(positionInPlaylist, 1);
  try { await idbPutPlaylist(state.db, playlist); } catch (e) { console.error(e); }
}

async function movePlaylistTrack(playlist, fromPos, toPos) {
  if (fromPos < 0 || fromPos >= playlist.trackIds.length) return;
  if (toPos < 0 || toPos >= playlist.trackIds.length) return;
  if (playlist.source === 'jellyfin') {
    const entryId = playlist.entryIds[fromPos];
    if (!entryId) return;
    try {
      await JF.movePlaylistItemOnServer(state.jellyfin.config, playlist.id, entryId, toPos);
      const [tid] = playlist.trackIds.splice(fromPos, 1);
      const [eid] = playlist.entryIds.splice(fromPos, 1);
      playlist.trackIds.splice(toPos, 0, tid);
      playlist.entryIds.splice(toPos, 0, eid);
    } catch (e) {
      console.error('Jellyfin move failed', e);
      showToast('Could not reorder');
    }
    return;
  }
  const [item] = playlist.trackIds.splice(fromPos, 1);
  playlist.trackIds.splice(toPos, 0, item);
  try { await idbPutPlaylist(state.db, playlist); } catch (e) { console.error(e); }
}

async function renamePlaylist(playlist, newName) {
  const trimmed = (newName || '').trim();
  if (!trimmed || trimmed === playlist.name) return;
  if (playlist.source === 'jellyfin') {
    try {
      await JF.renamePlaylistOnServer(state.jellyfin.config, playlist.id, trimmed);
      playlist.name = trimmed;
    } catch (e) {
      console.error('Jellyfin rename failed', e);
      showToast('Could not rename playlist');
    }
    return;
  }
  playlist.name = trimmed;
  try { await idbPutPlaylist(state.db, playlist); } catch (e) { console.error(e); }
}

async function deletePlaylist(playlistId) {
  const list = state.playlists;
  const idx = list.findIndex(p => p.id === playlistId);
  if (idx < 0) return;
  const playlist = list[idx];
  if (playlist.source === 'jellyfin') {
    try { await JF.deletePlaylistOnServer(state.jellyfin.config, playlistId); }
    catch (e) { console.error(e); showToast('Could not delete'); return; }
  } else {
    try { await idbDeletePlaylist(state.db, playlistId); } catch (e) { console.error(e); }
  }
  list.splice(idx, 1);
}

/* ---------- Playback ---------- */
// audio.play() is a Promise that can reject for many reasons: autoplay policy,
// audio-focus interruptions (Bluetooth, navigation prompts in the car, phone
// calls), transient network errors, etc. Track which url we were trying to
// start; if a retry would attempt to play a different track, drop it.
async function playWithFallback(reason) {
  const startedSrc = audio.src;
  try {
    await audio.play();
    return true;
  } catch (err) {
    console.warn(`audio.play() rejected (${reason || '?'}):`, err && err.name, err && err.message);
    if (audio.src !== startedSrc) return false; // user moved on, give up
    // One short retry — clears most transient Bluetooth/audio-focus glitches.
    await new Promise(r => setTimeout(r, 500));
    if (audio.src !== startedSrc) return false;
    try {
      await audio.play();
      return true;
    } catch (err2) {
      console.warn('audio.play() retry rejected:', err2 && err2.name, err2 && err2.message);
      nativeSetPlaybackState('paused');
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
      playIcon.innerHTML = PLAY_ICON;
      showToast('Playback paused — tap play to resume');
      return false;
    }
  }
}

// Boot helper: load the first track to display in the now-playing area when
// the app starts or the source changes. If a recent resume entry matches the
// current source and references a track that still exists in the library,
// use it (and seek to the saved playback position once metadata is ready);
// otherwise fall back to the first track in the queue.
function bootPlaybackTrack(autoplay) {
  if (state.tracks.length === 0) return;
  const resume = loadResume();
  const indices = state.tracks.map((_, i) => i);
  let startIdx = indices[0];
  let seekTo = 0;
  if (resume && resume.source === state.source) {
    const idx = state.tracks.findIndex(t => t.id === resume.trackId);
    if (idx >= 0) {
      startIdx = idx;
      const dur = state.tracks[idx].durationSec || 0;
      // Skip if within ~5s of the end — would auto-trigger 'ended' instantly.
      if (resume.position > 0 && (dur === 0 || resume.position < dur - 5)) {
        seekTo = resume.position;
      }
    }
  }
  setQueue(indices, startIdx);
  loadQueueCurrent(!!autoplay);
  if (seekTo > 0) {
    const handler = () => {
      try { audio.currentTime = seekTo; } catch (e) { /* ignore */ }
      audio.removeEventListener('loadedmetadata', handler);
    };
    audio.addEventListener('loadedmetadata', handler);
  }
}

function loadTrack(track, autoplay) {
  if (!track) return;
  state.playingTrack = track;
  state.playingSource = track.source || 'local';
  audio.src = track.url;
  titleEl.textContent = track.title;
  subtitleEl.textContent = subtitleFor(track);
  setNowPlayingArt(track.pictureUrl || albumArtUrlFor(albumOf(track)));
  // Reset the seek/time display; loadedmetadata will refresh once the audio
  // header is parsed, but for Jellyfin transcodes the metadata duration is
  // already known up-front so prefer it.
  seek.value = '0';
  currentEl.textContent = '0:00';
  durationEl.textContent = track.durationSec > 0 ? formatTime(track.durationSec) : '0:00';
  render();
  updateMediaSession();
  updateFavoriteUI();
  if (autoplay) playWithFallback('loadTrack');
}

function updateFavoriteUI() {
  const btn = document.getElementById('favorite-btn');
  if (!btn) return;
  const t = state.playingTrack;
  // Heart is meaningful only for Jellyfin (server-side favorites). Hide on
  // local tracks until we add a local equivalent.
  if (!t || (t.source || 'local') !== 'jellyfin') {
    btn.hidden = true;
    return;
  }
  btn.hidden = false;
  btn.classList.toggle('active', !!t.isFavorite);
  btn.setAttribute('aria-pressed', String(!!t.isFavorite));
  btn.title = t.isFavorite ? 'Unfavorite' : 'Add to Favorites';
}

async function toggleFavorite(t) {
  if (!t || (t.source || 'local') !== 'jellyfin') return;
  if (!t.itemId) return;
  const newVal = !t.isFavorite;
  // Optimistic update for snappy feedback; revert on failure.
  t.isFavorite = newVal;
  if (state.playingTrack && t.id === state.playingTrack.id) updateFavoriteUI();
  try {
    await JF.setFavorite(state.jellyfin.config, t.itemId, newVal);
    showToast(newVal ? 'Added to Favorites' : 'Removed from Favorites');
    // If the user is currently viewing the Favorites smart playlist, re-render
    // so the row appears/disappears immediately.
    if (state.view === 'playlist-detail' && state.currentPlaylist && state.currentPlaylist.id === '__favorites__') render();
    else if (state.view === 'playlists') render();
  } catch (e) {
    console.error('Favorite toggle failed', e);
    t.isFavorite = !newVal; // revert
    if (state.playingTrack && t.id === state.playingTrack.id) updateFavoriteUI();
    showToast('Could not update favorite');
  }
}

function subtitleFor(track) {
  const artist = artistOf(track);
  const album = albumOf(track);
  let base;
  if (artist && album !== UNSORTED) base = `${artist} · ${album}`;
  else if (artist) base = artist;
  else if (album !== UNSORTED) base = album;
  else base = formatBytes(track.size || 0);
  if (state.sleep.expiresAt > 0) {
    const remaining = Math.max(0, state.sleep.expiresAt - Date.now());
    const m = Math.floor(remaining / 60000);
    const s = Math.floor((remaining % 60000) / 1000).toString().padStart(2, '0');
    return `${base} · sleep ${m}:${s}`;
  }
  return base;
}

function refreshNowPlayingSubtitle() {
  const t = state.playingTrack;
  if (t) subtitleEl.textContent = subtitleFor(t);
}

function setSleepTimer(minutes) {
  if (state.sleep.intervalId) {
    clearInterval(state.sleep.intervalId);
    state.sleep.intervalId = 0;
  }
  if (minutes > 0) {
    state.sleep.expiresAt = Date.now() + minutes * 60000;
    state.sleep.intervalId = setInterval(() => {
      if (Date.now() >= state.sleep.expiresAt) {
        clearInterval(state.sleep.intervalId);
        state.sleep.intervalId = 0;
        state.sleep.expiresAt = 0;
        audio.pause();
        showToast('Sleep timer expired');
        refreshNowPlayingSubtitle();
      } else {
        refreshNowPlayingSubtitle();
      }
    }, 1000);
  } else {
    state.sleep.expiresAt = 0;
  }
  refreshNowPlayingSubtitle();
}

function setNowPlayingArt(url) {
  const artwork = document.getElementById('artwork');
  const img = document.getElementById('artwork-img');
  if (url) {
    img.src = url;
    img.hidden = false;
    artwork.classList.add('has-art');
  } else {
    img.removeAttribute('src');
    img.hidden = true;
    artwork.classList.remove('has-art');
  }
}

function playTrackFromCurrentView(trackIndex) {
  // Queue depends on the current view.
  if (state.view === 'album-detail' && state.currentAlbum) {
    const album = state.currentAlbum;
    const indices = state.tracks
      .map((t, i) => albumOf(t) === album ? i : -1)
      .filter(i => i !== -1);
    setQueue(indices, trackIndex);
  } else if (state.view === 'playlist-detail' && state.currentPlaylist) {
    const indices = playlistTracks(state.currentPlaylist);
    setQueue(indices, trackIndex);
  } else {
    // Songs view or albums grid play-all: queue all tracks
    const indices = state.tracks.map((_, i) => i);
    setQueue(indices, trackIndex);
  }
  loadQueueCurrent(true);
}

function playPause() {
  if (!state.playingTrack && state.tracks.length > 0) {
    const indices = state.tracks.map((_, i) => i);
    setQueue(indices, indices[0]);
    loadQueueCurrent(true);
    return;
  }
  if (audio.paused) playWithFallback('playPause');
  else audio.pause();
}

function nextTrack(auto) {
  if (state.queue.length === 0) return;
  if (state.repeat === 'one' && auto) {
    audio.currentTime = 0;
    playWithFallback('repeatOne');
    return;
  }
  let pos = state.queuePos + 1;
  if (pos >= state.queue.length) {
    if (state.repeat === 'all' || !auto) {
      pos = 0;
      if (state.shuffle) reshuffleQueueKeepingCurrent();
    } else {
      audio.pause();
      return;
    }
  }
  state.queuePos = pos;
  loadQueueCurrent(true);
}

function prevTrack() {
  if (state.queue.length === 0) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  let pos = state.queuePos - 1;
  if (pos < 0) pos = state.queue.length - 1;
  state.queuePos = pos;
  loadQueueCurrent(true);
}

/* ---------- File ingestion ---------- */
async function addFiles(files) {
  if (state.source !== 'local') {
    await setActiveSource('local');
  }
  const audioFiles = Array.from(files).filter(f =>
    f.type.startsWith('audio/') || /\.(mp3|m4a|aac|ogg|oga|opus|wav|flac|wma|webm)$/i.test(f.name)
  );
  if (audioFiles.length === 0) {
    showToast('No supported audio files in selection');
    return;
  }
  audioFiles.sort((a, b) => {
    const ap = a.webkitRelativePath || a.name;
    const bp = b.webkitRelativePath || b.name;
    return ap.localeCompare(bp, undefined, { numeric: true, sensitivity: 'base' });
  });
  const startedEmpty = state.tracks.length === 0;
  let added = 0;
  let failed = 0;
  const verbose = audioFiles.length > 3;

  // Read tags for all files in parallel batches. jsmediatags can hang per file
  // up to the timeout, so processing serially turns a 20-file import into a
  // multi-minute wait. Concurrency of 5 gets us through 20 files in roughly
  // one timeout cycle.
  const tagResults = new Array(audioFiles.length);
  const BATCH = 5;
  for (let i = 0; i < audioFiles.length; i += BATCH) {
    const slice = audioFiles.slice(i, i + BATCH);
    const results = await Promise.all(slice.map(f => readTags(f)));
    for (let j = 0; j < results.length; j++) tagResults[i + j] = results[j];
    if (verbose) showToast(`Reading tags ${Math.min(i + BATCH, audioFiles.length)}/${audioFiles.length}…`);
  }

  // Now write to IDB sequentially. Render every few additions so the user
  // sees the library filling up rather than a blank wait.
  for (let i = 0; i < audioFiles.length; i++) {
    const file = audioFiles[i];
    const tags = tagResults[i];
    const tagTitle = tags ? tagString(tags.title) : '';
    const tagArtist = tags ? tagString(tags.artist) : '';
    const tagAlbum = tags ? tagString(tags.album) : '';
    const pictureBlob = tags ? pictureToBlob(tags.picture) : null;
    // Fall back to "Artist - Title" parsed from the filename when tags are missing.
    const nameMeta = parseNameMeta(file.name);

    const record = {
      name: file.name,
      title: tagTitle || nameMeta.title || titleFromName(file.name),
      artist: tagArtist || nameMeta.artist || null,
      album: chooseAlbumName(file, tagAlbum),
      type: file.type || 'audio/mpeg',
      size: file.size,
      addedAt: Date.now(),
      blob: file,
      pictureBlob: pictureBlob || undefined,
      pictureMime: pictureBlob ? pictureBlob.type : undefined,
      // If tag reading failed, leave this false so backfillTags retries from the
      // stored (plain) blob on a later launch — that read isn't content:// bound.
      tagsRead: tags != null,
    };
    try {
      const id = await idbAdd(state.db, record);
      record.id = id;
      record.url = URL.createObjectURL(record.blob);
      if (pictureBlob) record.pictureUrl = URL.createObjectURL(pictureBlob);
      state.tracks.push(record);
      added++;
      if (added === 1 || added % 5 === 0 || added === audioFiles.length) {
        render();
        if (verbose) showToast(`Saving ${added}/${audioFiles.length}…`);
      }
    } catch (err) {
      console.error('Failed to store track', file.name, err);
      failed++;
    }
  }
  render();
  if (startedEmpty && state.tracks.length > 0 && !state.playingTrack) {
    const indices = state.tracks.map((_, i) => i);
    setQueue(indices, indices[0]);
    loadQueueCurrent(false);
  }
  if (failed > 0) {
    showToast(`Added ${added} · ${failed} couldn't be saved`);
  } else if (added < audioFiles.length) {
    showToast(`Added ${added} of ${audioFiles.length}`);
  } else {
    showToast(`Added ${added} track${added === 1 ? '' : 's'}`);
  }
}

async function removeTrack(index) {
  if (state.source !== 'local') return;
  if (index < 0 || index >= state.tracks.length) return;
  const track = state.tracks[index];
  const playingId = state.playingTrack ? state.playingTrack.id : null;
  const wasCurrent = playingId !== null && track.id === playingId;
  const wasPlaying = wasCurrent && !audio.paused;

  try { await idbDelete(state.db, track.id); } catch (e) { /* ignore */ }
  URL.revokeObjectURL(track.url);
  if (track.pictureUrl) URL.revokeObjectURL(track.pictureUrl);
  state.tracks.splice(index, 1);

  // Drop the removed track from the queue. Ids are stable, so no reindexing.
  state.queue = state.queue.filter(id => id !== track.id);
  if (wasCurrent) {
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
    state.playingTrack = null;
    titleEl.textContent = 'No track loaded';
    subtitleEl.textContent = state.tracks.length ? 'Tap a track to play' : 'Tap "Add files" to load music';
    if (state.queue.length > 0) {
      state.queuePos = Math.min(state.queuePos, state.queue.length - 1);
      if (state.queuePos < 0) state.queuePos = 0;
      loadQueueCurrent(wasPlaying);
    } else {
      state.queuePos = -1;
    }
  } else if (playingId !== null) {
    // Keep queuePos pointing at the still-playing track after the removal.
    const pos = state.queue.indexOf(playingId);
    if (pos >= 0) state.queuePos = pos;
  }
  render();
}

async function clearPlaylist() {
  if (state.source !== 'local') return;
  for (const t of state.local.tracks) {
    URL.revokeObjectURL(t.url);
    if (t.pictureUrl) URL.revokeObjectURL(t.pictureUrl);
  }
  state.local.tracks.length = 0;
  state.tracks = state.local.tracks;
  state.playingTrack = null;
  state.playingSource = null;
  state.queue = [];
  state.queuePos = -1;
  try { await idbClear(state.db); } catch (e) { /* ignore */ }
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
  titleEl.textContent = 'No track loaded';
  subtitleEl.textContent = 'Tap "Add files" to load music';
  setNowPlayingArt(null);
  state.view = 'albums';
  state.currentAlbum = null;
  render();
}

// Native media session (Android app only). Establishes a real Android media
// session so playback keeps advancing while the screen is locked and song info
// shows on the lock screen / car. Deliberately MINIMAL — only metadata and
// playback state, no rapid position updates or control-button callbacks (those
// crashed in the fuller v1.7.0 attempt). The PWA keeps using navigator.mediaSession.
function nativeMS() {
  const C = window.Capacitor;
  if (C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.MediaSession) {
    return C.Plugins.MediaSession;
  }
  return null;
}
function nativeSetMetadata(track) {
  const n = nativeMS();
  if (!n) return;
  // The plugin REQUIRES an artwork array — omitting it makes its native
  // setMetadata call .toList() on null and crash. Always pass one. Native can't
  // load blob: art (local files), so only pass http(s) art (Jellyfin).
  let artUrl = track ? (track.pictureUrl || albumArtUrlFor(albumOf(track))) : null;
  if (artUrl && artUrl.indexOf('blob:') === 0) artUrl = null;
  try {
    n.setMetadata({
      title: track ? (track.title || '') : '',
      artist: track ? artistOf(track) : '',
      album: track && albumOf(track) !== UNSORTED ? albumOf(track) : '',
      artwork: artUrl ? [{ src: artUrl, sizes: '512x512', type: (track && track.pictureMime) || 'image/jpeg' }] : [],
    }).catch(() => {});
  } catch (e) { /* ignore */ }
}
function nativeSetPlaybackState(s) {
  const n = nativeMS();
  if (!n) return;
  try { n.setPlaybackState({ playbackState: s }).catch(() => {}); } catch (e) { /* ignore */ }
}

function updateMediaSession() {
  const track = state.playingTrack;
  nativeSetMetadata(track);
  if (!('mediaSession' in navigator)) return;
  if (!track) { navigator.mediaSession.metadata = null; return; }
  const artUrl = track.pictureUrl || albumArtUrlFor(albumOf(track));
  const artwork = artUrl
    ? [{
        src: artUrl,
        sizes: '512x512',
        type: track.pictureMime || 'image/jpeg',
      }]
    : [];
  navigator.mediaSession.metadata = new MediaMetadata({
    title: track.title,
    artist: artistOf(track),
    album: albumOf(track) === UNSORTED ? '' : albumOf(track),
    artwork,
  });
}

async function restoreLibrary() {
  try {
    state.db = await openDB();
    const records = await idbAll(state.db);
    let needsMigration = false;
    state.local.tracks.length = 0;
    for (const r of records) {
      if (!r.album) {
        r.album = UNSORTED;
        needsMigration = true;
      }
      r.url = URL.createObjectURL(r.blob);
      if (r.pictureBlob) r.pictureUrl = URL.createObjectURL(r.pictureBlob);
      r.source = 'local';
      state.local.tracks.push(r);
    }
    if (needsMigration) {
      for (const r of state.local.tracks) {
        if (r.album === UNSORTED) await idbPut(state.db, r).catch(() => {});
      }
    }
    try {
      const loaded = await idbAllPlaylists(state.db);
      // Tag with source for the dispatcher
      for (const p of loaded) p.source = 'local';
      state.local.playlists.length = 0;
      for (const p of loaded) state.local.playlists.push(p);
    } catch (e) {
      console.warn('Could not load playlists', e);
    }
    await setActiveSource(state.source, { force: true, initial: true });
    if (state.source === 'local') backfillTags();
  } catch (err) {
    console.error('Failed to open library', err);
    showToast('Could not load saved library');
    render();
  }
}

// One-time progressive tag backfill for tracks imported before tag reading
// existed. Marks each record with `tagsRead: true` once processed so we only
// touch each track once. Runs in the background, gentle on the main thread.
async function backfillTags() {
  if (typeof window.jsmediatags === 'undefined') return;
  const todo = state.tracks.filter(t => !t.tagsRead);
  if (todo.length === 0) return;
  let updated = 0;
  for (const t of todo) {
    if (!t.blob) { t.tagsRead = true; await idbPut(state.db, t).catch(() => {}); continue; }
    const tags = await readTags(t.blob);
    let changed = false;
    if (tags) {
      const tagTitle = tagString(tags.title);
      const tagArtist = tagString(tags.artist);
      const tagAlbum = tagString(tags.album);
      const pictureBlob = pictureToBlob(tags.picture);
      // Only overwrite title/album if the existing values are filename/folder-derived
      // (we have no way to tell perfectly, but we keep user-edited values intact by
      // not overwriting if the user has already renamed via the sheet — there's no
      // marker for that, so be conservative: only fill empty/derived fields)
      if (!t.artist && tagArtist) { t.artist = tagArtist; changed = true; }
      if (tagAlbum && (t.album === UNSORTED || t.album === deriveAlbum({ webkitRelativePath: '', name: t.name }))) {
        if (t.album !== tagAlbum) { t.album = tagAlbum; changed = true; }
      }
      if (tagTitle && t.title === titleFromName(t.name)) {
        t.title = tagTitle; changed = true;
      }
      if (!t.pictureBlob && pictureBlob) {
        t.pictureBlob = pictureBlob;
        t.pictureMime = pictureBlob.type;
        t.pictureUrl = URL.createObjectURL(pictureBlob);
        changed = true;
      }
    }
    t.tagsRead = true;
    await idbPut(state.db, t).catch(() => {});
    if (changed) updated++;
    // Yield to the UI between tracks
    await new Promise(r => setTimeout(r, 0));
  }
  if (updated > 0) {
    render();
    if (state.playingTrack) {
      const t = state.playingTrack;
      titleEl.textContent = t.title;
      subtitleEl.textContent = subtitleFor(t);
      setNowPlayingArt(t.pictureUrl || albumArtUrlFor(albumOf(t)));
      updateMediaSession();
    }
    showToast(`Read tags from ${updated} track${updated === 1 ? '' : 's'}`);
  }
}

  state.shuffle = !state.shuffle;

  // If the user is inside an album-detail or playlist-detail view, scope the
  // queue to that folder/playlist so shuffle stays within it. Otherwise just
  // reshuffle whatever queue is currently active.
  // Only scope shuffle to the browsed album/playlist when it belongs to the
  // playing source (or nothing is playing yet). Otherwise scoping would yank
  // playback over to whatever you're browsing — instead just reshuffle the
  // existing queue in place.
  const canScope = !state.playingSource || state.source === state.playingSource;
  let scopedIndices = null;
  if (canScope && state.view === 'album-detail' && state.currentAlbum) {
    const album = state.currentAlbum;
    scopedIndices = state.tracks
      .map((t, i) => albumOf(t) === album ? i : -1)

  } else if (canScope && state.view === 'playlist-detail' && state.currentPlaylist) {
    scopedIndices = playlistTracks(state.currentPlaylist);
  }
  if (scopedIndices && scopedIndices.length > 0) {
    // If the playing track is inside the scoped folder/playlist, keep it as the
    // start of the (re)shuffled queue; otherwise start at the top of the scope.
    const playingId = state.playingTrack ? state.playingTrack.id : null;
    const scopedIds = scopedIndices.map(i => state.tracks[i].id);
    const scopedPos = playingId != null ? scopedIds.indexOf(playingId) : -1;
    const startIdx = scopedPos >= 0 ? scopedIndices[scopedPos] : scopedIndices[0];
    setQueue(scopedIndices, startIdx);
    savePrefs();
    return;
  }
  reshuffleQueueKeepingCurrent();
  savePrefs();
});

// Returns the duration to use for the seek bar / time display. Prefers the
// audio element's reported duration; falls back to the current track's
// metadata duration (Jellyfin transcoding streams have no Content-Length so
// audio.duration ends up Infinity).
function effectiveDuration() {
  if (isFinite(audio.duration) && audio.duration > 0) return audio.duration;
  const t = state.playingTrack;
  if (t && t.durationSec > 0) return t.durationSec;
  return 0;
}

seek.addEventListener('input', () => { state.seeking = true; });
seek.addEventListener('change', () => {
  const dur = effectiveDuration();
  if (dur > 0) audio.currentTime = (Number(seek.value) / 1000) * dur;
  state.seeking = false;
});

function resetTimeDisplay() {
  seek.value = '0';
  currentEl.textContent = '0:00';
  const t = state.playingTrack;
  if (t && t.durationSec > 0) durationEl.textContent = formatTime(t.durationSec);
  else durationEl.textContent = '0:00';
}

audio.addEventListener('timeupdate', () => {
  if (state.seeking) return;
  // Skip stale events from a previous source. After audio.src changes, the
  // element drops to readyState 0 and re-progresses; ignore everything before
  // metadata is available again so the old track's currentTime doesn't briefly
  // get displayed against the new track's duration.
  if (audio.readyState < 1) return;
  const dur = effectiveDuration();
  if (dur > 0) seek.value = String(Math.floor((audio.currentTime / dur) * 1000));
  currentEl.textContent = formatTime(audio.currentTime);
  if (dur > 0 && !durationEl.textContent.match(/^\d+:\d\d$/)) {
    durationEl.textContent = formatTime(dur);
  }
  if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession && dur > 0) {
    try {
      navigator.mediaSession.setPositionState({
        duration: dur,
        playbackRate: audio.playbackRate,
        position: Math.min(audio.currentTime, dur),
      });
    } catch (e) { /* iOS may reject */ }
  }
  saveResume(false); // throttled internally
});
audio.addEventListener('emptied', resetTimeDisplay);
audio.addEventListener('loadstart', resetTimeDisplay);
audio.addEventListener('loadedmetadata', () => {
  const dur = effectiveDuration();
  durationEl.textContent = formatTime(dur);
});
audio.addEventListener('play', () => {
  playIcon.innerHTML = PAUSE_ICON;
  nativeSetPlaybackState('playing');
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
});
audio.addEventListener('pause', () => {
  playIcon.innerHTML = PLAY_ICON;
  nativeSetPlaybackState('paused');
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
  saveResume(true);
});
window.addEventListener('pagehide', () => saveResume(true));

view.addEventListener('click', e => {
  // Track ⋮ in album-detail / songs / albums views

    e.stopPropagation();

    return;
  }
  // Track ⋮ inside a playlist-detail view (different menu set)
  const plMenu = e.target.closest('.track-menu[data-playlist-track]');
  if (plMenu) {
    e.stopPropagation();
    const pos = Number(plMenu.dataset.playlistTrack);
    if (!Number.isNaN(pos)) openPlaylistTrackSheet(pos);
    return;
  }
  // "New playlist" tile
  if (e.target.closest('[data-action="new-playlist"]')) {
    promptCreatePlaylist();
    return;
  }
  // Playlist row in playlists list
  const plRow = e.target.closest('[data-playlist-id]');
  if (plRow) {
    const raw = plRow.dataset.playlistId;
    // Smart Favorites tile (synthesized, not in state.playlists).
    if (raw === '__favorites__') {
      state.currentPlaylist = favoritesSmartPlaylist();
      state.view = 'playlist-detail';
      view.scrollTop = 0;
      render();
      return;
    }
    // Local playlists use integer IDB ids; Jellyfin uses string GUIDs.
    const pid = /^\d+$/.test(raw) ? Number(raw) : raw;
    const p = state.playlists.find(p => p.id === pid);
    if (p) {
      // A new tap into the playlist resets any prior failure so we retry once.
      if (p.loadFailed) p.loadFailed = false;
      state.currentPlaylist = p;
      state.view = 'playlist-detail';
      view.scrollTop = 0;
      // Kick off the fetch BEFORE the first render so the view shows "Loading…"
      // instead of briefly flashing an empty state. ensurePlaylistLoaded sets
      // p.loading synchronously and resolves whether it succeeds or fails.
      if (p.source === 'jellyfin' && !p.loaded) {
        ensurePlaylistLoaded(p).then(() => {
          // Only re-render if the user is still on this playlist.
          if (state.view === 'playlist-detail' && state.currentPlaylist && state.currentPlaylist.id === p.id) render();
        });
      }
      render();
    }
    return;
  }
  const trackRow = e.target.closest('.track[data-track]');
  if (trackRow) {
    const idx = Number(trackRow.dataset.track);
    if (!Number.isNaN(idx)) playTrackFromCurrentView(idx);
    return;
  }
  const albumCard = e.target.closest('.album-card');
  if (albumCard) {
    state.view = 'album-detail';
    state.currentAlbum = albumCard.dataset.album;
    view.scrollTop = 0;
    render();
    return;
  }
  if (e.target.closest('#back')) {
    if (state.view === 'playlist-detail') {
      state.view = 'playlists';
      state.currentPlaylist = null;
    } else {
      state.view = 'albums';
      state.currentAlbum = null;
    }
    view.scrollTop = 0;
    render();
    return;
  }
  if (e.target.closest('#play-album')) {
    const album = state.currentAlbum;
    const indices = state.tracks
      .map((t, i) => albumOf(t) === album ? i : -1)
      .filter(i => i !== -1);
    if (indices.length === 0) return;
    setQueue(indices, indices[0]);
    loadQueueCurrent(true);
    return;
  }
  if (e.target.closest('#album-menu')) {
    if (state.currentAlbum) openAlbumSheet(state.currentAlbum);
    return;
  }
  if (e.target.closest('#play-playlist')) {
    if (!state.currentPlaylist) return;
    const indices = playlistTracks(state.currentPlaylist);
    if (indices.length === 0) return;
    setQueue(indices, indices[0]);
    loadQueueCurrent(true);
    return;
  }
  if (e.target.closest('#playlist-menu')) {
    if (state.currentPlaylist) openPlaylistMenuSheet();
    return;
  }
});

async function handleAlbumSheetAction(act, albumName) {
  if (act === 'play') {
    closeSheet();
    const indices = state.tracks
      .map((t, i) => albumOf(t) === albumName ? i : -1)
      .filter(i => i !== -1);
    if (indices.length === 0) return;
    setQueue(indices, indices[0]);
    loadQueueCurrent(true);
  } else if (act === 'rename') {
    closeSheet();
    const next = prompt(`Rename album "${albumName}" to:`, albumName);
    if (next !== null) await renameAlbum(albumName, next);
  } else if (act === 'remove') {
    closeSheet();
    const count = state.tracks.filter(t => albumOf(t) === albumName).length;
    const msg = `Remove "${albumName}" and all ${count} track${count === 1 ? '' : 's'} from your library?\n\nThe music files on your phone are not affected.`;
    if (confirm(msg)) await removeAlbum(albumName);
  } else if (act === 'add-to-playlist') {
    openAddToPlaylistSheet('album', albumName);
  } else {
    closeSheet();
  }
}

async function handleAddToPlaylistAction(playlistTarget, kind, payload) {
  if (playlistTarget === '__cancel__') { closeSheet(); return; }
  let playlist;
  if (playlistTarget === '__new__') {
    const name = prompt('Name your new playlist:');
    if (!name) { closeSheet(); return; }
    playlist = await createPlaylist(name);
    if (!playlist) { closeSheet(); return; }
  } else {
    // Local playlists use integer IDB ids; Jellyfin uses string GUIDs.
    const id = /^\d+$/.test(playlistTarget) ? Number(playlistTarget) : playlistTarget;
    playlist = state.playlists.find(p => p.id === id);
    if (!playlist) { closeSheet(); return; }
    // For Jellyfin playlists we need entryIds for future remove/reorder, so
    // make sure the items are loaded before we start adding.
    if (playlist.source === 'jellyfin' && !playlist.loaded) {
      await ensurePlaylistLoaded(playlist);
    }
  }
  let added = 0, skipped = 0;
  if (kind === 'track') {
    const t = state.tracks[Number(payload)];
    if (t && t.id != null) {
      const ok = await addTrackToPlaylist(playlist, t.id);
      if (ok) added++; else skipped++;
    }
  } else if (kind === 'album') {
    const albumTracks = state.tracks.filter(t => albumOf(t) === payload);
    for (const t of albumTracks) {
      if (t.id == null) continue;
      const ok = await addTrackToPlaylist(playlist, t.id);
      if (ok) added++; else skipped++;
    }
  }
  closeSheet();
  if (added && skipped) showToast(`Added ${added} to "${playlist.name}" (${skipped} already there)`);
  else if (added) showToast(`Added ${added} to "${playlist.name}"`);
  else if (skipped) showToast(`Already in "${playlist.name}"`);
  if (state.view === 'playlists' || state.view === 'playlist-detail') render();
}

async function handlePlaylistTrackAction(act, positionInPlaylist) {
  const p = state.currentPlaylist;
  if (!p) { closeSheet(); return; }
  if (act === 'cancel') { closeSheet(); return; }
  if (act === 'play') {
    closeSheet();
    const indices = playlistTracks(p);
    if (indices.length === 0) return;
    // For smart playlists (Favorites), positionInPlaylist indexes into the
    // computed list, not a stored trackIds array.
    const targetTrackIdx = p.smart
      ? indices[positionInPlaylist]
      : state.tracks.findIndex(t => t.id === p.trackIds[positionInPlaylist]);
    if (targetTrackIdx == null || targetTrackIdx < 0) return;
    setQueue(indices, targetTrackIdx);
    loadQueueCurrent(true);
    return;
  }
  if (act === 'unfavorite') {
    closeSheet();
    const indices = playlistTracks(p);
    const trackIdx = indices[positionInPlaylist];
    if (trackIdx >= 0) await toggleFavorite(state.tracks[trackIdx]);
    return;
  }
  if (act === 'move-up') {
    closeSheet();
    await movePlaylistTrack(p, positionInPlaylist, positionInPlaylist - 1);
    render();
    return;
  }
  if (act === 'move-down') {
    closeSheet();
    await movePlaylistTrack(p, positionInPlaylist, positionInPlaylist + 1);
    render();
    return;
  }
  if (act === 'remove') {
    closeSheet();
    await removeTrackFromPlaylist(p, positionInPlaylist);
    render();
    return;
  }
}

async function handlePlaylistMenuAction(act) {
  const p = state.currentPlaylist;
  if (!p) { closeSheet(); return; }
  if (act === 'cancel') { closeSheet(); return; }
  if (act === 'play') {
    closeSheet();
    const indices = playlistTracks(p);
    if (indices.length === 0) return;
    setQueue(indices, indices[0]);
    loadQueueCurrent(true);
    return;
  }
  if (act === 'rename') {
    closeSheet();
    const next = prompt('Rename playlist', p.name);
    if (next !== null) {
      await renamePlaylist(p, next);
      render();
    }
    return;
  }
  if (act === 'delete') {
    closeSheet();
    if (!confirm(`Delete playlist "${p.name}"? The songs in it are not affected.`)) return;
    await deletePlaylist(p.id);
    state.currentPlaylist = null;
    state.view = 'playlists';
    render();
    showToast('Playlist deleted');
    return;
  }
}

  try {
    navigator.mediaSession.setActionHandler('seekto', (e) => {
      if (e.fastSeek && 'fastSeek' in audio) audio.fastSeek(e.seekTime);
      else audio.currentTime = e.seekTime;
    });
  } catch (e) { /* some browsers don't support seekto */ }
  try {
    navigator.mediaSession.setActionHandler('seekbackward', (e) => {
      audio.currentTime = Math.max(0, audio.currentTime - (e.seekOffset || 10));
    });
    navigator.mediaSession.setActionHandler('seekforward', (e) => {
      const dur = effectiveDuration();
      audio.currentTime = Math.min(dur || (audio.currentTime + 10), audio.currentTime + (e.seekOffset || 10));
    });
  } catch (e) { /* optional */ }
}

/* ---------- Service worker + install prompt ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.warn('SW registration failed', err);
    });
  });
}

let deferredPrompt = null;
const installBanner = document.getElementById('install-banner');
const installBtn = document.getElementById('install-btn');
const installDismiss = document.getElementById('install-dismiss');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (localStorage.getItem('install-dismissed') !== '1') {
    installBanner.classList.add('visible');
  }
});

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  installBanner.classList.remove('visible');
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
});
installDismiss.addEventListener('click', () => {
  installBanner.classList.remove('visible');
  localStorage.setItem('install-dismissed', '1');
});

window.addEventListener('appinstalled', () => {
  installBanner.classList.remove('visible');
  showToast('Installed — launch from your home screen');
});

if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().catch(() => {});
}

/* ---------- Boot ---------- */
loadPrefs();
applyRepeatVisual();
loadJellyfinConfig();
loadSavedSource();
state.tracks = state.local.tracks;
state.playlists = state.local.playlists;
applySourceUI();
document.getElementById('lib-footer').textContent = `Music Player v${APP_VERSION}`;
restoreLibrary();
</script>
</body>
