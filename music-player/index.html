<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Music">
<meta name="mobile-web-app-capable" content="yes">
<title>Music Player</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<script src="vendor/jsmediatags.min.js"></script>
<style>
  :root {
    --bg: #0b0b10;
    --bg-2: #15151d;
    --surface: #1d1d27;
    --text: #f2f2f5;
    --muted: #9b9bb0;
    --accent: #7c5cff;
    --accent-2: #4ad6ff;
    --danger: #ff5d6c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(140% 90% at 50% 0%, #21214a 0%, var(--bg) 55%, #06060a 100%);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    overscroll-behavior: contain;
    user-select: none;
    -webkit-user-select: none;
  }
  header {
    padding: 16px 18px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .header-actions { display: flex; gap: 6px; }
  .pick-btn {
    appearance: none;
    border: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(124, 92, 255, 0.35);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .pick-btn.ghost {
    background: rgba(255,255,255,0.08);
    color: var(--text);
    box-shadow: none;
    font-weight: 500;
  }
  .pick-btn:active { transform: translateY(1px); }
  .pick-btn input { display: none; }
  .pick-btn svg { width: 14px; height: 14px; fill: currentColor; }

  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  .now-playing {
    padding: 8px 18px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
  }
  .artwork {
    width: min(58vw, 260px);
    aspect-ratio: 1 / 1;
    border-radius: 22px;
    background:
      radial-gradient(120% 120% at 30% 20%, rgba(124,92,255,0.7), rgba(74,214,255,0.3) 60%, rgba(0,0,0,0.4) 100%),
      var(--surface);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.85);
    overflow: hidden;
    position: relative;
  }
  .artwork svg { width: 38%; height: 38%; opacity: 0.85; }
  .artwork img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .artwork.has-art svg { display: none; }
  .track-meta { width: 100%; padding: 0 8px; }
  .track-title {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .track-sub {
    font-size: 13px;
    color: var(--muted);
    margin: 4px 0 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .progress-wrap { padding: 0 18px; width: 100%; }
  .progress {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    height: 24px;
  }
  .progress::-webkit-slider-runnable-track {
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 999px;
  }
  .progress::-moz-range-track {
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 999px;
  }
  .progress::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    margin-top: -5px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .progress::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    border: 0;
  }
  .times {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 14px 18px 4px;
  }
  .ctrl {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .ctrl svg { width: 26px; height: 26px; fill: currentColor; }
  .ctrl.toggle.active { color: var(--accent-2); }
  .ctrl:active { background: rgba(255,255,255,0.08); }
  .ctrl.play {
    width: 72px;
    height: 72px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    box-shadow: 0 12px 30px rgba(124, 92, 255, 0.4);
  }
  .ctrl.play svg { width: 32px; height: 32px; }

  .volume-row {
    padding: 6px 18px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
  }
  .volume-row svg { width: 18px; height: 18px; fill: currentColor; }
  .volume-row input[type=range] { flex: 1; }

  .library {
    flex: 1;
    min-height: 160px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: rgba(255,255,255,0.02);
    border-top: 1px solid rgba(255,255,255,0.06);
    padding-bottom: 8px;
  }
  .tabs {
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(11, 11, 16, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    padding: 8px 12px;
    gap: 4px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .tab {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .tab.active { background: rgba(124,92,255,0.18); color: var(--text); }
  .tabs .spacer { flex: 1; }
  .tabs .clear-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 11px;
    cursor: pointer;
  }
  .tabs .clear-btn:active { background: rgba(255,255,255,0.08); }

  .back-row {
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(11, 11, 16, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .back-btn {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .back-btn:active { background: rgba(255,255,255,0.08); }
  .back-btn svg { width: 22px; height: 22px; fill: currentColor; }
  .back-title { flex: 1; min-width: 0; }
  .back-title h2 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .back-title .meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
  }
  .play-album-btn {
    appearance: none;
    border: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .play-album-btn svg { width: 12px; height: 12px; fill: currentColor; }
  .play-album-btn:active { transform: translateY(1px); }

  .album-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 14px;
  }
  .album-card {
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: column;
  }
  .album-card:active { transform: scale(0.98); }
  .album-art {
    aspect-ratio: 1 / 1;
    background:
      radial-gradient(120% 120% at 30% 20%, rgba(124,92,255,0.7), rgba(74,214,255,0.3) 60%, rgba(0,0,0,0.4) 100%),
      var(--bg-2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.7);
    position: relative;
    overflow: hidden;
  }
  .album-art svg { width: 38%; height: 38%; fill: currentColor; }
  .album-art img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .album-art.has-art svg { display: none; }
  .album-name {
    font-size: 13px;
    font-weight: 600;
    padding: 8px 10px 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .album-count {
    font-size: 11px;
    color: var(--muted);
    padding: 0 10px 10px;
  }

  .track {
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    border-left: 3px solid transparent;
  }
  .track:active { background: rgba(255,255,255,0.06); }
  .track.playing { border-left-color: var(--accent-2); background: rgba(124,92,255,0.08); }
  .track-num {
    width: 24px;
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .track-info { flex: 1; min-width: 0; }
  .track-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 14px;
  }
  .track-album-sub {
    font-size: 11px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 2px;
  }
  .track-menu {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .track-menu:active { background: rgba(255,255,255,0.08); }
  .track-menu svg { width: 18px; height: 18px; fill: currentColor; }
  .track.playing .track-name { color: var(--accent-2); font-weight: 600; }

  .empty {
    color: var(--muted);
    text-align: center;
    padding: 32px 24px;
    font-size: 14px;
    line-height: 1.5;
  }
  .empty .hint { font-size: 12px; margin-top: 6px; opacity: 0.8; }

  .install-banner {
    margin: 8px 18px 0;
    padding: 10px 14px;
    background: rgba(124, 92, 255, 0.12);
    border: 1px solid rgba(124, 92, 255, 0.3);
    border-radius: 12px;
    font-size: 12px;
    color: var(--text);
    display: none;
    align-items: center;
    gap: 10px;
  }
  .install-banner.visible { display: flex; }
  .install-banner button {
    appearance: none;
    border: 0;
    background: var(--accent);
    color: #fff;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    margin-left: auto;
  }
  .install-banner .dismiss {
    background: transparent;
    color: var(--muted);
    padding: 6px 8px;
    margin-left: 4px;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom) + 24px);
    transform: translateX(-50%) translateY(20px);
    background: rgba(20, 20, 30, 0.95);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 10px 14px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 100;
  }
  .toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 200;
  }
  .sheet-backdrop.visible { display: flex; }
  .sheet {
    background: var(--bg-2);
    border-radius: 18px 18px 0 0;
    width: 100%;
    max-width: 480px;
    padding: 12px 0 max(12px, env(safe-area-inset-bottom));
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .sheet-title {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    padding: 8px 16px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .sheet-action {
    display: block;
    width: 100%;
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text);
    text-align: left;
    padding: 14px 18px;
    font-size: 15px;
    cursor: pointer;
  }
  .sheet-action:active { background: rgba(255,255,255,0.06); }
  .sheet-action.danger { color: var(--danger); }
  .sheet-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 4px 0; }

  .source-toggle {
    display: inline-flex;
    background: rgba(255,255,255,0.06);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .src-pill {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    min-width: 60px;
  }
  .src-pill.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
  }
  .icon-btn {
    appearance: none;
    border: 0;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .icon-btn:active { background: rgba(255,255,255,0.16); }
  .icon-btn svg { width: 18px; height: 18px; fill: currentColor; }
  .icon-btn .spin { animation: spin 0.9s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .settings-form { padding: 12px 18px; }
  .settings-form label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 10px 0 4px;
  }
  .settings-form input {
    width: 100%;
    appearance: none;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  .settings-form input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .settings-row { display: flex; gap: 8px; padding: 10px 18px 4px; }
  .settings-row button {
    flex: 1;
    appearance: none;
    border: 0;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .settings-row .primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
  }
  .settings-row .secondary {
    background: rgba(255,255,255,0.08);
    color: var(--text);
  }
  .settings-row .danger {
    background: rgba(255, 93, 108, 0.16);
    color: var(--danger);
    border: 1px solid rgba(255,93,108,0.3);
  }
  .conn-status {
    margin: 4px 18px 12px;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 12px;
    background: rgba(255,255,255,0.04);
    color: var(--muted);
    line-height: 1.4;
  }
  .conn-status.ok { color: var(--accent-2); background: rgba(74,214,255,0.08); }
  .conn-status.err { color: var(--danger); background: rgba(255,93,108,0.08); }
  .conn-hint { font-size: 11px; color: var(--muted); padding: 0 18px 12px; line-height: 1.5; }

  @media (min-width: 720px) {
    body { padding: 0; }
    main, header { max-width: 480px; margin-left: auto; margin-right: auto; width: 100%; }
    .album-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<header>
  <div class="source-toggle" id="source-toggle">
    <button class="src-pill active" data-src="local" type="button">Local</button>
    <button class="src-pill" data-src="jellyfin" type="button">Jellyfin</button>
  </div>
  <div class="header-actions">
    <label class="pick-btn ghost" id="folder-pick" hidden>
      <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
      Folder
      <input id="folder-input" type="file" webkitdirectory directory multiple>
    </label>
    <label class="pick-btn" id="files-pick">
      Add files
      <input id="file-input" type="file" accept="audio/*,.mp3,.m4a,.aac,.ogg,.oga,.opus,.wav,.flac,.wma,.webm" multiple>
    </label>
    <button class="icon-btn" id="jf-refresh" type="button" aria-label="Refresh Jellyfin library" hidden>
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.45 11h-2.07A6 6 0 1 1 12 6a5.9 5.9 0 0 1 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
    <button class="icon-btn" id="settings-btn" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94 0 .31.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </button>
  </div>
</header>

<div class="install-banner" id="install-banner" role="region" aria-label="Install app">
  <span>Install this player as an app on your home screen</span>
  <button id="install-btn" type="button">Install</button>
  <button class="dismiss" id="install-dismiss" type="button" aria-label="Dismiss">×</button>
</div>

<main>
  <section class="now-playing">
    <div class="artwork" id="artwork">
      <img id="artwork-img" alt="" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
    </div>
    <div class="track-meta">
      <p class="track-title" id="title">No track loaded</p>
      <p class="track-sub" id="subtitle">Tap "Add files" to load music</p>
    </div>
  </section>

  <div class="progress-wrap">
    <input id="seek" class="progress" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
    <div class="times">
      <span id="current">0:00</span>
      <span id="duration">0:00</span>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl toggle" id="shuffle" type="button" aria-label="Shuffle" aria-pressed="false">

<script>
"use strict";

/* ---------- IndexedDB persistence ---------- */
const DB_NAME = 'music-player-db';
const DB_VERSION = 1;
const STORE = 'tracks';
const UNSORTED = 'Unsorted';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) {
        const store = db.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
        store.createIndex('addedAt', 'addedAt');
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbAll(db) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).index('addedAt').getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

function idbAdd(db, record) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).add(record);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbPut(db, record) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).put(record);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbDelete(db, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function idbClear(db) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

/* ---------- DOM refs ---------- */
const audio = document.getElementById('audio');
const fileInput = document.getElementById('file-input');
const folderInput = document.getElementById('folder-input');
const folderPickLabel = document.getElementById('folder-pick');
const titleEl = document.getElementById('title');
const subtitleEl = document.getElementById('subtitle');
const seek = document.getElementById('seek');
const currentEl = document.getElementById('current');
const durationEl = document.getElementById('duration');
const playBtn = document.getElementById('play');
const playIcon = document.getElementById('play-icon');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const shuffleBtn = document.getElementById('shuffle');
const repeatBtn = document.getElementById('repeat');
const volume = document.getElementById('volume');
const view = document.getElementById('view');
const tabs = document.getElementById('tabs');
const clearBtn = document.getElementById('clear');
const toast = document.getElementById('toast');
const sheetBackdrop = document.getElementById('sheet');
const sheetBody = document.getElementById('sheet-body');

const PLAY_ICON = '<path d="M8 5v14l11-7z"/>';
const PAUSE_ICON = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
const PREFS_KEY = 'music-player-prefs';

/* ---------- State ---------- */
const JF_CONFIG_KEY = 'music-player-jf';
const SOURCE_KEY = 'music-player-source';

const state = {
  tracks: [],          // active library — points to state.local.tracks or state.jellyfin.tracks
  currentIndex: -1,
  shuffle: false,
  repeat: 'off',
  queue: [],
  queuePos: -1,
  seeking: false,
  view: 'albums',
  currentAlbum: null,
  db: null,
  source: 'local',     // 'local' | 'jellyfin'
  local: { tracks: [] },
  jellyfin: {
    tracks: [],
    config: { serverUrl: '', accessToken: '', userId: '', username: '', deviceId: '' },
    lastSync: 0,
    syncing: false,
  },
};

function loadJellyfinConfig() {
  try {
    const raw = localStorage.getItem(JF_CONFIG_KEY);
    if (raw) Object.assign(state.jellyfin.config, JSON.parse(raw));
  } catch (e) { /* ignore */ }
  if (!state.jellyfin.config.deviceId) {
    state.jellyfin.config.deviceId = 'pwa-' + Math.random().toString(36).slice(2, 14);
    saveJellyfinConfig();
  }
}
function saveJellyfinConfig() {
  try { localStorage.setItem(JF_CONFIG_KEY, JSON.stringify(state.jellyfin.config)); } catch (e) { /* ignore */ }
}
function clearJellyfinConfig() {
  state.jellyfin.config = { serverUrl: '', accessToken: '', userId: '', username: '', deviceId: state.jellyfin.config.deviceId };
  saveJellyfinConfig();
}
function loadSavedSource() {
  try {
    const s = localStorage.getItem(SOURCE_KEY);
    if (s === 'local' || s === 'jellyfin') state.source = s;
  } catch (e) { /* ignore */ }
}
function saveSource() {
  try { localStorage.setItem(SOURCE_KEY, state.source); } catch (e) { /* ignore */ }
}

/* ---------- Feature detection ---------- */
// webkitdirectory works on desktop and Android Chromium; not on iOS Safari.
{
  const supports = 'webkitdirectory' in folderInput || 'directory' in folderInput;
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  if (!(supports && !isIOS)) {
    folderPickLabel.dataset.unsupported = 'true';
  }
}

/* ---------- Prefs ---------- */
function loadPrefs() {
  try {
    const raw = localStorage.getItem(PREFS_KEY);
    if (!raw) return;
    const p = JSON.parse(raw);
    if (typeof p.volume === 'number') {
      audio.volume = p.volume;
      volume.value = String(p.volume);
    }
    if (typeof p.shuffle === 'boolean') {
      state.shuffle = p.shuffle;
      shuffleBtn.classList.toggle('active', p.shuffle);
      shuffleBtn.setAttribute('aria-pressed', String(p.shuffle));
    }
    if (typeof p.repeat === 'string' && ['off','all','one'].includes(p.repeat)) {
      state.repeat = p.repeat;
      applyRepeatVisual();
    }
  } catch (e) { /* ignore */ }
}

function savePrefs() {
  try {
    localStorage.setItem(PREFS_KEY, JSON.stringify({
      volume: audio.volume,
      shuffle: state.shuffle,
      repeat: state.repeat,
    }));
  } catch (e) { /* ignore */ }
}

function applyRepeatVisual() {
  const active = state.repeat !== 'off';
  repeatBtn.classList.toggle('active', active);
  repeatBtn.setAttribute('aria-pressed', String(active));
  repeatBtn.title = `Repeat: ${state.repeat}`;
  repeatBtn.innerHTML = state.repeat === 'one'
    ? '<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm6 11v-5h-1l-2 1v1h1.5v3H13zm4-1H7v-4l-4 4 4 4v-3h12v-4h-2v3z"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>';
}

/* ---------- Utilities ---------- */
let toastTimer = null;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('visible'), 2400);
}

function formatTime(s) {
  if (!isFinite(s) || s < 0) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

function formatBytes(b) {
  if (b < 1024) return `${b} B`;
  if (b < 1024 * 1024) return `${(b / 1024).toFixed(1)} KB`;
  return `${(b / (1024 * 1024)).toFixed(1)} MB`;
}

function titleFromName(name) {
  const stripped = name.replace(/\.[^.]+$/, '');
  return stripped.replace(/^\d+[\s._-]+/, '').trim() || name;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// Derive album name from a File's webkitRelativePath. For
// "Artist/Album/01 Track.mp3" returns "Album". For "Album/01 Track.mp3" returns
// "Album". For files without a path, returns UNSORTED.
function deriveAlbum(file) {
  const path = file.webkitRelativePath || '';
  if (!path) return UNSORTED;
  const parts = path.split('/').filter(Boolean);
  if (parts.length >= 3) return parts[parts.length - 2];
  if (parts.length === 2) return parts[0];
  return UNSORTED;
}

function albumOf(track) { return track.album || UNSORTED; }
function artistOf(track) { return track.artist || ''; }

/* ---------- ID3 / metadata tag reading via jsmediatags ---------- */
function readTags(file) {
  return new Promise((resolve) => {
    if (typeof window.jsmediatags === 'undefined') { resolve(null); return; }
    try {
      window.jsmediatags.read(file, {
        onSuccess: (result) => resolve(result && result.tags ? result.tags : null),
        onError: () => resolve(null),
      });
    } catch (e) { resolve(null); }
  });
}

function pictureToBlob(picture) {
  if (!picture || !picture.data || !picture.format) return null;
  const data = picture.data;
  const arr = new Uint8Array(data.length);
  for (let i = 0; i < data.length; i++) arr[i] = data[i];
  return new Blob([arr], { type: picture.format });
}

// jsmediatags occasionally returns title/artist/album as objects on M4A files
// (e.g. { type: 'STR', text: '...' }). Normalize to plain strings.
function tagString(v) {
  if (v == null) return '';
  if (typeof v === 'string') return v.trim();
  if (typeof v === 'object') {
    if (typeof v.text === 'string') return v.text.trim();
    if (typeof v.data === 'string') return v.data.trim();
  }
  return String(v).trim();
}

function albumArtUrlFor(albumName) {
  for (const t of state.tracks) {
    if (albumOf(t) === albumName && t.pictureUrl) return t.pictureUrl;
  }
  return null;
}

/* ---------- Jellyfin API client ---------- */
const JF = {
  authHeader(token, deviceId) {
    const parts = [
      'MediaBrowser Client="MusicPlayerPWA"',
      'Device="Web"',
      `DeviceId="${deviceId || 'music-player-pwa'}"`,
      'Version="1.0.0"',
    ];
    if (token) parts.push(`Token="${token}"`);
    return parts.join(', ');
  },
  trimUrl(u) { return (u || '').trim().replace(/\/+$/, ''); },
  async authenticate(serverUrl, username, password, deviceId) {
    const url = `${this.trimUrl(serverUrl)}/Users/AuthenticateByName`;
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Emby-Authorization': this.authHeader(null, deviceId),
      },
      body: JSON.stringify({ Username: username, Pw: password }),
    });
    if (!res.ok) {
      let detail = '';
      try { detail = (await res.text()).slice(0, 200); } catch (e) { /* ignore */ }
      throw new Error(`Auth failed (HTTP ${res.status})${detail ? ': ' + detail : ''}`);
    }
    return await res.json();
  },
  async logout(config) {
    if (!config.serverUrl || !config.accessToken) return;
    try {
      await fetch(`${this.trimUrl(config.serverUrl)}/Sessions/Logout`, {
        method: 'POST',
        headers: { 'X-Emby-Authorization': this.authHeader(config.accessToken, config.deviceId) },
      });
    } catch (e) { /* ignore */ }
  },
  async fetchAllAudio(config) {
    const libs = await this.fetchViews(config);
    const musicLibs = libs.filter(l => l.CollectionType === 'music');
    if (musicLibs.length === 0) {
      // No explicit music library — fall back to "everything", which mirrors
      // the old behaviour. Better than returning nothing.
      return this._fetchAudioUnder(config, null);
    }
    const all = [];
    for (const lib of musicLibs) {
      const items = await this._fetchAudioUnder(config, lib.Id);
      for (const it of items) all.push(it);
    }
    return all;
  },
  async fetchViews(config) {
    const url = `${this.trimUrl(config.serverUrl)}/Users/${config.userId}/Views`;
    const res = await fetch(url, {
      headers: { 'X-Emby-Authorization': this.authHeader(config.accessToken, config.deviceId) },
    });
    if (!res.ok) throw new Error(`Views fetch failed (HTTP ${res.status})`);
    const json = await res.json();
    return Array.isArray(json.Items) ? json.Items : [];
  },
  async _fetchAudioUnder(config, parentId) {
    const params = new URLSearchParams({
      IncludeItemTypes: 'Audio',
      Recursive: 'true',
      Fields: 'AlbumId,Album,Artists,AlbumArtist,ParentIndexNumber,IndexNumber,RunTimeTicks,Path',
      SortBy: 'AlbumArtist,Album,ParentIndexNumber,IndexNumber,SortName',
      SortOrder: 'Ascending',
      Limit: '10000',
      EnableImages: 'true',
      ImageTypeLimit: '1',
    });
    if (parentId) params.set('ParentId', parentId);
    const url = `${this.trimUrl(config.serverUrl)}/Users/${config.userId}/Items?${params}`;
    const res = await fetch(url, {
      headers: { 'X-Emby-Authorization': this.authHeader(config.accessToken, config.deviceId) },
    });
    if (!res.ok) throw new Error(`Library fetch failed (HTTP ${res.status})`);
    const json = await res.json();
    return Array.isArray(json.Items) ? json.Items : [];
  },
  imageUrl(config, itemId, type, size) {
    if (!itemId) return null;
    const t = type || 'Primary';
    const s = size || 600;
    return `${this.trimUrl(config.serverUrl)}/Items/${itemId}/Images/${t}?fillHeight=${s}&fillWidth=${s}&quality=90`;
  },
  streamUrl(config, itemId) {
    const params = new URLSearchParams({
      UserId: config.userId,
      DeviceId: config.deviceId,
      api_key: config.accessToken,
      AudioCodec: 'mp3,aac,opus',
      Container: 'mp3,aac,m4a,webm,ogg',
      MaxStreamingBitrate: '320000',
      MaxAudioChannels: '2',
      TranscodingProtocol: 'http',
    });
    return `${this.trimUrl(config.serverUrl)}/Audio/${itemId}/universal?${params}`;
  },
};

function jfItemToTrack(item, config) {
  const artist = Array.isArray(item.Artists) && item.Artists.length
    ? item.Artists.join(', ')
    : (item.AlbumArtist || '');
  const albumName = (item.Album && item.Album.trim()) || UNSORTED;
  const pictureUrl = item.AlbumId
    ? JF.imageUrl(config, item.AlbumId)
    : JF.imageUrl(config, item.Id);
  return {
    source: 'jellyfin',
    id: 'jf:' + item.Id,
    itemId: item.Id,
    albumItemId: item.AlbumId || null,
    title: item.Name || 'Unknown',
    artist,
    album: albumName,
    url: JF.streamUrl(config, item.Id),
    pictureUrl,
    indexNumber: item.IndexNumber || 0,
    parentIndexNumber: item.ParentIndexNumber || 0,
    durationSec: item.RunTimeTicks ? Math.round(item.RunTimeTicks / 1e7) : 0,
    tagsRead: true,
  };
}

async function syncJellyfin(showFeedback) {
  const cfg = state.jellyfin.config;
  if (!cfg.serverUrl || !cfg.accessToken || !cfg.userId) {
    if (showFeedback) showToast('Not connected to Jellyfin');
    return false;
  }
  state.jellyfin.syncing = true;
  updateRefreshSpin(true);
  try {
    const items = await JF.fetchAllAudio(cfg);
    const tracks = items.map(it => jfItemToTrack(it, cfg));
    state.jellyfin.tracks = tracks;
    state.jellyfin.lastSync = Date.now();
    if (state.source === 'jellyfin') {
      state.tracks = state.jellyfin.tracks;
      // Reset current view + playback bookkeeping
      state.currentIndex = -1;
      state.queue = [];
      state.queuePos = -1;
      render();
    }
    if (showFeedback) showToast(`Loaded ${tracks.length} Jellyfin track${tracks.length === 1 ? '' : 's'}`);
    return true;
  } catch (err) {
    console.error('Jellyfin sync failed', err);
    showToast(`Jellyfin: ${err.message || 'sync failed'}`);
    return false;
  } finally {
    state.jellyfin.syncing = false;
    updateRefreshSpin(false);
  }
}

function updateRefreshSpin(spinning) {
  const btn = document.getElementById('jf-refresh');
  if (!btn) return;
  const svg = btn.querySelector('svg');
  if (svg) svg.classList.toggle('spin', !!spinning);
}

async function setActiveSource(nextSource, opts) {
  if (state.source === nextSource && !(opts && opts.force)) return;
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
  state.currentIndex = -1;
  state.queue = [];
  state.queuePos = -1;
  state.view = 'albums';
  state.currentAlbum = null;
  setNowPlayingArt(null);
  titleEl.textContent = 'No track loaded';

  state.source = nextSource;
  saveSource();

  if (nextSource === 'local') {
    state.tracks = state.local.tracks;
    subtitleEl.textContent = state.tracks.length ? 'Tap a track to play' : 'Tap "Add files" to load music';
  } else if (nextSource === 'jellyfin') {
    if (!state.jellyfin.config.accessToken) {
      state.tracks = [];
      subtitleEl.textContent = 'Tap the gear to connect to Jellyfin';
      render();
      applySourceUI();
      openSettingsSheet();
      return;
    }
    if (state.jellyfin.tracks.length === 0) {
      state.tracks = [];
      subtitleEl.textContent = 'Loading your Jellyfin library…';
      render();
      applySourceUI();
      const ok = await syncJellyfin(false);
      if (!ok) {
        subtitleEl.textContent = 'Could not reach Jellyfin';
        return;
      }
    }
    state.tracks = state.jellyfin.tracks;
    if (state.tracks.length > 0) {
      const indices = state.tracks.map((_, i) => i);
      setQueue(indices, indices[0]);
      loadTrack(indices[0], false);
    } else {
      subtitleEl.textContent = 'No tracks found';
    }
  }
  render();
  applySourceUI();
}

function applySourceUI() {
  const isLocal = state.source === 'local';
  document.querySelectorAll('.src-pill').forEach(p => {
    p.classList.toggle('active', p.dataset.src === state.source);
  });
  document.getElementById('files-pick').hidden = !isLocal;
  // Folder picker has its own feature-detect gate; keep hidden if unsupported
  const folderSupported = !document.getElementById('folder-pick').dataset.unsupported;
  document.getElementById('folder-pick').hidden = !(isLocal && folderSupported);
  document.getElementById('jf-refresh').hidden = isLocal;
}

function groupedAlbums() {
  const map = new Map();
  state.tracks.forEach((t, i) => {
    const a = albumOf(t);
    if (!map.has(a)) map.set(a, []);
    map.get(a).push(i);
  });
  // Sort albums alphabetically; UNSORTED at the end.
  const names = Array.from(map.keys()).sort((a, b) => {
    if (a === UNSORTED) return 1;
    if (b === UNSORTED) return -1;
    return a.localeCompare(b, undefined, { sensitivity: 'base' });
  });
  return names.map(name => ({ name, indices: map.get(name) }));
}

/* ---------- Queue management ---------- */
function setQueue(indices, startIndex) {
  // indices: array of track indices into state.tracks
  // startIndex: which track to play first (a value present in indices)
  let queue = indices.slice();
  if (state.shuffle) {
    for (let i = queue.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [queue[i], queue[j]] = [queue[j], queue[i]];
    }
    if (startIndex !== undefined && startIndex !== null) {
      const pos = queue.indexOf(startIndex);
      if (pos > 0) {
        [queue[0], queue[pos]] = [queue[pos], queue[0]];
      }
    }
  }
  state.queue = queue;
  if (startIndex !== undefined && startIndex !== null) {
    state.queuePos = queue.indexOf(startIndex);
  } else {
    state.queuePos = queue.length > 0 ? 0 : -1;
  }
}

function reshuffleQueueKeepingCurrent() {
  if (state.queue.length === 0) return;
  const current = state.queuePos >= 0 ? state.queue[state.queuePos] : null;
  const indices = state.queue.slice();
  if (state.shuffle) {
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    if (current !== null) {
      const pos = indices.indexOf(current);
      if (pos > 0) [indices[0], indices[pos]] = [indices[pos], indices[0]];
    }
  } else {
    indices.sort((a, b) => a - b);
  }
  state.queue = indices;
  if (current !== null) state.queuePos = indices.indexOf(current);
}

/* ---------- View rendering ---------- */
function render() {
  // Update tab visuals
  tabs.querySelectorAll('.tab').forEach(t => {
    const active = t.dataset.view === state.view || (state.view === 'album-detail' && t.dataset.view === 'albums');
    t.classList.toggle('active', active);
  });
  // Toggle sticky header type
  if (state.view === 'album-detail') {
    tabs.style.display = 'none';
  } else {
    tabs.style.display = '';
  }

  if (state.tracks.length === 0) {
    view.innerHTML = '<div class="empty">Your library is empty.<div class="hint">Pick audio files or a folder — they\'re stored locally on your phone, not uploaded anywhere.</div></div>';
    return;
  }

  if (state.view === 'albums') renderAlbumsGrid();
  else if (state.view === 'songs') renderSongsList();
  else if (state.view === 'album-detail') renderAlbumDetail();
}

function renderAlbumsGrid() {
  const albums = groupedAlbums();
  if (albums.length === 0) {
    view.innerHTML = '<div class="empty">No albums yet.</div>';
    return;
  }
  const html = '<div class="album-grid">' + albums.map(a => {
    const art = albumArtUrlFor(a.name);
    const artHtml = art
      ? `<img src="${escapeHtml(art)}" alt="">`
      : '<svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>';
    return `
    <div class="album-card" data-album="${escapeHtml(a.name)}">
      <div class="album-art${art ? ' has-art' : ''}">${artHtml}</div>
      <div class="album-name">${escapeHtml(a.name)}</div>
      <div class="album-count">${a.indices.length} track${a.indices.length === 1 ? '' : 's'}</div>
    </div>`;
  }).join('') + '</div>';
  view.innerHTML = html;
}

function renderAlbumDetail() {
  const album = state.currentAlbum;
  const indices = state.tracks
    .map((t, i) => albumOf(t) === album ? i : -1)
    .filter(i => i !== -1);
  if (indices.length === 0) {
    // Album disappeared (last track removed) — bounce back
    state.view = 'albums';
    state.currentAlbum = null;
    render();
    return;
  }
  const header = `
    <div class="back-row">
      <button class="back-btn" id="back" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div class="back-title">
        <h2>${escapeHtml(album)}</h2>
        <div class="meta">${indices.length} track${indices.length === 1 ? '' : 's'}</div>
      </div>
      <button class="play-album-btn" id="play-album" type="button">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Play
      </button>
      <button class="back-btn" id="album-menu" type="button" aria-label="Album menu">
        <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      </button>
    </div>
  `;
  const list = indices.map((i, n) => trackRow(i, n + 1, false)).join('');
  view.innerHTML = header + list;
}

function renderSongsList() {
  const html = state.tracks.map((t, i) => trackRow(i, i + 1, true)).join('');
  view.innerHTML = html;
}

function trackRow(trackIndex, number, showAlbumSub) {
  const t = state.tracks[trackIndex];
  const playing = trackIndex === state.currentIndex;
  let subText = '';
  if (showAlbumSub) {
    const artist = artistOf(t);
    const album = albumOf(t);
    subText = artist && album !== UNSORTED ? `${artist} · ${album}` :
              artist ? artist :
              album !== UNSORTED ? album : '';
  } else if (artistOf(t)) {
    subText = artistOf(t);
  }
  const sub = subText ? `<div class="track-album-sub">${escapeHtml(subText)}</div>` : '';
  return `
    <div class="track${playing ? ' playing' : ''}" data-track="${trackIndex}">
      <span class="track-num">${number}</span>
      <div class="track-info">
        <div class="track-name">${escapeHtml(t.title)}</div>
        ${sub}
      </div>
      <button class="track-menu" data-menu="${trackIndex}" aria-label="Track menu" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      </button>
    </div>
  `;
}

/* ---------- Track sheet (per-track menu) ---------- */
function openTrackSheet(trackIndex) {
  const t = state.tracks[trackIndex];
  if (!t) return;
  const isLocal = (t.source || 'local') === 'local';
  const localActions = `
    <button class="sheet-action" data-act="rename">Rename track…</button>
    <button class="sheet-action" data-act="move">Move to album…</button>
    <div class="sheet-divider"></div>
    <button class="sheet-action danger" data-act="remove">Remove from library</button>
  `;
  sheetBody.innerHTML = `
    <div class="sheet-title">${escapeHtml(t.title)}</div>
    <button class="sheet-action" data-act="play">Play</button>
    ${isLocal ? localActions : ''}
    <button class="sheet-action" data-act="cancel" style="text-align:center;color:var(--muted)">Cancel</button>
  `;
  sheetBackdrop.classList.add('visible');
  sheetBackdrop.dataset.track = String(trackIndex);
}

function openAlbumSheet(albumName) {
  const indices = state.tracks
    .map((t, i) => albumOf(t) === albumName ? i : -1)
    .filter(i => i !== -1);
  if (indices.length === 0) return;
  const isLocal = state.source === 'local';
  const localActions = `
    <button class="sheet-action" data-album-act="rename">Rename album…</button>
    <div class="sheet-divider"></div>
    <button class="sheet-action danger" data-album-act="remove">Remove album from library</button>
  `;
  sheetBody.innerHTML = `
    <div class="sheet-title">${escapeHtml(albumName)} · ${indices.length} track${indices.length === 1 ? '' : 's'}</div>
    <button class="sheet-action" data-album-act="play">Play album</button>
    ${isLocal ? localActions : ''}
    <button class="sheet-action" data-album-act="cancel" style="text-align:center;color:var(--muted)">Cancel</button>
  `;
  sheetBackdrop.classList.add('visible');
  sheetBackdrop.dataset.album = albumName;
}

function closeSheet() {
  sheetBackdrop.classList.remove('visible');
  delete sheetBackdrop.dataset.track;
  delete sheetBackdrop.dataset.album;
  delete sheetBackdrop.dataset.settings;
  sheetBody.innerHTML = '';
}

function openSettingsSheet() {
  const cfg = state.jellyfin.config;
  const connected = !!cfg.accessToken;
  const status = connected
    ? `<div class="conn-status ok">Connected to <strong>${escapeHtml(cfg.serverUrl)}</strong> as <strong>${escapeHtml(cfg.username)}</strong>${state.jellyfin.lastSync ? ` · ${state.jellyfin.tracks.length} track${state.jellyfin.tracks.length === 1 ? '' : 's'}` : ''}</div>`
    : `<div class="conn-status">Not connected.</div>`;
  const buttons = connected
    ? `<div class="settings-row">
         <button class="primary" data-settings-act="refresh" type="button">Refresh library</button>
         <button class="danger" data-settings-act="disconnect" type="button">Disconnect</button>
       </div>`
    : `<div class="settings-row">
         <button class="primary" data-settings-act="connect" type="button">Connect</button>
         <button class="secondary" data-settings-act="cancel" type="button">Cancel</button>
       </div>`;
  sheetBody.innerHTML = `
    <div class="sheet-title">Jellyfin</div>
    ${status}
    <div class="settings-form">
      <label for="jf-url">Server URL</label>
      <input id="jf-url" type="url" inputmode="url" autocomplete="url" placeholder="https://jellyfin.home.lab" value="${escapeHtml(cfg.serverUrl)}" ${connected ? 'disabled' : ''}>
      <label for="jf-user">Username</label>
      <input id="jf-user" type="text" autocomplete="username" placeholder="username" value="${escapeHtml(cfg.username)}" ${connected ? 'disabled' : ''}>
      ${connected ? '' : `
        <label for="jf-pass">Password</label>
        <input id="jf-pass" type="password" autocomplete="current-password" placeholder="password">
      `}
    </div>
    ${buttons}
    <div class="conn-hint">
      ${connected
        ? 'Your password is not stored — only the access token. Refresh re-fetches your library.'
        : 'The server must allow CORS from <code>' + escapeHtml(location.origin) + '</code>. On Jellyfin: Dashboard → Networking → CORS Hosts.'}
    </div>
  `;
  sheetBackdrop.classList.add('visible');
  sheetBackdrop.dataset.settings = 'jellyfin';
}

async function handleSettingsAction(act) {
  if (act === 'cancel') { closeSheet(); return; }
  if (act === 'disconnect') {
    closeSheet();
    if (!confirm('Disconnect from Jellyfin? The cached library will be cleared from this device.')) return;
    await JF.logout(state.jellyfin.config);
    clearJellyfinConfig();
    state.jellyfin.tracks = [];
    state.jellyfin.lastSync = 0;
    if (state.source === 'jellyfin') {
      await setActiveSource('local');
    }
    showToast('Disconnected from Jellyfin');
    return;
  }
  if (act === 'refresh') {
    closeSheet();
    await syncJellyfin(true);
    return;
  }
  if (act === 'connect') {
    const urlInput = document.getElementById('jf-url');
    const userInput = document.getElementById('jf-user');
    const passInput = document.getElementById('jf-pass');
    const serverUrl = JF.trimUrl(urlInput.value);
    const username = (userInput.value || '').trim();
    const password = passInput.value || '';
    if (!serverUrl || !username || !password) {
      showToast('Fill in server, username, and password');
      return;
    }
    // Mixed-content guard
    if (location.protocol === 'https:' && serverUrl.startsWith('http://')) {
      showToast('HTTPS page can\'t talk to an HTTP server — use https:// on Jellyfin');
      return;
    }
    const deviceId = state.jellyfin.config.deviceId;
    const btn = sheetBody.querySelector('button[data-settings-act="connect"]');
    if (btn) { btn.textContent = 'Connecting…'; btn.disabled = true; }
    try {
      const result = await JF.authenticate(serverUrl, username, password, deviceId);
      if (!result || !result.AccessToken || !result.User) throw new Error('No token returned');
      state.jellyfin.config = {
        serverUrl,
        accessToken: result.AccessToken,
        userId: result.User.Id,
        username: result.User.Name || username,
        deviceId,
      };
      saveJellyfinConfig();
      closeSheet();
      showToast('Connected to Jellyfin');
      await setActiveSource('jellyfin', { force: true });
    } catch (err) {
      console.error('Jellyfin connect failed', err);
      const msg = String(err.message || err);
      const friendly = msg.includes('Failed to fetch')
        ? 'Can\'t reach the server. Check the URL, network, and CORS.'
        : msg;
      showToast(friendly);
      if (btn) { btn.textContent = 'Connect'; btn.disabled = false; }
    }
  }
}

async function renameAlbum(oldName, newName) {
  if (state.source !== 'local') return;
  const target = (newName || '').trim() || UNSORTED;
  if (target === oldName) return;
  const affected = state.tracks.filter(t => albumOf(t) === oldName);
  for (const t of affected) {
    t.album = target;
    await persistTrack(t);
  }
  if (state.currentAlbum === oldName) state.currentAlbum = target;
  render();
  showToast(`Renamed to "${target}"`);
}

async function removeAlbum(albumName) {
  if (state.source !== 'local') return;
  const indices = [];
  state.tracks.forEach((t, i) => { if (albumOf(t) === albumName) indices.push(i); });
  if (indices.length === 0) return;

  // Remember the currently-playing track by id so we can find its new index after splicing.
  const currentId = state.currentIndex !== -1 ? state.tracks[state.currentIndex].id : null;
  const removedIds = new Set(indices.map(i => state.tracks[i].id));
  const playingRemoved = currentId !== null && removedIds.has(currentId);

  // Splice descending so earlier indices stay valid.
  for (const i of indices.slice().sort((a, b) => b - a)) {
    const t = state.tracks[i];
    try { await idbDelete(state.db, t.id); } catch (e) { /* ignore */ }
    URL.revokeObjectURL(t.url);
    if (t.pictureUrl) URL.revokeObjectURL(t.pictureUrl);
    state.tracks.splice(i, 1);
  }

  const remaining = state.tracks.map((_, i) => i);
  if (playingRemoved) {
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
    state.currentIndex = -1;
    titleEl.textContent = 'No track loaded';
    subtitleEl.textContent = state.tracks.length ? 'Tap a track to play' : 'Tap "Add files" to load music';
    if (remaining.length > 0) {
      setQueue(remaining, remaining[0]);
      loadTrack(remaining[0], false);
    } else {
      state.queue = [];
      state.queuePos = -1;
    }
  } else if (currentId !== null) {
    state.currentIndex = state.tracks.findIndex(t => t.id === currentId);
    if (state.currentIndex !== -1) {
      setQueue(remaining, state.currentIndex);
    } else {
      state.queue = remaining;
      state.queuePos = remaining.length > 0 ? 0 : -1;
    }
  }

  if (state.currentAlbum === albumName) {
    state.view = 'albums';
    state.currentAlbum = null;
  }
  render();
  showToast(`Removed "${albumName}"`);
}

async function handleSheetAction(act, trackIndex) {
  const t = state.tracks[trackIndex];
  if (!t) { closeSheet(); return; }
  if (act === 'play') {
    closeSheet();
    playTrackFromCurrentView(trackIndex);
  } else if (act === 'rename') {
    closeSheet();
    const next = prompt('Rename track', t.title);
    if (next !== null) {
      const trimmed = next.trim();
      if (trimmed) {
        t.title = trimmed;
        await persistTrack(t);
        if (trackIndex === state.currentIndex) titleEl.textContent = trimmed;
        render();
      }
    }
  } else if (act === 'move') {
    closeSheet();
    const existing = groupedAlbums().map(a => a.name).filter(n => n !== albumOf(t));
    const hint = existing.length ? `\n\nExisting albums:\n• ${existing.join('\n• ')}` : '';
    const next = prompt(`Move "${t.title}" to album:${hint}`, albumOf(t));
    if (next !== null) {
      const trimmed = next.trim() || UNSORTED;
      t.album = trimmed;
      await persistTrack(t);
      render();
      showToast(`Moved to "${trimmed}"`);
    }
  } else if (act === 'remove') {
    closeSheet();
    removeTrack(trackIndex);
  } else {
    closeSheet();
  }
}

async function persistTrack(t) {
  try {
    await idbPut(state.db, t);
  } catch (e) {
    console.error('Persist failed', e);
    showToast('Could not save change');
  }
}

/* ---------- Playback ---------- */
function loadTrack(index, autoplay) {
  if (index < 0 || index >= state.tracks.length) return;
  state.currentIndex = index;
  const track = state.tracks[index];
  audio.src = track.url;
  titleEl.textContent = track.title;
  subtitleEl.textContent = subtitleFor(track);
  setNowPlayingArt(track.pictureUrl || albumArtUrlFor(albumOf(track)));
  // Reset the seek/time display; loadedmetadata will refresh once the audio
  // header is parsed, but for Jellyfin transcodes the metadata duration is
  // already known up-front so prefer it.
  seek.value = '0';
  currentEl.textContent = '0:00';
  durationEl.textContent = track.durationSec > 0 ? formatTime(track.durationSec) : '0:00';
  render();
  updateMediaSession();
  if (autoplay) audio.play().catch(() => {});
}

function subtitleFor(track) {
  const artist = artistOf(track);
  const album = albumOf(track);
  if (artist && album !== UNSORTED) return `${artist} · ${album}`;
  if (artist) return artist;
  if (album !== UNSORTED) return album;
  return formatBytes(track.size || 0);
}

function setNowPlayingArt(url) {
  const artwork = document.getElementById('artwork');
  const img = document.getElementById('artwork-img');
  if (url) {
    img.src = url;
    img.hidden = false;
    artwork.classList.add('has-art');
  } else {
    img.removeAttribute('src');
    img.hidden = true;
    artwork.classList.remove('has-art');
  }
}

function playTrackFromCurrentView(trackIndex) {
  // Queue depends on the current view.
  if (state.view === 'album-detail' && state.currentAlbum) {
    const album = state.currentAlbum;
    const indices = state.tracks
      .map((t, i) => albumOf(t) === album ? i : -1)
      .filter(i => i !== -1);
    setQueue(indices, trackIndex);
  } else {
    // Songs view or albums grid play-all: queue all tracks
    const indices = state.tracks.map((_, i) => i);
    setQueue(indices, trackIndex);
  }
  loadTrack(trackIndex, true);
}

function playPause() {
  if (state.currentIndex === -1 && state.tracks.length > 0) {
    const indices = state.tracks.map((_, i) => i);
    setQueue(indices, indices[0]);
    loadTrack(state.queue[0], true);
    return;
  }
  if (audio.paused) audio.play().catch(() => {});
  else audio.pause();
}

function nextTrack(auto) {
  if (state.tracks.length === 0 || state.queue.length === 0) return;
  if (state.repeat === 'one' && auto) {
    audio.currentTime = 0;
    audio.play().catch(() => {});
    return;
  }
  let pos = state.queuePos + 1;
  if (pos >= state.queue.length) {
    if (state.repeat === 'all' || !auto) {
      pos = 0;
      if (state.shuffle) reshuffleQueueKeepingCurrent();
    } else {
      audio.pause();
      return;
    }
  }
  state.queuePos = pos;
  loadTrack(state.queue[pos], true);
}

function prevTrack() {
  if (state.tracks.length === 0 || state.queue.length === 0) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  let pos = state.queuePos - 1;
  if (pos < 0) pos = state.queue.length - 1;
  state.queuePos = pos;
  loadTrack(state.queue[pos], true);
}

/* ---------- File ingestion ---------- */
async function addFiles(files) {
  if (state.source !== 'local') {
    await setActiveSource('local');
  }
  const audioFiles = Array.from(files).filter(f =>
    f.type.startsWith('audio/') || /\.(mp3|m4a|aac|ogg|oga|opus|wav|flac|wma|webm)$/i.test(f.name)
  );
  if (audioFiles.length === 0) {
    showToast('No supported audio files in selection');
    return;
  }
  audioFiles.sort((a, b) => {
    const ap = a.webkitRelativePath || a.name;
    const bp = b.webkitRelativePath || b.name;
    return ap.localeCompare(bp, undefined, { numeric: true, sensitivity: 'base' });
  });
  const startedEmpty = state.tracks.length === 0;

  for (const file of audioFiles) {
    const tags = await readTags(file);
    const tagTitle = tags ? tagString(tags.title) : '';
    const tagArtist = tags ? tagString(tags.artist) : '';
    const tagAlbum = tags ? tagString(tags.album) : '';
    const pictureBlob = tags ? pictureToBlob(tags.picture) : null;

    const record = {
      name: file.name,
      title: tagTitle || titleFromName(file.name),
      artist: tagArtist || null,
      album: tagAlbum || deriveAlbum(file),
      type: file.type || 'audio/mpeg',
      size: file.size,
      addedAt: Date.now(),
      blob: file,
      pictureBlob: pictureBlob || undefined,
      pictureMime: pictureBlob ? pictureBlob.type : undefined,
      tagsRead: true,
    };
    try {
      const id = await idbAdd(state.db, record);
      record.id = id;
      record.url = URL.createObjectURL(record.blob);
      if (pictureBlob) record.pictureUrl = URL.createObjectURL(pictureBlob);
      state.tracks.push(record);
    } catch (err) {
      console.error('Failed to store track', file.name, err);
      showToast(`Couldn't save "${file.name}"`);
    }
  }
  render();
  if (startedEmpty && state.tracks.length > 0) {
    const indices = state.tracks.map((_, i) => i);
    setQueue(indices, indices[0]);
    loadTrack(indices[0], false);
  }
  showToast(`Added ${audioFiles.length} track${audioFiles.length === 1 ? '' : 's'}`);
}

async function removeTrack(index) {
  if (state.source !== 'local') return;
  if (index < 0 || index >= state.tracks.length) return;
  const track = state.tracks[index];
  const wasPlaying = index === state.currentIndex && !audio.paused;
  const wasCurrent = index === state.currentIndex;

  try { await idbDelete(state.db, track.id); } catch (e) { /* ignore */ }
  URL.revokeObjectURL(track.url);
  if (track.pictureUrl) URL.revokeObjectURL(track.pictureUrl);
  state.tracks.splice(index, 1);

  // Fix up state.currentIndex and queue indices after removal.
  state.queue = state.queue.filter(i => i !== index).map(i => i > index ? i - 1 : i);
  if (wasCurrent) {
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
    state.currentIndex = -1;
    titleEl.textContent = 'No track loaded';
    subtitleEl.textContent = state.tracks.length ? 'Tap a track to play' : 'Tap "Add files" to load music';
    if (state.queue.length > 0) {
      state.queuePos = Math.min(state.queuePos, state.queue.length - 1);
      if (state.queuePos < 0) state.queuePos = 0;
      loadTrack(state.queue[state.queuePos], wasPlaying);
    } else {
      state.queuePos = -1;
    }
  } else if (state.currentIndex > index) {
    state.currentIndex--;
    // queuePos refers to position within queue, not affected by reindexing tracks
  }
  render();
}

async function clearPlaylist() {
  if (state.source !== 'local') return;
  for (const t of state.local.tracks) {
    URL.revokeObjectURL(t.url);
    if (t.pictureUrl) URL.revokeObjectURL(t.pictureUrl);
  }
  state.local.tracks.length = 0;
  state.tracks = state.local.tracks;
  state.currentIndex = -1;
  state.queue = [];
  state.queuePos = -1;
  try { await idbClear(state.db); } catch (e) { /* ignore */ }
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
  titleEl.textContent = 'No track loaded';
  subtitleEl.textContent = 'Tap "Add files" to load music';
  setNowPlayingArt(null);
  state.view = 'albums';
  state.currentAlbum = null;
  render();
}

function updateMediaSession() {
  if (!('mediaSession' in navigator)) return;
  const track = state.tracks[state.currentIndex];
  if (!track) { navigator.mediaSession.metadata = null; return; }
  const artUrl = track.pictureUrl || albumArtUrlFor(albumOf(track));
  const artwork = artUrl
    ? [{
        src: artUrl,
        sizes: '512x512',
        type: track.pictureMime || 'image/jpeg',
      }]
    : [];
  navigator.mediaSession.metadata = new MediaMetadata({
    title: track.title,
    artist: artistOf(track),
    album: albumOf(track) === UNSORTED ? '' : albumOf(track),
    artwork,
  });
}

async function restoreLibrary() {
  try {
    state.db = await openDB();
    const records = await idbAll(state.db);
    let needsMigration = false;
    state.local.tracks.length = 0;
    for (const r of records) {
      if (!r.album) {
        r.album = UNSORTED;
        needsMigration = true;
      }
      r.url = URL.createObjectURL(r.blob);
      if (r.pictureBlob) r.pictureUrl = URL.createObjectURL(r.pictureBlob);
      r.source = 'local';
      state.local.tracks.push(r);
    }
    if (needsMigration) {
      for (const r of state.local.tracks) {
        if (r.album === UNSORTED) await idbPut(state.db, r).catch(() => {});
      }
    }
    await setActiveSource(state.source, { force: true });
    if (state.source === 'local' && state.tracks.length > 0) {
      const indices = state.tracks.map((_, i) => i);
      setQueue(indices, indices[0]);
      loadTrack(indices[0], false);
    }
    if (state.source === 'local') backfillTags();
  } catch (err) {
    console.error('Failed to open library', err);
    showToast('Could not load saved library');
    render();
  }
}

// One-time progressive tag backfill for tracks imported before tag reading
// existed. Marks each record with `tagsRead: true` once processed so we only
// touch each track once. Runs in the background, gentle on the main thread.
async function backfillTags() {
  if (typeof window.jsmediatags === 'undefined') return;
  const todo = state.tracks.filter(t => !t.tagsRead);
  if (todo.length === 0) return;
  let updated = 0;
  for (const t of todo) {
    if (!t.blob) { t.tagsRead = true; await idbPut(state.db, t).catch(() => {}); continue; }
    const tags = await readTags(t.blob);
    let changed = false;
    if (tags) {
      const tagTitle = tagString(tags.title);
      const tagArtist = tagString(tags.artist);
      const tagAlbum = tagString(tags.album);
      const pictureBlob = pictureToBlob(tags.picture);
      // Only overwrite title/album if the existing values are filename/folder-derived
      // (we have no way to tell perfectly, but we keep user-edited values intact by
      // not overwriting if the user has already renamed via the sheet — there's no
      // marker for that, so be conservative: only fill empty/derived fields)
      if (!t.artist && tagArtist) { t.artist = tagArtist; changed = true; }
      if (tagAlbum && (t.album === UNSORTED || t.album === deriveAlbum({ webkitRelativePath: '', name: t.name }))) {
        if (t.album !== tagAlbum) { t.album = tagAlbum; changed = true; }
      }
      if (tagTitle && t.title === titleFromName(t.name)) {
        t.title = tagTitle; changed = true;
      }
      if (!t.pictureBlob && pictureBlob) {
        t.pictureBlob = pictureBlob;
        t.pictureMime = pictureBlob.type;
        t.pictureUrl = URL.createObjectURL(pictureBlob);
        changed = true;
      }
    }
    t.tagsRead = true;
    await idbPut(state.db, t).catch(() => {});
    if (changed) updated++;
    // Yield to the UI between tracks
    await new Promise(r => setTimeout(r, 0));
  }
  if (updated > 0) {
    render();
    if (state.currentIndex !== -1) {
      const t = state.tracks[state.currentIndex];
      titleEl.textContent = t.title;
      subtitleEl.textContent = subtitleFor(t);
      setNowPlayingArt(t.pictureUrl || albumArtUrlFor(albumOf(t)));
      updateMediaSession();
    }
    showToast(`Read tags from ${updated} track${updated === 1 ? '' : 's'}`);
  }
}

/* ---------- Event wiring ---------- */
fileInput.addEventListener('change', e => {
  addFiles(e.target.files);
  fileInput.value = '';
});
folderInput.addEventListener('change', e => {
  addFiles(e.target.files);
  folderInput.value = '';
});

playBtn.addEventListener('click', playPause);
nextBtn.addEventListener('click', () => nextTrack(false));
prevBtn.addEventListener('click', prevTrack);

shuffleBtn.addEventListener('click', () => {
  state.shuffle = !state.shuffle;
  shuffleBtn.classList.toggle('active', state.shuffle);
  shuffleBtn.setAttribute('aria-pressed', String(state.shuffle));
  reshuffleQueueKeepingCurrent();
  savePrefs();
});

repeatBtn.addEventListener('click', () => {
  state.repeat = state.repeat === 'off' ? 'all' : state.repeat === 'all' ? 'one' : 'off';
  applyRepeatVisual();
  savePrefs();
});

volume.addEventListener('input', () => {
  audio.volume = Number(volume.value);
  savePrefs();
});

// Returns the duration to use for the seek bar / time display. Prefers the
// audio element's reported duration; falls back to the current track's
// metadata duration (Jellyfin transcoding streams have no Content-Length so
// audio.duration ends up Infinity).
function effectiveDuration() {
  if (isFinite(audio.duration) && audio.duration > 0) return audio.duration;
  const t = state.tracks[state.currentIndex];
  if (t && t.durationSec > 0) return t.durationSec;
  return 0;
}

seek.addEventListener('input', () => { state.seeking = true; });
seek.addEventListener('change', () => {
  const dur = effectiveDuration();
  if (dur > 0) audio.currentTime = (Number(seek.value) / 1000) * dur;
  state.seeking = false;
});

function resetTimeDisplay() {
  seek.value = '0';
  currentEl.textContent = '0:00';
  const t = state.tracks[state.currentIndex];
  if (t && t.durationSec > 0) durationEl.textContent = formatTime(t.durationSec);
  else durationEl.textContent = '0:00';
}

audio.addEventListener('timeupdate', () => {
  if (state.seeking) return;
  // Skip stale events from a previous source. After audio.src changes, the
  // element drops to readyState 0 and re-progresses; ignore everything before
  // metadata is available again so the old track's currentTime doesn't briefly
  // get displayed against the new track's duration.
  if (audio.readyState < 1) return;
  const dur = effectiveDuration();
  if (dur > 0) seek.value = String(Math.floor((audio.currentTime / dur) * 1000));
  currentEl.textContent = formatTime(audio.currentTime);
  if (dur > 0 && !durationEl.textContent.match(/^\d+:\d\d$/)) {
    durationEl.textContent = formatTime(dur);
  }
  if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession && dur > 0) {
    try {
      navigator.mediaSession.setPositionState({
        duration: dur,
        playbackRate: audio.playbackRate,
        position: Math.min(audio.currentTime, dur),
      });
    } catch (e) { /* iOS may reject */ }
  }
});
audio.addEventListener('emptied', resetTimeDisplay);
audio.addEventListener('loadstart', resetTimeDisplay);
audio.addEventListener('loadedmetadata', () => {
  const dur = effectiveDuration();
  durationEl.textContent = formatTime(dur);
});
audio.addEventListener('play', () => {
  playIcon.innerHTML = PAUSE_ICON;
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
});
audio.addEventListener('pause', () => {
  playIcon.innerHTML = PLAY_ICON;
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
});
audio.addEventListener('ended', () => nextTrack(true));
audio.addEventListener('error', () => {
  showToast('Playback error — skipping');
  setTimeout(() => nextTrack(true), 500);
});

tabs.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  state.view = tab.dataset.view;
  state.currentAlbum = null;
  view.scrollTop = 0;
  render();
});

view.addEventListener('click', e => {
  const menu = e.target.closest('.track-menu');
  if (menu) {
    e.stopPropagation();
    const idx = Number(menu.dataset.menu);
    if (!Number.isNaN(idx)) openTrackSheet(idx);
    return;
  }
  const trackRow = e.target.closest('.track');
  if (trackRow) {
    const idx = Number(trackRow.dataset.track);
    if (!Number.isNaN(idx)) playTrackFromCurrentView(idx);
    return;
  }
  const albumCard = e.target.closest('.album-card');
  if (albumCard) {
    state.view = 'album-detail';
    state.currentAlbum = albumCard.dataset.album;
    view.scrollTop = 0;
    render();
    return;
  }
  if (e.target.closest('#back')) {
    state.view = 'albums';
    state.currentAlbum = null;
    view.scrollTop = 0;
    render();
    return;
  }
  if (e.target.closest('#play-album')) {
    const album = state.currentAlbum;
    const indices = state.tracks
      .map((t, i) => albumOf(t) === album ? i : -1)
      .filter(i => i !== -1);
    if (indices.length === 0) return;
    setQueue(indices, indices[0]);
    loadTrack(state.queue[0], true);
    return;
  }
  if (e.target.closest('#album-menu')) {
    if (state.currentAlbum) openAlbumSheet(state.currentAlbum);
    return;
  }
});

async function handleAlbumSheetAction(act, albumName) {
  if (act === 'play') {
    closeSheet();
    const indices = state.tracks
      .map((t, i) => albumOf(t) === albumName ? i : -1)
      .filter(i => i !== -1);
    if (indices.length === 0) return;
    setQueue(indices, indices[0]);
    loadTrack(state.queue[0], true);
  } else if (act === 'rename') {
    closeSheet();
    const next = prompt(`Rename album "${albumName}" to:`, albumName);
    if (next !== null) await renameAlbum(albumName, next);
  } else if (act === 'remove') {
    closeSheet();
    const count = state.tracks.filter(t => albumOf(t) === albumName).length;
    const msg = `Remove "${albumName}" and all ${count} track${count === 1 ? '' : 's'} from your library?\n\nThe music files on your phone are not affected.`;
    if (confirm(msg)) await removeAlbum(albumName);
  } else {
    closeSheet();
  }
}

sheetBackdrop.addEventListener('click', e => {
  if (e.target === sheetBackdrop) { closeSheet(); return; }
  const settingsBtn = e.target.closest('[data-settings-act]');
  if (settingsBtn) {
    handleSettingsAction(settingsBtn.dataset.settingsAct);
    return;
  }
  const action = e.target.closest('.sheet-action');
  if (!action) return;
  if (action.dataset.albumAct) {
    handleAlbumSheetAction(action.dataset.albumAct, sheetBackdrop.dataset.album);
    return;
  }
  const trackIndex = Number(sheetBackdrop.dataset.track);
  handleSheetAction(action.dataset.act, trackIndex);
});

document.getElementById('source-toggle').addEventListener('click', e => {
  const pill = e.target.closest('.src-pill');
  if (!pill) return;
  setActiveSource(pill.dataset.src);
});
document.getElementById('settings-btn').addEventListener('click', openSettingsSheet);
document.getElementById('jf-refresh').addEventListener('click', () => syncJellyfin(true));

clearBtn.addEventListener('click', () => {
  if (state.source !== 'local') {
    showToast('Clear only works on the Local library');
    return;
  }
  if (state.tracks.length === 0) return;
  if (confirm('Remove all tracks from your library? Your music files on your phone are not affected — only the references this app stores.')) {
    clearPlaylist();
  }
});

// Lock-screen / Bluetooth / headphone key controls
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => audio.play().catch(() => {}));
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
  navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack(false));
  try {
    navigator.mediaSession.setActionHandler('seekto', (e) => {
      if (e.fastSeek && 'fastSeek' in audio) audio.fastSeek(e.seekTime);
      else audio.currentTime = e.seekTime;
    });
  } catch (e) { /* some browsers don't support seekto */ }
  try {
    navigator.mediaSession.setActionHandler('seekbackward', (e) => {
      audio.currentTime = Math.max(0, audio.currentTime - (e.seekOffset || 10));
    });
    navigator.mediaSession.setActionHandler('seekforward', (e) => {
      const dur = effectiveDuration();
      audio.currentTime = Math.min(dur || (audio.currentTime + 10), audio.currentTime + (e.seekOffset || 10));
    });
  } catch (e) { /* optional */ }
}

/* ---------- Service worker + install prompt ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.warn('SW registration failed', err);
    });
  });
}

let deferredPrompt = null;
const installBanner = document.getElementById('install-banner');
const installBtn = document.getElementById('install-btn');
const installDismiss = document.getElementById('install-dismiss');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (localStorage.getItem('install-dismissed') !== '1') {
    installBanner.classList.add('visible');
  }
});

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  installBanner.classList.remove('visible');
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
});
installDismiss.addEventListener('click', () => {
  installBanner.classList.remove('visible');
  localStorage.setItem('install-dismissed', '1');
});

window.addEventListener('appinstalled', () => {
  installBanner.classList.remove('visible');
  showToast('Installed — launch from your home screen');
});

if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().catch(() => {});
}

/* ---------- Boot ---------- */
loadPrefs();
applyRepeatVisual();
loadJellyfinConfig();
loadSavedSource();
state.tracks = state.local.tracks;
applySourceUI();
restoreLibrary();
</script>
</body>
</html>
