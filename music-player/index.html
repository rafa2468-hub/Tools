<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Music">
<meta name="mobile-web-app-capable" content="yes">
<title>Music Player</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<script src="vendor/jsmediatags.min.js"></script>
<style>
  :root {
    --bg: #0b0b10;
    --bg-2: #15151d;
    --surface: #1d1d27;
    --text: #f2f2f5;
    --muted: #9b9bb0;
    --accent: #7c5cff;
    --accent-2: #4ad6ff;
    --danger: #ff5d6c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(140% 90% at 50% 0%, #21214a 0%, var(--bg) 55%, #06060a 100%);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    overscroll-behavior: contain;
    user-select: none;
    -webkit-user-select: none;
  }
  header {
    padding: 14px 14px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    flex-wrap: nowrap;
  }
  @media (max-width: 359px) {
    header { padding: 12px 8px 6px; gap: 4px; }
    .header-actions { gap: 4px; }
    .icon-btn, .pick-btn.compact { width: 32px; height: 32px; }
    .src-pill { padding: 6px 10px; min-width: 0; }
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .header-actions { display: flex; gap: 6px; }
  .pick-btn {
    appearance: none;
    border: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(124, 92, 255, 0.35);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .pick-btn.ghost {
    background: rgba(255,255,255,0.08);
    color: var(--text);
    box-shadow: none;
    font-weight: 500;
  }
  .pick-btn:active { transform: translateY(1px); }
  .pick-btn input { display: none; }
  .pick-btn svg { width: 14px; height: 14px; fill: currentColor; }
  .pick-btn.compact {
    padding: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 0;
    gap: 0;
    justify-content: center;
  }
  .pick-btn.compact svg { width: 18px; height: 18px; }

  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  .now-playing {
    padding: 8px 18px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
    position: relative;
  }
  .fav-btn {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 6px;
    cursor: pointer;
    position: absolute;
    right: 14px;
    bottom: 14px;
  }
  .fav-btn svg { width: 22px; height: 22px; fill: currentColor; opacity: 0.7; }
  .fav-btn.active { color: var(--danger); }
  .fav-btn.active svg { opacity: 1; }
  .fav-btn:active { transform: scale(0.92); }
  .artwork {
    width: min(58vw, 260px);
    aspect-ratio: 1 / 1;
    border-radius: 22px;
    background:
      radial-gradient(120% 120% at 30% 20%, rgba(124,92,255,0.7), rgba(74,214,255,0.3) 60%, rgba(0,0,0,0.4) 100%),
      var(--surface);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.85);
    overflow: hidden;
    position: relative;
  }
  .artwork svg { width: 38%; height: 38%; opacity: 0.85; }
  .artwork img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .artwork.has-art svg { display: none; }
  .track-meta { width: 100%; padding: 0 8px; }
  .track-title {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .track-sub {
    font-size: 13px;
    color: var(--muted);
    margin: 4px 0 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .progress-wrap { padding: 0 18px; width: 100%; }
  .progress {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    height: 24px;
  }
  .progress::-webkit-slider-runnable-track {
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 999px;
  }
  .progress::-moz-range-track {
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 999px;
  }
  .progress::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    margin-top: -5px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .progress::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    border: 0;
  }
  .times {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 14px 18px 4px;
  }
  .ctrl {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .ctrl svg { width: 26px; height: 26px; fill: currentColor; }
  .ctrl.toggle.active { color: var(--accent-2); }
  .ctrl:active { background: rgba(255,255,255,0.08); }
  .ctrl.play {
    width: 72px;
    height: 72px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    box-shadow: 0 12px 30px rgba(124, 92, 255, 0.4);
  }
  .ctrl.play svg { width: 32px; height: 32px; }

  .volume-row {
    padding: 6px 18px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
  }
  .volume-row svg { width: 18px; height: 18px; fill: currentColor; }
  .volume-row input[type=range] { flex: 1; }

  .library {
    flex: 1;
    min-height: 160px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: rgba(255,255,255,0.02);
    border-top: 1px solid rgba(255,255,255,0.06);
    padding-bottom: 8px;
  }
  .tabs {
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(11, 11, 16, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    padding: 8px 12px;
    gap: 4px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .tab {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .tab.active { background: rgba(124,92,255,0.18); color: var(--text); }
  .tabs .spacer { flex: 1; }
  .tabs .clear-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 11px;
    cursor: pointer;
  }
  .tabs .clear-btn:active { background: rgba(255,255,255,0.08); }

  .back-row {
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(11, 11, 16, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .back-btn {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .back-btn:active { background: rgba(255,255,255,0.08); }
  .back-btn svg { width: 22px; height: 22px; fill: currentColor; }
  .back-title { flex: 1; min-width: 0; }
  .back-title h2 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .back-title .meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
  }
  .play-album-btn {
    appearance: none;
    border: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .play-album-btn svg { width: 12px; height: 12px; fill: currentColor; }
  .play-album-btn:active { transform: translateY(1px); }

  .album-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 14px;
  }
  .album-card {
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: column;
  }
  .album-card:active { transform: scale(0.98); }
  .album-art {
    aspect-ratio: 1 / 1;
    background:
      radial-gradient(120% 120% at 30% 20%, rgba(124,92,255,0.7), rgba(74,214,255,0.3) 60%, rgba(0,0,0,0.4) 100%),
      var(--bg-2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.7);
    position: relative;
    overflow: hidden;
  }
  .album-art svg { width: 38%; height: 38%; fill: currentColor; }
  .album-art img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .album-art.has-art svg { display: none; }
  .album-name {
    font-size: 13px;
    font-weight: 600;
    padding: 8px 10px 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .album-count {
    font-size: 11px;
    color: var(--muted);
    padding: 0 10px 10px;
  }

  .track {
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    border-left: 3px solid transparent;
  }
  .track:active { background: rgba(255,255,255,0.06); }
  .track.playing { border-left-color: var(--accent-2); background: rgba(124,92,255,0.08); }
  .track-num {
    width: 24px;
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .track-info { flex: 1; min-width: 0; }
  .track-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 14px;
  }
  .track-album-sub {
    font-size: 11px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 2px;
  }
  .track-menu {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .track-menu:active { background: rgba(255,255,255,0.08); }
  .track-menu svg { width: 18px; height: 18px; fill: currentColor; }
  .track.playing .track-name { color: var(--accent-2); font-weight: 600; }

  .empty {
    color: var(--muted);
    text-align: center;
    padding: 32px 24px;
    font-size: 14px;
    line-height: 1.5;
  }
  .empty .hint { font-size: 12px; margin-top: 6px; opacity: 0.8; }

  .install-banner {
    margin: 8px 18px 0;
    padding: 10px 14px;
    background: rgba(124, 92, 255, 0.12);
    border: 1px solid rgba(124, 92, 255, 0.3);
    border-radius: 12px;
    font-size: 12px;
    color: var(--text);
    display: none;
    align-items: center;
    gap: 10px;
  }
  .install-banner.visible { display: flex; }
  .install-banner button {
    appearance: none;
    border: 0;
    background: var(--accent);
    color: #fff;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    margin-left: auto;
  }
  .install-banner .dismiss {
    background: transparent;
    color: var(--muted);
    padding: 6px 8px;
    margin-left: 4px;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom) + 24px);
    transform: translateX(-50%) translateY(20px);
    background: rgba(20, 20, 30, 0.95);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 10px 14px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 100;
  }
  .toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 200;
  }
  .sheet-backdrop.visible { display: flex; }
  .sheet {
    background: var(--bg-2);
    border-radius: 18px 18px 0 0;
    width: 100%;
    max-width: 480px;
    padding: 12px 0 max(12px, env(safe-area-inset-bottom));
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .sheet-title {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    padding: 8px 16px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .sheet-action {
    display: block;
    width: 100%;
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text);
    text-align: left;
    padding: 14px 18px;
    font-size: 15px;
    cursor: pointer;
  }
  .sheet-action:active { background: rgba(255,255,255,0.06); }
  .sheet-action.danger { color: var(--danger); }
  .sheet-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 4px 0; }

  .source-toggle {
    display: inline-flex;
    background: rgba(255,255,255,0.06);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .src-pill {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    min-width: 60px;
  }
  .src-pill.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
  }
  .icon-btn {
    appearance: none;
    border: 0;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .icon-btn:active { background: rgba(255,255,255,0.16); }
  .icon-btn svg { width: 18px; height: 18px; fill: currentColor; }
  .icon-btn .spin { animation: spin 0.9s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .settings-form { padding: 12px 18px; }
  .settings-form label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 10px 0 4px;
  }
  .settings-form input {
    width: 100%;
    appearance: none;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  .settings-form input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .settings-row { display: flex; gap: 8px; padding: 10px 18px 4px; }
  .settings-row button {
    flex: 1;
    appearance: none;
    border: 0;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .settings-row .primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
  }
  .settings-row .secondary {
    background: rgba(255,255,255,0.08);
    color: var(--text);
  }
  .settings-row .danger {
    background: rgba(255, 93, 108, 0.16);
    color: var(--danger);
    border: 1px solid rgba(255,93,108,0.3);
  }
  .conn-status {
    margin: 4px 18px 12px;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 12px;
    background: rgba(255,255,255,0.04);
    color: var(--muted);
    line-height: 1.4;
  }
  .conn-status.ok { color: var(--accent-2); background: rgba(74,214,255,0.08); }
  .conn-status.err { color: var(--danger); background: rgba(255,93,108,0.08); }
  .conn-hint { font-size: 11px; color: var(--muted); padding: 0 18px 12px; line-height: 1.5; }

  .lib-footer {
    padding: 18px 18px 24px;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    opacity: 0.55;
    letter-spacing: 0.3px;
  }

  .search-bar {
    position: sticky;
    top: 0;
    z-index: 4;
    padding: 8px 14px;
    background: rgba(11,11,16,0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: none;
  }
  .search-bar.visible { display: block; }
  .search-bar input {
    width: 100%;
    appearance: none;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 14px;
    font-family: inherit;
  }
  .search-bar input:focus {
    outline: none;
    border-color: var(--accent);
  }
  #search-btn.active { background: rgba(124,92,255,0.25); color: #fff; }

  .sleep-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 4px 18px 12px;
  }
  .sleep-btn {
    appearance: none;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    padding: 10px;
    border-radius: 10px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  .sleep-btn.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    border-color: transparent;
  }
  .sheet-section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    padding: 12px 18px 4px;
  }

  @media (min-width: 720px) {
    body { padding: 0; }
    main, header { max-width: 480px; margin-left: auto; margin-right: auto; width: 100%; }
    .album-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<header>
  <div class="source-toggle" id="source-toggle">
    <button class="src-pill active" data-src="local" type="button">Local</button>
    <button class="src-pill" data-src="jellyfin" type="button">Jellyfin</button>
  </div>
  <div class="header-actions">
    <label class="pick-btn compact ghost" id="folder-pick" hidden aria-label="Add folder">
      <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
      <input id="folder-input" type="file" webkitdirectory directory multiple>
    </label>
    <label class="pick-btn compact" id="files-pick" aria-label="Add files">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>

<script>
"use strict";

const APP_VERSION = '1.7.4';

/* ---------- IndexedDB persistence ---------- */
const DB_NAME = 'music-player-db';
const DB_VERSION = 2;
const STORE = 'tracks';
const PLAYLIST_STORE = 'playlists';
const UNSORTED = 'Unsorted';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) {
        const store = db.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
        store.createIndex('addedAt', 'addedAt');
      }
      if (!db.objectStoreNames.contains(PLAYLIST_STORE)) {
        const store = db.createObjectStore(PLAYLIST_STORE, { keyPath: 'id', autoIncrement: true });
        store.createIndex('createdAt', 'createdAt');
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbAll(db) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).index('addedAt').getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

function idbAdd(db, record) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).add(record);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbPut(db, record) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).put(record);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbDelete(db, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function idbClear(db) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function idbAllPlaylists(db) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PLAYLIST_STORE, 'readonly');
    const req = tx.objectStore(PLAYLIST_STORE).index('createdAt').getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
function idbAddPlaylist(db, record) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PLAYLIST_STORE, 'readwrite');
    const req = tx.objectStore(PLAYLIST_STORE).add(record);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbPutPlaylist(db, record) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PLAYLIST_STORE, 'readwrite');
    const req = tx.objectStore(PLAYLIST_STORE).put(record);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbDeletePlaylist(db, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(PLAYLIST_STORE, 'readwrite');
    const req = tx.objectStore(PLAYLIST_STORE).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

/* ---------- DOM refs ---------- */
const audio = document.getElementById('audio');
const fileInput = document.getElementById('file-input');
const folderInput = document.getElementById('folder-input');
const folderPickLabel = document.getElementById('folder-pick');
const titleEl = document.getElementById('title');
const subtitleEl = document.getElementById('subtitle');
const seek = document.getElementById('seek');
const currentEl = document.getElementById('current');
const durationEl = document.getElementById('duration');
const playBtn = document.getElementById('play');
const playIcon = document.getElementById('play-icon');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const shuffleBtn = document.getElementById('shuffle');
const repeatBtn = document.getElementById('repeat');
const volume = document.getElementById('volume');
const view = document.getElementById('view');
const tabs = document.getElementById('tabs');
const clearBtn = document.getElementById('clear');
const toast = document.getElementById('toast');
const sheetBackdrop = document.getElementById('sheet');
const sheetBody = document.getElementById('sheet-body');

const PLAY_ICON = '<path d="M8 5v14l11-7z"/>';
const PAUSE_ICON = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
const PREFS_KEY = 'music-player-prefs';

/* ---------- State ---------- */
const JF_CONFIG_KEY = 'music-player-jf';
const SOURCE_KEY = 'music-player-source';
const RESUME_KEY = 'music-player-resume';

function loadResume() {
  try {
    const raw = localStorage.getItem(RESUME_KEY);
    if (!raw) return null;
    const r = JSON.parse(raw);
    if (!r || typeof r !== 'object') return null;
    return r;
  } catch (e) { return null; }
}
let lastResumeSavedAt = 0;
function saveResume(force) {
  const t = state.playingTrack;
  if (!t || t.id == null) return;
  const now = Date.now();
  if (!force && now - lastResumeSavedAt < 4000) return;
  lastResumeSavedAt = now;
  try {
    localStorage.setItem(RESUME_KEY, JSON.stringify({
      source: state.playingSource,
      trackId: t.id,
      position: Math.max(0, audio.currentTime || 0),
    }));
  } catch (e) { /* ignore */ }
}

const state = {
  tracks: [],          // active library — points to state.local.tracks or state.jellyfin.tracks
  playingTrack: null,  // the track object loaded in the audio element — survives a browse-library swap
  playingSource: null, // 'local' | 'jellyfin' — the source the playing track came from
  shuffle: false,
  repeat: 'off',
  queue: [],           // ordered list of track ids (survives a browse-library swap)
  queuePos: -1,        // position of the playing track within state.queue
  seeking: false,
  view: 'albums',
  currentAlbum: null,
  db: null,
  source: 'local',     // 'local' | 'jellyfin'
  search: '',          // lowercased current search query (empty = no filter)
  sleep: { expiresAt: 0, intervalId: 0 },
  playlists: [],       // reference to state.local.playlists or state.jellyfin.playlists
  currentPlaylist: null, // playlist record when view === 'playlist-detail'
  local: { tracks: [], playlists: [] },
  jellyfin: {
    tracks: [],
    playlists: [],
    config: { serverUrl: '', accessToken: '', userId: '', username: '', deviceId: '' },
    lastSync: 0,
    playlistsLoaded: false,
    syncing: false,
  },
};

function loadJellyfinConfig() {
  try {
    const raw = localStorage.getItem(JF_CONFIG_KEY);
    if (raw) Object.assign(state.jellyfin.config, JSON.parse(raw));
  } catch (e) { /* ignore */ }
  if (!state.jellyfin.config.deviceId) {
    state.jellyfin.config.deviceId = 'pwa-' + Math.random().toString(36).slice(2, 14);
    saveJellyfinConfig();
  }
}
function saveJellyfinConfig() {
  try { localStorage.setItem(JF_CONFIG_KEY, JSON.stringify(state.jellyfin.config)); } catch (e) { /* ignore */ }
}
function clearJellyfinConfig() {
  state.jellyfin.config = { serverUrl: '', accessToken: '', userId: '', username: '', deviceId: state.jellyfin.config.deviceId };
  saveJellyfinConfig();
}
function loadSavedSource() {
  try {
    const s = localStorage.getItem(SOURCE_KEY);
    if (s === 'local' || s === 'jellyfin') state.source = s;
  } catch (e) { /* ignore */ }
}
function saveSource() {
  try { localStorage.setItem(SOURCE_KEY, state.source); } catch (e) { /* ignore */ }
}

/* ---------- Feature detection ---------- */
// webkitdirectory works on desktop and Android Chromium; not on iOS Safari.
{
  const supports = 'webkitdirectory' in folderInput || 'directory' in folderInput;
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  if (!(supports && !isIOS)) {
    folderPickLabel.dataset.unsupported = 'true';
  }
}

/* ---------- Prefs ---------- */
function loadPrefs() {
  try {
    const raw = localStorage.getItem(PREFS_KEY);
    if (!raw) return;
    const p = JSON.parse(raw);
    if (typeof p.volume === 'number') {
      audio.volume = p.volume;
      volume.value = String(p.volume);
    }
    if (typeof p.shuffle === 'boolean') {
      state.shuffle = p.shuffle;
      shuffleBtn.classList.toggle('active', p.shuffle);
      shuffleBtn.setAttribute('aria-pressed', String(p.shuffle));
    }
    if (typeof p.repeat === 'string' && ['off','all','one'].includes(p.repeat)) {
      state.repeat = p.repeat;
      applyRepeatVisual();
    }
  } catch (e) { /* ignore */ }
}

function savePrefs() {
  try {
    localStorage.setItem(PREFS_KEY, JSON.stringify({
      volume: audio.volume,
      shuffle: state.shuffle,
      repeat: state.repeat,
    }));
  } catch (e) { /* ignore */ }
}

function applyRepeatVisual() {
  const active = state.repeat !== 'off';
  repeatBtn.classList.toggle('active', active);
  repeatBtn.setAttribute('aria-pressed', String(active));
  repeatBtn.title = `Repeat: ${state.repeat}`;
  repeatBtn.innerHTML = state.repeat === 'one'
    ? '<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm6 11v-5h-1l-2 1v1h1.5v3H13zm4-1H7v-4l-4 4 4 4v-3h12v-4h-2v3z"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>';
}

/* ---------- Utilities ---------- */
let toastTimer = null;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('visible'), 2400);
}

function formatTime(s) {
  if (!isFinite(s) || s < 0) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

function formatBytes(b) {
  if (b < 1024) return `${b} B`;
  if (b < 1024 * 1024) return `${(b / 1024).toFixed(1)} KB`;
  return `${(b / (1024 * 1024)).toFixed(1)} MB`;
}

function titleFromName(name) {
  const stripped = name.replace(/\.[^.]+$/, '');
  return stripped.replace(/^\d+[\s._-]+/, '').trim() || name;
}

// Derive artist/title from a "Artist - Title" filename when ID3 tags are
// unavailable (the common case in the WebView wrapper, where tag reading can
// fail on content:// files). Falls back to title-only when there's no " - ".
function parseNameMeta(name) {
  const base = name.replace(/\.[^.]+$/, '').replace(/^\d+[\s._-]+/, '').trim();
  const parts = base.split(/\s+-\s+/);
  if (parts.length >= 2) {
    const artist = parts[0].trim();
    const title = parts.slice(1).join(' - ').trim();
    if (artist && title) return { artist, title };
  }
  return { artist: '', title: base };
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// Derive album name from a File's webkitRelativePath. For
// "Artist/Album/01 Track.mp3" returns "Album". For "Album/01 Track.mp3" returns
// "Album". For files without a path, returns UNSORTED.
function deriveAlbum(file) {
  const path = file.webkitRelativePath || '';
  if (!path) return UNSORTED;
  const parts = path.split('/').filter(Boolean);
  if (parts.length >= 3) return parts[parts.length - 2];
  if (parts.length === 2) return parts[0];
  return UNSORTED;
}

// When the user picked a folder (webkitRelativePath set), the folder name is
// their organization intent — use it even if individual files have ID3 album
// tags pointing somewhere else (so a "Workout Mix" folder doesn't get exploded
// back into the original album names). For individually-picked files we have
// no folder context, so fall back to the ID3 album, then UNSORTED.
function chooseAlbumName(file, tagAlbum) {
  if (file.webkitRelativePath) return deriveAlbum(file);
  return tagAlbum || UNSORTED;
}

function albumOf(track) { return track.album || UNSORTED; }
function artistOf(track) { return track.artist || ''; }

/* ---------- ID3 / metadata tag reading via jsmediatags ---------- */
async function readTags(file) {
  if (typeof window.jsmediatags === 'undefined') return null;
  // In the Android WebView wrapper, picked files are backed by a content:// URI
  // that jsmediatags can't slice — tag reading fails even though playback works
  // (playback uses a blob URL). Materialize to an in-memory blob first so the
  // library reads from plain bytes. Harmless on desktop.
  let src = file;
  try { src = new Blob([await file.arrayBuffer()]); } catch (e) { /* fall back to original */ }
  return new Promise((resolve) => {
    // jsmediatags can silently hang on malformed tag headers in some files
    // (notably newer iTunes M4A variants). Cap the wait so a bad file can't
    // stall the whole import.
    let done = false;
    const finish = (val) => { if (done) return; done = true; clearTimeout(timer); resolve(val); };
    const timer = setTimeout(() => finish(null), 2500);
    try {
      window.jsmediatags.read(src, {
        onSuccess: (result) => finish(result && result.tags ? result.tags : null),
        onError: () => finish(null),
      });
    } catch (e) { finish(null); }
  });
}

function pictureToBlob(picture) {
  if (!picture || !picture.data || !picture.format) return null;
  const data = picture.data;
  const arr = new Uint8Array(data.length);
  for (let i = 0; i < data.length; i++) arr[i] = data[i];
  return new Blob([arr], { type: picture.format });
}

// jsmediatags occasionally returns title/artist/album as objects on M4A files
// (e.g. { type: 'STR', text: '...' }). Normalize to plain strings.
function tagString(v) {
  if (v == null) return '';
  if (typeof v === 'string') return v.trim();
  if (typeof v === 'object') {
    if (typeof v.text === 'string') return v.text.trim();
    if (typeof v.data === 'string') return v.data.trim();
  }
  return String(v).trim();
}

function albumArtUrlFor(albumName) {
  if (isMixedArtistAlbum(albumName)) return null;
  for (const t of state.tracks) {
    if (albumOf(t) === albumName && t.pictureUrl) return t.pictureUrl;
  }
  return null;
}

// True when the album groups songs from more than one named artist — in that
// case the first-track's cover art is not representative, so we'd rather show
// the generic gradient than mislead by reusing one song's art for the others.
function isMixedArtistAlbum(albumName) {
  const seen = new Set();
  for (const t of state.tracks) {
    if (albumOf(t) !== albumName) continue;
    const a = (t.artist || '').trim();
    if (a) seen.add(a);
    if (seen.size > 1) return true;
  }
  return false;
}

/* ---------- Jellyfin API client ---------- */
const JF = {
  authHeader(token, deviceId) {
    const parts = [
      'MediaBrowser Client="MusicPlayerPWA"',
      'Device="Web"',
      `DeviceId="${deviceId || 'music-player-pwa'}"`,
      'Version="1.0.0"',
    ];
    if (token) parts.push(`Token="${token}"`);
    return parts.join(', ');
  },
  trimUrl(u) { return (u || '').trim().replace(/\/+$/, ''); },
  async authenticate(serverUrl, username, password, deviceId) {
    const url = `${this.trimUrl(serverUrl)}/Users/AuthenticateByName`;
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Emby-Authorization': this.authHeader(null, deviceId),
      },
      body: JSON.stringify({ Username: username, Pw: password }),
    });
    if (!res.ok) {
      let detail = '';
      try { detail = (await res.text()).slice(0, 200); } catch (e) { /* ignore */ }
      throw new Error(`Auth failed (HTTP ${res.status})${detail ? ': ' + detail : ''}`);
    }
    return await res.json();
  },
  async logout(config) {
    if (!config.serverUrl || !config.accessToken) return;
    try {
      await fetch(`${this.trimUrl(config.serverUrl)}/Sessions/Logout`, {
        method: 'POST',
        headers: { 'X-Emby-Authorization': this.authHeader(config.accessToken, config.deviceId) },
      });
    } catch (e) { /* ignore */ }
  },
  async fetchAllAudio(config) {
    const libs = await this.fetchViews(config);
    const musicLibs = libs.filter(l => l.CollectionType === 'music');
    if (musicLibs.length === 0) {
      // No explicit music library — fall back to "everything", which mirrors
      // the old behaviour. Better than returning nothing.
      return this._fetchAudioUnder(config, null);
    }
    // Fetch MusicAlbum entities first to get authoritative album names.
    // Jellyfin uses the folder name as a display fallback when the ID3 tag is
    // missing, but the per-track API field stays empty — so grouping by
    // item.Album alone dumps those songs into "Unsorted". Mapping by AlbumId
    // gives us the same names Jellyfin's own UI shows.
    const albumNameById = new Map();
    for (const lib of musicLibs) {
      try {
        const albums = await this._fetchAlbumsUnder(config, lib.Id);
        for (const a of albums) {
          if (a.Id && a.Name) albumNameById.set(a.Id, a.Name);
        }
      } catch (e) {
        console.warn('Album list fetch failed for lib', lib.Id, e);
      }
    }
    const all = [];
    for (const lib of musicLibs) {
      const items = await this._fetchAudioUnder(config, lib.Id);
      for (const it of items) {
        if (it.AlbumId && albumNameById.has(it.AlbumId)) {
          it.Album = albumNameById.get(it.AlbumId);
        }
        all.push(it);
      }
    }
    return all;
  },
  async _fetchAlbumsUnder(config, parentId) {
    const params = new URLSearchParams({
      IncludeItemTypes: 'MusicAlbum',
      Recursive: 'true',
      Fields: 'AlbumArtist',
      SortBy: 'AlbumArtist,SortName',
      SortOrder: 'Ascending',
      Limit: '10000',
    });
    if (parentId) params.set('ParentId', parentId);
    const url = `${this.trimUrl(config.serverUrl)}/Users/${config.userId}/Items?${params}`;
    const res = await fetch(url, {
      headers: { 'X-Emby-Authorization': this.authHeader(config.accessToken, config.deviceId) },
    });
    if (!res.ok) throw new Error(`Album list fetch failed (HTTP ${res.status})`);
    const json = await res.json();
    return Array.isArray(json.Items) ? json.Items : [];
  },
  async fetchViews(config) {
    const url = `${this.trimUrl(config.serverUrl)}/Users/${config.userId}/Views`;
    const res = await fetch(url, {
      headers: { 'X-Emby-Authorization': this.authHeader(config.accessToken, config.deviceId) },
    });
    if (!res.ok) throw new Error(`Views fetch failed (HTTP ${res.status})`);
    const json = await res.json();
    return Array.isArray(json.Items) ? json.Items : [];
  },
  async _fetchAudioUnder(config, parentId) {
    const params = new URLSearchParams({
      IncludeItemTypes: 'Audio',
      Recursive: 'true',
      Fields: 'AlbumId,Album,Artists,AlbumArtist,ParentIndexNumber,IndexNumber,RunTimeTicks,Path,UserData',
      SortBy: 'AlbumArtist,Album,ParentIndexNumber,IndexNumber,SortName',
      SortOrder: 'Ascending',
      Limit: '10000',
      EnableImages: 'true',
      ImageTypeLimit: '1',
    });
    if (parentId) params.set('ParentId', parentId);
    const url = `${this.trimUrl(config.serverUrl)}/Users/${config.userId}/Items?${params}`;
    const res = await fetch(url, {
      headers: { 'X-Emby-Authorization': this.authHeader(config.accessToken, config.deviceId) },
    });
    if (!res.ok) throw new Error(`Library fetch failed (HTTP ${res.status})`);
    const json = await res.json();
    return Array.isArray(json.Items) ? json.Items : [];
  },
  imageUrl(config, itemId, type, size) {
    if (!itemId) return null;
    const t = type || 'Primary';
    const s = size || 600;
    return `${this.trimUrl(config.serverUrl)}/Items/${itemId}/Images/${t}?fillHeight=${s}&fillWidth=${s}&quality=90`;
  },
  streamUrl(config, itemId) {
    const params = new URLSearchParams({
      UserId: config.userId,
      DeviceId: config.deviceId,
      api_key: config.accessToken,
      AudioCodec: 'mp3,aac,opus',
      Container: 'mp3,aac,m4a,webm,ogg',
      MaxStreamingBitrate: '320000',
      MaxAudioChannels: '2',
      TranscodingProtocol: 'http',
    });
    return `${this.trimUrl(config.serverUrl)}/Audio/${itemId}/universal?${params}`;
  },

  /* ---- Jellyfin playlists ---- */
  async fetchPlaylists(config) {
    const params = new URLSearchParams({
      IncludeItemTypes: 'Playlist',
      Recursive: 'true',
      Fields: 'ChildCount',
      SortBy: 'SortName',
      SortOrder: 'Ascending',
      Limit: '1000',
    });
    const url = `${this.trimUrl(config.serverUrl)}/Users/${config.userId}/Items?${params}`;
    const res = await fetch(url, {
      headers: { 'X-Emby-Authorization': this.authHeader(config.accessToken, config.deviceId) },
    });
    if (!res.ok) throw new Error(`Playlists fetch failed (HTTP ${res.status})`);
    const json = await res.json();
    // Only audio playlists make sense here. Jellyfin sometimes returns a
    // mixed MediaType, sometimes not — accept both null and 'Audio'.
    return (json.Items || []).filter(p => !p.MediaType || p.MediaType === 'Audio');
  },
  async fetchPlaylistItems(config, playlistId) {
    const params = new URLSearchParams({
      UserId: config.userId,
      Fields: 'AlbumId,Album,Artists,AlbumArtist,RunTimeTicks,UserData',
      Limit: '5000',
    });
    const url = `${this.trimUrl(config.serverUrl)}/Playlists/${playlistId}/Items?${params}`;
    const res = await fetch(url, {
      headers: { 'X-Emby-Authorization': this.authHeader(config.accessToken, config.deviceId) },
    });
    if (!res.ok) throw new Error(`Playlist items fetch failed (HTTP ${res.status})`);
    const json = await res.json();
    return json.Items || [];
  },
  async createPlaylistOnServer(config, name, trackItemIds) {
    const params = new URLSearchParams({
      Name: name,
      UserId: config.userId,
      MediaType: 'Audio',
    });
    if (trackItemIds && trackItemIds.length) params.set('Ids', trackItemIds.join(','));
    const url = `${this.trimUrl(config.serverUrl)}/Playlists?${params}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'X-Emby-Authorization': this.authHeader(config.accessToken, config.deviceId) },
    });
    if (!res.ok) throw new Error(`Create playlist failed (HTTP ${res.status})`);
    return await res.json(); // { Id: 'playlistId' }
  },
  async addToServerPlaylist(config, playlistId, trackItemIds) {
    if (!trackItemIds || !trackItemIds.length) return;
    const params = new URLSearchParams({
      Ids: trackItemIds.join(','),
      UserId: config.userId,
    });
    const url = `${this.trimUrl(config.serverUrl)}/Playlists/${playlistId}/Items?${params}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'X-Emby-Authorization': this.authHeader(config.accessToken, config.deviceId) },
    });
    if (!res.ok) throw new Error(`Add to playlist failed (HTTP ${res.status})`);
  },
  async removeFromServerPlaylist(config, playlistId, entryIds) {
    if (!entryIds || !entryIds.length) return;
    const params = new URLSearchParams({ EntryIds: entryIds.join(',') });
    const url = `${this.trimUrl(config.serverUrl)}/Playlists/${playlistId}/Items?${params}`;
    const res = await fetch(url, {
      method: 'DELETE',
      headers: { 'X-Emby-Authorization': this.authHeader(config.accessToken, config.deviceId) },
    });
    if (!res.ok) throw new Error(`Remove from playlist failed (HTTP ${res.status})`);
  },
  async movePlaylistItemOnServer(config, playlistId, entryId, newIndex) {
    const url = `${this.trimUrl(config.serverUrl)}/Playlists/${playlistId}/Items/${entryId}/Move/${newIndex}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'X-Emby-Authorization': this.authHeader(config.accessToken, config.deviceId) },
    });
    if (!res.ok) throw new Error(`Move playlist item failed (HTTP ${res.status})`);
  },
  async deletePlaylistOnServer(config, playlistId) {
    const url = `${this.trimUrl(config.serverUrl)}/Items/${playlistId}`;
    const res = await fetch(url, {
      method: 'DELETE',
      headers: { 'X-Emby-Authorization': this.authHeader(config.accessToken, config.deviceId) },
    });
    if (!res.ok) throw new Error(`Delete playlist failed (HTTP ${res.status})`);
  },
  async setFavorite(config, itemId, isFavorite) {
    const url = `${this.trimUrl(config.serverUrl)}/Users/${config.userId}/FavoriteItems/${itemId}`;
    const res = await fetch(url, {
      method: isFavorite ? 'POST' : 'DELETE',
      headers: { 'X-Emby-Authorization': this.authHeader(config.accessToken, config.deviceId) },
    });
    if (!res.ok) throw new Error(`Favorite update failed (HTTP ${res.status})`);
  },
  async renamePlaylistOnServer(config, playlistId, newName) {
    // Jellyfin's item-update endpoint expects the full BaseItemDto. Fetch first.
    const getUrl = `${this.trimUrl(config.serverUrl)}/Users/${config.userId}/Items/${playlistId}`;
    const getRes = await fetch(getUrl, {
      headers: { 'X-Emby-Authorization': this.authHeader(config.accessToken, config.deviceId) },
    });
    if (!getRes.ok) throw new Error(`Fetch playlist failed (HTTP ${getRes.status})`);
    const item = await getRes.json();
    item.Name = newName;
    const postUrl = `${this.trimUrl(config.serverUrl)}/Items/${playlistId}`;
    const postRes = await fetch(postUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Emby-Authorization': this.authHeader(config.accessToken, config.deviceId),
      },
      body: JSON.stringify(item),
    });
    if (!postRes.ok) throw new Error(`Rename playlist failed (HTTP ${postRes.status})`);
  },
};

function jfItemToTrack(item, config) {
  const artist = Array.isArray(item.Artists) && item.Artists.length
    ? item.Artists.join(', ')
    : (item.AlbumArtist || '');
  const albumName = (item.Album && item.Album.trim()) || UNSORTED;
  const pictureUrl = item.AlbumId
    ? JF.imageUrl(config, item.AlbumId)
    : JF.imageUrl(config, item.Id);
  return {
    source: 'jellyfin',
    id: 'jf:' + item.Id,
    itemId: item.Id,
    albumItemId: item.AlbumId || null,
    title: item.Name || 'Unknown',
    artist,
    album: albumName,
    url: JF.streamUrl(config, item.Id),
    pictureUrl,
    indexNumber: item.IndexNumber || 0,
    parentIndexNumber: item.ParentIndexNumber || 0,
    durationSec: item.RunTimeTicks ? Math.round(item.RunTimeTicks / 1e7) : 0,
    tagsRead: true,
    isFavorite: !!(item.UserData && item.UserData.IsFavorite),
  };
}

async function syncJellyfin(opts) {
  opts = opts || {};
  const feedback = !!opts.feedback;
  const silent = !!opts.silent;       // no spinner, no error toast
  const debounceMs = opts.debounceMs || 0;

  const cfg = state.jellyfin.config;
  if (!cfg.serverUrl || !cfg.accessToken || !cfg.userId) {
    if (feedback) showToast('Not connected to Jellyfin');
    return false;
  }
  if (state.jellyfin.syncing) return false;
  if (debounceMs > 0 && Date.now() - (state.jellyfin.lastSync || 0) < debounceMs) return false;

  state.jellyfin.syncing = true;
  if (!silent) updateRefreshSpin(true);

  // Capture playback state before we swap the tracks array out from under it.
  // We re-resolve by track id afterward so a refresh doesn't kill the queue.
  const playingId = state.playingTrack ? state.playingTrack.id : null;
  const queueIds = state.queue
    .map(qi => (state.tracks[qi] || {}).id)
    .filter(id => id != null);
  const playlistDetailId = (state.currentPlaylist && !state.currentPlaylist.smart) ? state.currentPlaylist.id : null;
  const wasOnFavorites = !!(state.currentPlaylist && state.currentPlaylist.smart);

  try {
    const items = await JF.fetchAllAudio(cfg);
    const tracks = items.map(it => jfItemToTrack(it, cfg));
    state.jellyfin.tracks = tracks;
    state.jellyfin.lastSync = Date.now();
    try {
      const pls = await JF.fetchPlaylists(cfg);
      // Preserve loaded items across a silent refresh so the playlist-detail
      // view doesn't flash "Loading…" every time the app comes back to the
      // foreground. Only mark a playlist unloaded if the server's ChildCount
      // disagrees with our cached size (rough but reliable signal that the
      // playlist contents have changed on the server).
      const oldById = new Map(state.jellyfin.playlists.map(p => [p.id, p]));
      state.jellyfin.playlists.length = 0;
      for (const it of pls) {
        const old = oldById.get(it.Id);
        const childCount = typeof it.ChildCount === 'number' ? it.ChildCount : 0;
        const keepCache = old && old.loaded && Array.isArray(old.trackIds) && old.trackIds.length === childCount;
        state.jellyfin.playlists.push({
          id: it.Id,
          name: it.Name || '(unnamed)',
          trackIds: keepCache ? old.trackIds : [],
          entryIds: keepCache ? old.entryIds : [],
          trackCount: childCount,
          source: 'jellyfin',
          loaded: !!keepCache,
        });
      }
      state.jellyfin.playlistsLoaded = true;
    } catch (e) {
      console.warn('Jellyfin playlists refresh failed', e);
    }
    if (state.source === 'jellyfin') {
      state.tracks = state.jellyfin.tracks;
      state.playlists = state.jellyfin.playlists;
      // Re-resolve playback state by id (handles new/removed tracks and
      // re-orderings gracefully). playingTrack is re-pointed to the freshly
      // fetched record so updated fields (e.g. isFavorite) show immediately.
      state.playingTrack = playingId != null ? (state.tracks.find(t => t.id === playingId) || null) : null;
      const have = new Set(state.tracks.map(t => t.id));
      state.queue = queueIds.filter(id => have.has(id));
      state.queuePos = playingId != null ? state.queue.indexOf(playingId) : -1;
      // Re-resolve current playlist reference
      if (playlistDetailId != null) {
        const matched = state.playlists.find(p => p.id === playlistDetailId);
        state.currentPlaylist = matched || null;
        if (!matched && state.view === 'playlist-detail') state.view = 'playlists';
        // If the open playlist's cache was invalidated by this refresh, fetch
        // its items once here (NOT from render) so the detail view repopulates.
        if (matched && state.view === 'playlist-detail' && !matched.loaded && !matched.loading) {
          ensurePlaylistLoaded(matched).then(() => {
            if (state.view === 'playlist-detail' && state.currentPlaylist && state.currentPlaylist.id === matched.id) render();
          });
        }
      } else if (wasOnFavorites) {
        state.currentPlaylist = favoritesSmartPlaylist();
      }
      updateFavoriteUI();
      render();
    }
    if (feedback) showToast(`Loaded ${tracks.length} Jellyfin track${tracks.length === 1 ? '' : 's'}`);
    return true;
  } catch (err) {
    console.error('Jellyfin sync failed', err);
    if (!silent) showToast(`Jellyfin: ${err.message || 'sync failed'}`);
    return false;
  } finally {
    state.jellyfin.syncing = false;
    if (!silent) updateRefreshSpin(false);
  }
}

function updateRefreshSpin(spinning) {
  const btn = document.getElementById('jf-refresh');
  if (!btn) return;
  const svg = btn.querySelector('svg');
  if (svg) svg.classList.toggle('spin', !!spinning);
}

async function setActiveSource(nextSource, opts) {
  const initial = !!(opts && opts.initial);
  if (state.source === nextSource && !(opts && opts.force)) return;

  // Switching the browse source changes only the library on screen — it does
  // NOT interrupt playback. You can browse Local while a Jellyfin track keeps
  // playing (and vice-versa); only tapping a track changes what's playing. The
  // now-playing area is left untouched whenever a track is loaded.
  state.source = nextSource;
  saveSource();
  state.view = 'albums';
  state.currentAlbum = null;
  state.currentPlaylist = null;

  if (nextSource === 'local') {
    state.tracks = state.local.tracks;
    state.playlists = state.local.playlists;
    if (!state.playingTrack) {
      subtitleEl.textContent = state.tracks.length ? 'Tap a track to play' : 'Tap "Add files" to load music';
    }
  } else if (nextSource === 'jellyfin') {
    state.playlists = state.jellyfin.playlists;
    if (!state.jellyfin.config.accessToken) {
      state.tracks = [];
      if (!state.playingTrack) subtitleEl.textContent = 'Tap the gear to connect to Jellyfin';
      render();
      applySourceUI();
      openSettingsSheet();
      return;
    }
    if (state.jellyfin.tracks.length === 0) {
      state.tracks = [];
      if (!state.playingTrack) subtitleEl.textContent = 'Loading your Jellyfin library…';
      render();
      applySourceUI();
      const ok = await syncJellyfin({ feedback: false });
      if (!ok) {
        if (!state.playingTrack) subtitleEl.textContent = 'Could not reach Jellyfin';
        return;
      }
    }
    // Fetch playlists once per session (Refresh re-fetches).
    if (!state.jellyfin.playlistsLoaded) {
      try {
        const items = await JF.fetchPlaylists(state.jellyfin.config);
        state.jellyfin.playlists.length = 0;
        for (const it of items) {
          state.jellyfin.playlists.push({
            id: it.Id,
            name: it.Name || '(unnamed)',
            trackIds: [],
            entryIds: [],
            trackCount: typeof it.ChildCount === 'number' ? it.ChildCount : 0,
            source: 'jellyfin',
            loaded: false,
          });
        }
        state.jellyfin.playlistsLoaded = true;
      } catch (e) {
        console.warn('Jellyfin playlists fetch failed', e);
      }
    }
    state.tracks = state.jellyfin.tracks;
    if (!state.playingTrack) {
      subtitleEl.textContent = state.tracks.length ? 'Tap a track to play' : 'No tracks found';
    }
  }

  // Only the initial app boot wires the first/resume track into the now-playing
  // area. A user-initiated source switch never starts playback on its own.
  if (initial && !state.playingTrack && state.tracks.length > 0) {
    bootPlaybackTrack(false);
  }

  render();
  applySourceUI();
}

function applySourceUI() {
  const isLocal = state.source === 'local';
  document.querySelectorAll('.src-pill').forEach(p => {
    p.classList.toggle('active', p.dataset.src === state.source);
  });
  document.getElementById('files-pick').hidden = !isLocal;
  // Folder picker has its own feature-detect gate; keep hidden if unsupported
  const folderSupported = !document.getElementById('folder-pick').dataset.unsupported;
  document.getElementById('folder-pick').hidden = !(isLocal && folderSupported);
  document.getElementById('jf-refresh').hidden = isLocal;
}

function trackMatchesSearch(t) {
  if (!state.search) return true;
  const q = state.search;
  return (t.title || '').toLowerCase().includes(q) ||
         (t.artist || '').toLowerCase().includes(q) ||
         (t.album || '').toLowerCase().includes(q);
}

function albumMatchesSearch(albumName, indices) {
  if (!state.search) return true;
  if (albumName.toLowerCase().includes(state.search)) return true;
  return indices.some(i => trackMatchesSearch(state.tracks[i]));
}

function groupedAlbums() {
  const map = new Map();
  state.tracks.forEach((t, i) => {
    const a = albumOf(t);
    if (!map.has(a)) map.set(a, []);
    map.get(a).push(i);
  });
  // Sort albums alphabetically; UNSORTED at the end.
  const names = Array.from(map.keys()).sort((a, b) => {
    if (a === UNSORTED) return 1;
    if (b === UNSORTED) return -1;
    return a.localeCompare(b, undefined, { sensitivity: 'base' });
  });
  return names.map(name => ({ name, indices: map.get(name) }));
}

/* ---------- Queue management ---------- */
// Resolve a track id to its record. Searches both libraries (local ids are
// numbers, Jellyfin ids are strings, so they never collide) — which lets the
// queue keep playing across a browse-source switch.
function trackById(id) {
  return state.local.tracks.find(t => t.id === id)
      || state.jellyfin.tracks.find(t => t.id === id)
      || null;
}

// Load whatever track the queue currently points at.
function loadQueueCurrent(autoplay) {
  if (state.queuePos < 0 || state.queuePos >= state.queue.length) return;
  loadTrack(trackById(state.queue[state.queuePos]), autoplay);
}

function setQueue(indices, startIndex) {
  // indices: array of track indices into state.tracks
  // startIndex: which track to play first (an index present in indices)
  // The queue itself is stored as track ids, not indices.
  let ids = indices.map(i => state.tracks[i].id);
  const startId = (startIndex !== undefined && startIndex !== null) ? state.tracks[startIndex].id : null;
  if (state.shuffle) {
    for (let i = ids.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [ids[i], ids[j]] = [ids[j], ids[i]];
    }
    if (startId !== null) {
      const pos = ids.indexOf(startId);
      if (pos > 0) {
        [ids[0], ids[pos]] = [ids[pos], ids[0]];
      }
    }
  }
  state.queue = ids;
  if (startId !== null) {
    state.queuePos = ids.indexOf(startId);
  } else {
    state.queuePos = ids.length > 0 ? 0 : -1;
  }
}

function reshuffleQueueKeepingCurrent() {
  if (state.queue.length === 0) return;
  const current = state.queuePos >= 0 ? state.queue[state.queuePos] : null;
  let ids = state.queue.slice();
  if (state.shuffle) {
    for (let i = ids.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [ids[i], ids[j]] = [ids[j], ids[i]];
    }
    if (current !== null) {
      const pos = ids.indexOf(current);
      if (pos > 0) [ids[0], ids[pos]] = [ids[pos], ids[0]];
    }
  } else {
    // Restore library order (the queue holds ids, so sort by track position).
    const order = new Map(state.tracks.map((t, i) => [t.id, i]));
    ids.sort((a, b) => (order.has(a) ? order.get(a) : 1e9) - (order.has(b) ? order.get(b) : 1e9));
  }
  state.queue = ids;
  if (current !== null) state.queuePos = ids.indexOf(current);
}

/* ---------- View rendering ---------- */
function render() {
  // Update tab visuals
  tabs.querySelectorAll('.tab').forEach(t => {
    const active = t.dataset.view === state.view
      || (state.view === 'album-detail' && t.dataset.view === 'albums')
      || (state.view === 'playlist-detail' && t.dataset.view === 'playlists');
    t.classList.toggle('active', active);
  });
  // Hide tabs on detail views (replaced by back-row)
  const isDetail = state.view === 'album-detail' || state.view === 'playlist-detail';
  tabs.style.display = isDetail ? 'none' : '';
  if (state.view === 'playlists') { renderPlaylistsList(); return; }
  if (state.view === 'playlist-detail') { renderPlaylistDetail(); return; }

  if (state.tracks.length === 0) {
    view.innerHTML = '<div class="empty">Your library is empty.<div class="hint">Pick audio files or a folder — they\'re stored locally on your phone, not uploaded anywhere.</div></div>';
    return;
  }

  if (state.view === 'albums') renderAlbumsGrid();
  else if (state.view === 'songs') renderSongsList();
  else if (state.view === 'album-detail') renderAlbumDetail();
}

function renderAlbumsGrid() {
  let albums = groupedAlbums();
  if (state.search) albums = albums.filter(a => albumMatchesSearch(a.name, a.indices));
  if (albums.length === 0) {
    view.innerHTML = '<div class="empty">' + (state.search ? 'No matches.' : 'No albums yet.') + '</div>';
    return;
  }
  const html = '<div class="album-grid">' + albums.map(a => {
    const art = albumArtUrlFor(a.name);
    const artHtml = art
      ? `<img src="${escapeHtml(art)}" alt="">`
      : '<svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>';
    return `
    <div class="album-card" data-album="${escapeHtml(a.name)}">
      <div class="album-art${art ? ' has-art' : ''}">${artHtml}</div>
      <div class="album-name">${escapeHtml(a.name)}</div>
      <div class="album-count">${a.indices.length} track${a.indices.length === 1 ? '' : 's'}</div>
    </div>`;
  }).join('') + '</div>';
  view.innerHTML = html;
}

function renderAlbumDetail() {
  const album = state.currentAlbum;
  const allIndices = state.tracks
    .map((t, i) => albumOf(t) === album ? i : -1)
    .filter(i => i !== -1);
  if (allIndices.length === 0) {
    // Album disappeared (last track removed) — bounce back
    state.view = 'albums';
    state.currentAlbum = null;
    render();
    return;
  }
  const indices = state.search
    ? allIndices.filter(i => trackMatchesSearch(state.tracks[i]))
    : allIndices;
  const header = `
    <div class="back-row">
      <button class="back-btn" id="back" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div class="back-title">
        <h2>${escapeHtml(album)}</h2>
        <div class="meta">${allIndices.length} track${allIndices.length === 1 ? '' : 's'}${state.search && indices.length !== allIndices.length ? ` · ${indices.length} shown` : ''}</div>
      </div>
      <button class="play-album-btn" id="play-album" type="button">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Play
      </button>
      <button class="back-btn" id="album-menu" type="button" aria-label="Album menu">
        <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      </button>
    </div>
  `;
  const list = indices.length > 0
    ? indices.map((i, n) => trackRow(i, n + 1, false)).join('')
    : '<div class="empty">No matches.</div>';
  view.innerHTML = header + list;
}

function renderSongsList() {
  const filtered = state.search
    ? state.tracks.map((t, i) => trackMatchesSearch(t) ? i : -1).filter(i => i !== -1)
    : state.tracks.map((_, i) => i);
  if (filtered.length === 0) {
    view.innerHTML = '<div class="empty">' + (state.search ? 'No matches.' : 'No tracks.') + '</div>';
    return;
  }
  const html = filtered.map((trackIdx, n) => trackRow(trackIdx, n + 1, true)).join('');
  view.innerHTML = html;
}

function playlistTracks(playlist) {
  // Smart "Favorites" playlist on Jellyfin: built from track.isFavorite, not
  // from a stored trackIds list.
  if (playlist && playlist.id === '__favorites__') {
    return state.tracks
      .map((t, i) => t.isFavorite ? i : -1)
      .filter(i => i >= 0);
  }
  // Regular playlist: resolve trackIds to current state.tracks indices.
  // Missing tracks (since clear / removal) are filtered out.
  return playlist.trackIds
    .map(id => state.tracks.findIndex(t => t.id === id))
    .filter(i => i >= 0);
}

function favoritesSmartPlaylist() {
  // Synthesized on the fly each render; not persisted.
  const count = state.tracks.reduce((n, t) => n + (t.isFavorite ? 1 : 0), 0);
  return {
    id: '__favorites__',
    name: 'Favorites',
    source: 'jellyfin',
    smart: true,
    trackIds: [], // unused — playlistTracks() short-circuits on the id
    trackCount: count,
    loaded: true,
  };
}

function renderPlaylistsList() {
  const all = state.playlists;
  const filtered = state.search
    ? all.filter(p => p.name.toLowerCase().includes(state.search))
    : all;
  // Prepend the synthetic Favorites smart playlist on Jellyfin source.
  let smartHtml = '';
  if (state.source === 'jellyfin') {
    const fav = favoritesSmartPlaylist();
    if (!state.search || fav.name.toLowerCase().includes(state.search)) {
      smartHtml = `
        <div class="track" data-playlist-id="__favorites__" style="border-left-color: var(--danger)">
          <span class="track-num" style="color:var(--danger)">♥</span>
          <div class="track-info">
            <div class="track-name">${fav.name}</div>
            <div class="track-album-sub">${fav.trackCount} track${fav.trackCount === 1 ? '' : 's'}</div>
          </div>
        </div>
      `;
    }
  }
  const cards = filtered.map(p => {
    // For Jellyfin playlists that haven't been opened yet, trust the server's
    // ChildCount instead of trying to resolve trackIds (which are empty until
    // the playlist is loaded on demand).
    let count;
    if (p.source === 'jellyfin' && !p.loaded) {
      count = p.trackCount || 0;
    } else {
      count = playlistTracks(p).length;
    }
    return `
      <div class="track" data-playlist-id="${p.id}">
        <span class="track-num">♬</span>
        <div class="track-info">
          <div class="track-name">${escapeHtml(p.name)}</div>
          <div class="track-album-sub">${count} track${count === 1 ? '' : 's'}</div>
        </div>
      </div>
    `;
  }).join('');
  const newBtn = `
    <div class="track" data-action="new-playlist" style="border-left-color: var(--accent-2)">
      <span class="track-num" style="color:var(--accent-2)">+</span>
      <div class="track-info"><div class="track-name" style="color: var(--accent-2)">New playlist</div></div>
    </div>
  `;
  if (filtered.length === 0 && !state.search && !smartHtml) {
    view.innerHTML = newBtn + '<div class="empty">No playlists yet.<div class="hint">Open a track\'s menu and tap "Add to playlist…" to start one.</div></div>';
    return;
  }
  if (filtered.length === 0 && state.search && !smartHtml) {
    view.innerHTML = newBtn + '<div class="empty">No matches.</div>';
    return;
  }
  view.innerHTML = newBtn + smartHtml + cards;
}

function renderPlaylistDetail() {
  const cur = state.currentPlaylist;
  let p;
  if (cur && cur.id === '__favorites__') {
    // Smart playlist: re-synthesize so the count reflects current favorites.
    p = favoritesSmartPlaylist();
  } else {
    p = cur ? state.playlists.find(pl => pl.id === cur.id) : null;
  }
  if (!p) {
    state.view = 'playlists';
    state.currentPlaylist = null;
    render();
    return;
  }
  state.currentPlaylist = p; // refresh reference
  const isSmart = !!p.smart;
  const loadFailed = !!p.loadFailed;
  // render() must stay PURE — it never triggers a fetch. Loading a Jellyfin
  // playlist's items is the job of the click handler (and syncJellyfin for the
  // refresh case). A render-side fetch trigger here previously created an
  // async render→fetch→render loop that froze the UI when the fetch failed.
  const isLoading = p.source === 'jellyfin' && !p.loaded && !isSmart && !loadFailed;
  const allIndices = (isLoading || loadFailed) ? [] : playlistTracks(p);
  const indices = state.search
    ? allIndices.filter(i => trackMatchesSearch(state.tracks[i]))
    : allIndices;
  const totalCount = isLoading ? (p.trackCount || 0) : allIndices.length;
  const menuBtnHtml = isSmart ? '' : `
      <button class="back-btn" id="playlist-menu" type="button" aria-label="Playlist menu">
        <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      </button>
  `;
  const header = `
    <div class="back-row">
      <button class="back-btn" id="back" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div class="back-title">
        <h2>${isSmart ? '♥ ' : ''}${escapeHtml(p.name)}</h2>
        <div class="meta">${totalCount} track${totalCount === 1 ? '' : 's'}${state.search && indices.length !== allIndices.length ? ` · ${indices.length} shown` : ''}</div>
      </div>
      <button class="play-album-btn" id="play-playlist" type="button">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Play
      </button>
      ${menuBtnHtml}
    </div>
  `;
  const list = loadFailed
    ? '<div class="empty">Could not reach Jellyfin to load this playlist.<div class="hint">Tap back and try again, or check the server URL in settings.</div></div>'
    : (isLoading
        ? '<div class="empty">Loading…</div>'
        : (indices.length > 0
            ? indices.map((i, n) => playlistTrackRow(i, allIndices.indexOf(i))).join('')
            : '<div class="empty">' + (state.search ? 'No matches.' : 'Empty playlist. Add tracks from the Albums or Songs tabs.') + '</div>'));
  view.innerHTML = header + list;
}

function playlistTrackRow(trackIndex, positionInPlaylist) {
  const t = state.tracks[trackIndex];
  const playing = !!state.playingTrack && t.id === state.playingTrack.id;
  const artist = artistOf(t);
  const album = albumOf(t);
  const subText = artist && album !== UNSORTED ? `${artist} · ${album}`
    : artist ? artist
    : album !== UNSORTED ? album : '';
  const sub = subText ? `<div class="track-album-sub">${escapeHtml(subText)}</div>` : '';
  return `
    <div class="track${playing ? ' playing' : ''}" data-track="${trackIndex}" data-playlist-pos="${positionInPlaylist}">
      <span class="track-num">${positionInPlaylist + 1}</span>
      <div class="track-info">
        <div class="track-name">${escapeHtml(t.title)}</div>
        ${sub}
      </div>
      <button class="track-menu" data-playlist-track="${positionInPlaylist}" aria-label="Track menu" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      </button>
    </div>
  `;
}

function trackRow(trackIndex, number, showAlbumSub) {
  const t = state.tracks[trackIndex];
  const playing = !!state.playingTrack && t.id === state.playingTrack.id;
  let subText = '';
  if (showAlbumSub) {
    const artist = artistOf(t);
    const album = albumOf(t);
    subText = artist && album !== UNSORTED ? `${artist} · ${album}` :
              artist ? artist :
              album !== UNSORTED ? album : '';
  } else if (artistOf(t)) {
    subText = artistOf(t);
  }
  const sub = subText ? `<div class="track-album-sub">${escapeHtml(subText)}</div>` : '';
  return `
    <div class="track${playing ? ' playing' : ''}" data-track="${trackIndex}">
      <span class="track-num">${number}</span>
      <div class="track-info">
        <div class="track-name">${escapeHtml(t.title)}</div>
        ${sub}
      </div>
      <button class="track-menu" data-menu="${trackIndex}" aria-label="Track menu" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      </button>
    </div>
  `;
}

function openPlaylistTrackSheet(positionInPlaylist) {
  const p = state.currentPlaylist;
  if (!p) return;
  const isSmart = !!p.smart;
  let trackIdx;
  if (isSmart) {
    const indices = playlistTracks(p);
    trackIdx = indices[positionInPlaylist];
  } else {
    const trackId = p.trackIds[positionInPlaylist];
    trackIdx = state.tracks.findIndex(t => t.id === trackId);
  }
  const t = trackIdx >= 0 ? state.tracks[trackIdx] : null;
  const title = t ? t.title : '(missing track)';
  if (isSmart) {
    sheetBody.innerHTML = `
      <div class="sheet-title">${escapeHtml(title)}</div>
      <button class="sheet-action" data-plt-act="play">Play</button>
      <div class="sheet-divider"></div>
      <button class="sheet-action danger" data-plt-act="unfavorite">Remove from Favorites</button>
      <button class="sheet-action" data-plt-act="cancel" style="text-align:center;color:var(--muted)">Cancel</button>
    `;
  } else {
    const isFirst = positionInPlaylist === 0;
    const isLast = positionInPlaylist === p.trackIds.length - 1;

      <div class="sheet-title">${escapeHtml(title)}</div>
      <button class="sheet-action" data-plt-act="play">Play</button>
      <button class="sheet-action" data-plt-act="move-up" ${isFirst ? 'disabled style="opacity:0.4"' : ''}>Move up</button>
