<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#f4f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f13" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Lift Log</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f4f4f7;--card:#fff;--text:#17171c;--muted:#6b6b76;--line:#e4e4ea;--accent:#6c4cf1;--soft:#efeafe;--danger:#d93a3a;--ok:#1f9d55;--okSoft:#e3f6ea;--gold:#8a6100;--goldSoft:#fff1c2}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f13;--card:#1b1b22;--text:#f2f2f5;--muted:#a0a0ab;--line:#2c2c36;--accent:#8b72ff;--soft:#2a2440;--danger:#ff6b6b;--ok:#2fb86a;--okSoft:#173325;--gold:#f5c542;--goldSoft:#3a3010}}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.35}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header.top h1{font-size:26px;margin:0;font-weight:750;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:4px 16px calc(130px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{background:none;border:0;padding:8px 0 6px;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs button.on{color:var(--accent)}
nav.tabs svg{width:24px;height:24px}
.dot{position:absolute;top:6px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--ok)}
.card{background:var(--card);border-radius:14px;padding:14px;margin:0 0 12px;border:1px solid var(--line)}
.card.next{border-color:var(--accent)}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:13px}
h2{font-size:20px;margin:18px 0 10px}h3{font-size:17px;margin:0}
p{margin:6px 0}
.btn{appearance:none;border:0;border-radius:11px;padding:11px 16px;font-weight:600;background:var(--soft);color:var(--accent);min-height:44px}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:transparent;color:var(--danger)}
.btn.ghost{background:transparent}
.btn.block{width:100%;margin-top:8px}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px}
.link{background:none;border:0;color:var(--accent);padding:8px 0;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.txt,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.num{width:58px;text-align:center;padding:7px 4px}
.list .item{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.tag.acc{color:var(--accent);border-color:var(--accent)}
.grouphead{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 2px}
.sets{width:100%;border-collapse:collapse;margin-top:8px}
.sets th{font-size:12px;color:var(--muted);font-weight:600;text-align:center;padding:4px}
.sets td{padding:4px;text-align:center}
.sets input{width:100%;text-align:center;font:inherit;font-size:17px;padding:9px 4px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text)}
.sets tr.done input{background:var(--okSoft);border-color:transparent}
.check{width:46px;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:18px}
tr.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.setno{width:30px;color:var(--muted);font-weight:600}
.restbar{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:6;background:var(--text);color:var(--bg);border-radius:12px;padding:8px 8px 8px 16px;display:none;align-items:center;justify-content:space-between;font-weight:600}
.restbar.show{display:flex}
.restbar.go{background:var(--ok);color:#fff}
.restbar .rb{display:flex;gap:2px}
.restbar button{background:none;border:0;color:inherit;font-size:15px;font-weight:600;padding:8px 10px;min-width:44px}
#restText{font-variant-numeric:tabular-nums}
.flash{position:fixed;inset:0;z-index:30;pointer-events:none;display:none;align-items:center;justify-content:center;background:var(--ok);color:#fff;font-size:88px;font-weight:800;letter-spacing:-1px}
.flash.show{display:flex;animation:flash 2.4s ease-out forwards}
@keyframes flash{0%,28%,56%{opacity:.95}14%,42%{opacity:.4}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.flash.show{animation:fade 2.4s ease-in forwards}@keyframes fade{0%,60%{opacity:.95}100%{opacity:0}}}
.sel{font:inherit;font-size:16px;padding:7px 6px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:none}
.scrim.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--card);border-radius:18px 18px 0 0;max-height:88vh;display:none;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.show{display:flex}
.sh-head{padding:14px 16px 6px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh-pad{padding:0 16px}
.sh-body{overflow:auto;padding:0 16px 12px;-webkit-overflow-scrolling:touch;flex:1}
.sh-foot{padding:10px 16px 14px;border-top:1px solid var(--line)}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:15px 4px;color:var(--text);font-size:17px}
.menu button.danger{color:var(--danger)}
.pick{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;font-size:14px}
.pick.on .box{background:var(--accent);border-color:var(--accent)}
.pick.dim{opacity:.55}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.stat{flex:1;text-align:center}.stat b{display:block;font-size:20px}
.arrow{min-width:44px;padding:4px 10px;display:inline-grid;place-items:center}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;margin:0 6px 0 0;white-space:nowrap}
.badge.up{background:var(--okSoft);color:var(--ok)}
.badge.best{background:var(--goldSoft);color:var(--gold)}
.badge.down{color:var(--muted);border:1px solid var(--line);font-weight:600}
tr.gain td{padding-top:0;text-align:left}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--accent)}
.chart .grid{stroke:var(--line)}
.chart text{fill:var(--muted);font-size:11px}
.rng{color:var(--accent);font-weight:700}
.nudge{margin-top:8px;font-size:13px;font-weight:600;background:var(--goldSoft);color:var(--gold);border-radius:8px;padding:6px 10px}
</style>
</head>
<body>
<header class="top"><h1 id="title">Today</h1><div id="right"></div></header>
<main id="view"></main>
<div class="restbar" id="restbar" role="timer"><span id="restText">Rest 0:00</span><span class="rb"><button data-a="rest-adj" data-d="-15" aria-label="15 seconds less rest">−15</button><button data-a="rest-adj" data-d="15" aria-label="15 seconds more rest">+15</button><button data-a="rest-skip" aria-label="Skip the rest">Skip</button></span></div>
<div class="flash" id="restFlash" aria-hidden="true">Go!</div>
<nav class="tabs">
  <button data-a="tab" data-tab="today"><span class="dot" id="activeDot" style="display:none"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>Today</button>
  <button data-a="tab" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Plan</button>
  <button data-a="tab" data-tab="exercises"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Exercises</button>
  <button data-a="tab" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</button>
</nav>
<div class="scrim" id="scrim" data-a="sheet-close"></div>
<div class="sheet" id="sheet" role="dialog"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
'use strict';
const APP_VERSION = '1.0.7';
const KEY = 'liftlog.v1';
const GROUPS = ['Push', 'Pull', 'Legs', 'Core'];
const DEFAULTS = {
  Push: ['Barbell Bench Press', 'Incline Barbell Bench Press', 'Decline Bench Press', 'Dumbbell Bench Press', 'Incline Dumbbell Press', 'Machine Chest Press', 'Smith Machine Bench Press', 'Cable Fly', 'Pec Deck', 'Dumbbell Fly', 'Push-Up', 'Dips', 'Barbell Overhead Press', 'Seated Dumbbell Shoulder Press', 'Arnold Press', 'Machine Shoulder Press', 'Dumbbell Lateral Raise', 'Cable Lateral Raise', 'Machine Lateral Raise', 'Front Raise', 'Triceps Pushdown (Rope)', 'Triceps Pushdown (Bar)', 'Overhead Cable Triceps Extension', 'Overhead Dumbbell Triceps Extension', 'Skull Crusher', 'Close-Grip Bench Press', 'Triceps Kickback', 'Bench Dip'],
  Pull: ['Deadlift', 'Pull-Up', 'Chin-Up', 'Assisted Pull-Up', 'Lat Pulldown', 'Close-Grip Lat Pulldown', 'Straight-Arm Pulldown', 'Barbell Row', 'Dumbbell Row', 'Seated Cable Row', 'T-Bar Row', 'Chest-Supported Row', 'Machine Row', 'Inverted Row', 'Face Pull', 'Reverse Pec Deck', 'Rear Delt Dumbbell Fly', 'Barbell Shrug', 'Dumbbell Shrug', 'Barbell Curl', 'Dumbbell Curl', 'Hammer Curl', 'Incline Dumbbell Curl', 'Preacher Curl', 'Cable Curl', 'Concentration Curl', 'Back Extension'],
  Legs: ['Barbell Back Squat', 'Front Squat', 'Goblet Squat', 'Smith Machine Squat', 'Hack Squat', 'Leg Press', 'Bulgarian Split Squat', 'Walking Lunge', 'Reverse Lunge', 'Step-Up', 'Romanian Deadlift', 'Dumbbell Romanian Deadlift', 'Sumo Deadlift', 'Good Morning', 'Leg Extension', 'Lying Leg Curl', 'Seated Leg Curl', 'Hip Thrust', 'Glute Bridge', 'Cable Glute Kickback', 'Hip Abduction Machine', 'Hip Adduction Machine', 'Standing Calf Raise', 'Seated Calf Raise', 'Leg Press Calf Raise'],
  Core: ['Hanging Leg Raise', 'Cable Crunch', 'Ab Wheel Rollout', 'Russian Twist', 'Decline Sit-Up', 'Pallof Press']
};
const TEMPLATES = [['ppl', 'Push / Pull / Legs', ['Push', 'Pull', 'Legs']], ['ul', 'Upper / Lower', ['Upper', 'Lower']], ['fb', 'Full body', ['Full Body']], ['blank', 'Start blank', []]];

const UP = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>';
const DOWN = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
const $ = s => document.querySelector(s);
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const fmtNum = n => Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100);
const fmtDate = t => new Date(t).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const fmtTime = t => new Date(t).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
function fmtDur(ms) { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); }

// Suggested rep ranges (1.0.7), a common starting point she can change in Plan or mid-workout: big compound
// lifts 6-10, other compound and machine lifts 8-12, isolation and core 12-15. Her own exercises get 8-12.
const REPS_BIG = ['Barbell Bench Press', 'Incline Barbell Bench Press', 'Decline Bench Press', 'Close-Grip Bench Press', 'Barbell Overhead Press', 'Deadlift', 'Sumo Deadlift', 'Romanian Deadlift', 'Barbell Back Squat', 'Front Squat', 'Barbell Row', 'T-Bar Row', 'Pull-Up', 'Chin-Up'];
const REPS_ISO = ['Cable Fly', 'Pec Deck', 'Dumbbell Fly', 'Dumbbell Lateral Raise', 'Cable Lateral Raise', 'Machine Lateral Raise', 'Front Raise', 'Triceps Pushdown (Rope)', 'Triceps Pushdown (Bar)', 'Overhead Cable Triceps Extension', 'Overhead Dumbbell Triceps Extension', 'Skull Crusher', 'Triceps Kickback', 'Straight-Arm Pulldown', 'Face Pull', 'Reverse Pec Deck', 'Rear Delt Dumbbell Fly', 'Barbell Shrug', 'Dumbbell Shrug', 'Barbell Curl', 'Dumbbell Curl', 'Hammer Curl', 'Incline Dumbbell Curl', 'Preacher Curl', 'Cable Curl', 'Concentration Curl', 'Back Extension', 'Leg Extension', 'Lying Leg Curl', 'Seated Leg Curl', 'Glute Bridge', 'Cable Glute Kickback', 'Hip Abduction Machine', 'Hip Adduction Machine', 'Standing Calf Raise', 'Seated Calf Raise', 'Leg Press Calf Raise', ...DEFAULTS.Core];
const REP_TIER = {};
for (const n of REPS_BIG) REP_TIER['d-' + slug(n)] = '6-10';
for (const n of REPS_ISO) REP_TIER['d-' + slug(n)] = '12-15';
const repsFor = id => REP_TIER[id] || '8-12';
const blank = v => String(v == null ? '' : v).trim() === '';
function defaultExercises() { const out = []; for (const g of GROUPS) for (const n of DEFAULTS[g]) out.push({ id: 'd-' + slug(n), name: n, group: g, custom: false }); return out; }
const REST_DEFAULTS = [60, 90, 120, 180];
const REST_CHOICES = [30, 45, 60, 75, 90, 120, 150, 180, 240, 300];
const REST_DROP = 15 * 60000; // a rest timer left running this long past its target is dropped
function freshState() { return { v: 1, unit: 'lb', exercises: defaultExercises(), splits: [], activeSplitId: null, sessions: [], active: null, lastBackup: null, hideInstall: false, restDefault: 90, restSound: true, repsV: 1 }; }
function valid(d) { return !!d && d.v === 1 && Array.isArray(d.exercises) && Array.isArray(d.splits) && Array.isArray(d.sessions); }
function normalize(d) {
  const have = new Set(d.exercises.map(e => e.id));
  for (const e of defaultExercises()) if (!have.has(e.id)) d.exercises.push(e);
  if (d.unit !== 'kg') d.unit = 'lb';
  if (d.active === undefined) d.active = null;
  if (!(d.restDefault > 0)) d.restDefault = 90;
  d.restSound = d.restSound !== false;
  if (!d.repsV) { // 1.0.7, once: blank rep targets get the suggested range (clearing one later sticks)
    for (const sp of d.splits) for (const day of sp.days || []) for (const it of day.items || []) if (blank(it.reps)) it.reps = repsFor(it.exId);
    if (d.active) for (const en of d.active.entries || []) {
      if (!en.target) en.target = { sets: (en.sets || []).length || 3, reps: '' };
      if (blank(en.target.reps)) en.target.reps = repsFor(en.exId);
    }
    d.repsV = 1;
  }
  return d;
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const d = JSON.parse(raw); if (valid(d)) return normalize(d); } } catch (e) { }
  return freshState();
}
let S = load();
let saveFailed = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); saveFailed = false; }
  catch (e) { if (!saveFailed) toast('Could not save on this phone: ' + e.message); saveFailed = true; }
}

let ui = { tab: 'today', settings: false, editDay: null, viewEx: null, viewSession: null, justSaved: false, exFilter: 'All', exSearch: '', persisted: null };
let sheet = null;

// ---------- data helpers ----------
const exById = id => S.exercises.find(e => e.id === id);
const exName = (id, fallback) => (exById(id) || {}).name || fallback || 'Exercise';
const sessionsSorted = () => [...S.sessions].sort((a, b) => b.start - a.start);
const activeSplit = () => S.splits.find(s => s.id === S.activeSplitId) || null;
function findDay(ref) { const sp = ref && S.splits.find(s => s.id === ref.splitId); const d = sp && sp.days.find(x => x.id === ref.dayId); return { sp, d }; }
function parseW(v) { const t = String(v == null ? '' : v).trim().replace(',', '.'); if (t === '' || /^bw$/i.test(t)) return null; const n = Number(t); return (isFinite(n) && n >= 0) ? n : undefined; }
function conv(w, from, to) { if (w == null || from === to) return w; const x = from === 'lb' ? w * 0.45359237 : w / 0.45359237; return Math.round(x * 2) / 2; }
const setStr = (s, unit) => (s.w == null ? 'BW' : fmtNum(s.w) + ' ' + unit) + ' × ' + s.r;
function setsSummary(sets, unit) {
  if (!sets.length) return '';
  if (new Set(sets.map(s => s.w)).size === 1) { const w = sets[0].w; return (w == null ? 'BW' : fmtNum(w) + ' ' + unit) + ' × ' + sets.map(s => s.r).join(', '); }
  return sets.map(s => setStr(s, unit)).join(', ');
}
function lastPerformance(exId) {
  for (const s of sessionsSorted()) { const en = s.entries.find(e => e.exId === exId); if (en && en.sets.length) return { start: s.start, unit: s.unit, sets: en.sets, top: !!en.hitTop }; }
  return null;
}
// Double progression (1.0.7): every set at the top of the rep range, with weight on, means go heavier.
function repTop(reps) { const m = String(reps == null ? '' : reps).match(/(\d+)\s*$/); return m ? +m[1] : null; }
function hitTop(target, sets) {
  const top = target && repTop(target.reps);
  return !!top && sets.length > 0 && sets.length >= (target.sets || 1) && sets.every(x => x.w != null && x.r >= top);
}
function hintFor(last, en, k, unit) {
  if (last) { const s = last.sets[Math.min(k, last.sets.length - 1)]; return { w: s.w == null ? '' : fmtNum(conv(s.w, last.unit, unit)), r: String(s.r) }; }
  const prev = k > 0 ? en.sets[k - 1] : null;
  if (prev && String(prev.r).trim() !== '') return { w: String(prev.w), r: String(prev.r) };
  const m = en.target && String(en.target.reps || '').match(/\d+/);
  return { w: '', r: m ? m[0] : '' };
}
function sessionStats(s) {
  let sets = 0, vol = 0;
  for (const en of s.entries) for (const x of en.sets) { sets++; vol += (x.w || 0) * x.r; }
  const rests = [];
  for (const en of s.entries) for (const x of en.sets) if (x.rest > 0) rests.push(x.rest);
  const restAvg = rests.length ? Math.round(rests.reduce((t, x) => t + x, 0) / rests.length) : null;
  return { sets, vol: Math.round(vol), mins: Math.max(1, Math.round((s.end - s.start) / 60000)), restAvg };
}
const fmtSecs = n => fmtDur(n * 1000);
// ---------- progress ----------
const shortDate = t => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
// Top set of a list: the heaviest (compared in lb), ties go to more reps; a weighted set beats a bodyweight one;
// bodyweight-only lists compare by reps.
function topSet(sets, unit) {
  let top = null;
  for (const x of sets) {
    const lb = x.w == null ? null : conv(x.w, unit, 'lb');
    if (!top) top = { w: x.w, r: x.r, lb, unit };
    else if (lb != null && (top.lb == null || lb > top.lb || (lb === top.lb && x.r > top.r))) top = { w: x.w, r: x.r, lb, unit };
    else if (lb == null && top.lb == null && x.r > top.r) top = { w: x.w, r: x.r, lb, unit };
  }
  return top;
}
// Progressive overload: more weight, or the same weight for more reps. Returns "+5 lb", "+2 reps" or ''.
function beatLabel(cur, curUnit, prev, prevUnit) {
  if (!cur || !prev) return '';
  const reps = n => '+' + n + ' rep' + (n === 1 ? '' : 's');
  if (cur.w == null || prev.w == null) return (cur.w == null && prev.w == null && cur.r > prev.r) ? reps(cur.r - prev.r) : '';
  const pw = conv(prev.w, prevUnit, curUnit);
  if (cur.w > pw) return '+' + fmtNum(cur.w - pw) + ' ' + curUnit;
  if (cur.w === pw && cur.r > prev.r) return reps(cur.r - prev.r);
  return '';
}
// Change between two top sets, for history rows: up (green), down or same (grey).
function changeLabel(cur, curUnit, prev, prevUnit) {
  const p = { w: prev.w == null ? null : conv(prev.w, prevUnit, curUnit), r: prev.r };
  const up = beatLabel(cur, curUnit, p, curUnit); if (up) return { t: up, cls: 'up' };
  const down = beatLabel(p, curUnit, cur, curUnit); if (down) return { t: '−' + down.slice(1), cls: 'down' };
  return (cur.w == null) === (p.w == null) ? { t: 'same', cls: 'down' } : null;
}
// The most recent session with this exercise before a time, and the best weighted set before it.
function prevEntry(exId, before) {
  let hit = null;
  for (const s of S.sessions) { if (s.start >= before) continue; const en = s.entries.find(e => e.exId === exId); if (en && en.sets.length && (!hit || s.start > hit.start)) hit = { start: s.start, unit: s.unit, sets: en.sets }; }
  return hit;
}
function bestBefore(exId, before) {
  let best = null;
  for (const s of S.sessions) {
    if (s.start >= before) continue;
    const en = s.entries.find(e => e.exId === exId); if (!en) continue;
    const t = topSet(en.sets.filter(x => x.w != null), s.unit);
    if (t && (!best || t.lb > best.lb || (t.lb === best.lb && t.r > best.r))) best = t;
  }
  return best;
}
// In a workout in progress: which ticked set (if any) is a new all-time best.
function newBestIndex(en, unit) {
  const prior = bestBefore(en.exId, Infinity); if (!prior) return -1;
  let idx = -1, top = null;
  en.sets.forEach((s, k) => { if (!s.done) return; const w = parseW(s.w); if (w == null) return; const lb = conv(w, unit, 'lb'), r = parseInt(s.r, 10); if (!top || lb > top.lb || (lb === top.lb && r > top.r)) { top = { lb, r }; idx = k; } });
  return top && (top.lb > prior.lb || (top.lb === prior.lb && top.r > prior.r)) ? idx : -1;
}
function chartSvg(pts, label) {
  if (pts.length < 2) return `<div class="card small muted">The progress chart appears once you've done this twice.</div>`;
  const W = 320, H = 130, L = 36, R = 12, T = 12, B = 24;
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  if (hi === lo) { lo = Math.max(0, lo - 1); hi = hi + 1; }
  const x = i => L + i * (W - L - R) / (pts.length - 1), y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  return `<div class="card"><div class="small muted">Top set per session (${esc(label)})</div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Top set per session, from ${fmtNum(pts[0].v)} to ${fmtNum(pts[pts.length - 1].v)} ${esc(label)}">` +
    `<line class="grid" x1="${L}" y1="${T}" x2="${W - R}" y2="${T}"/><line class="grid" x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}"/>` +
    `<text x="${L - 6}" y="${T + 4}" text-anchor="end">${fmtNum(hi)}</text><text x="${L - 6}" y="${H - B + 4}" text-anchor="end">${fmtNum(lo)}</text>` +
    `<polyline class="ln" points="${pts.map((p, i) => x(i).toFixed(1) + ',' + y(p.v).toFixed(1)).join(' ')}"/>` +
    pts.map((p, i) => `<circle class="pt" cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${i === pts.length - 1 ? 4.5 : 3}"/>`).join('') +
    `<text x="${L}" y="${H - 6}">${esc(shortDate(pts[0].t))}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(shortDate(pts[pts.length - 1].t))}</text></svg></div>`;
}

const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
const backupDue = () => S.sessions.length >= 3 && (!S.lastBackup || Date.now() - S.lastBackup > 21 * 864e5);

// ---------- views ----------
function chips(list, on, action) { return '<div class="chips">' + list.map(g => `<button class="chip ${g === on ? 'on' : ''}" data-a="${action}" data-g="${esc(g)}">${esc(g)}</button>`).join('') + '</div>'; }

function viewWorkout() {
  const a = S.active;
  let b = `<div class="small muted" style="margin-bottom:10px">Started ${fmtTime(a.start)}${new Date(a.start).toDateString() !== new Date().toDateString() ? ' on ' + fmtDate(a.start) : ''} · <span id="elapsed">${fmtDur(Date.now() - a.start)}</span></div>`;
  if (!a.entries.length) b += `<div class="card muted">No exercises yet. Tap <b>Add exercise</b> to pick some.</div>`;
  a.entries.forEach((en, i) => {
    const last = lastPerformance(en.exId);
    const t = en.target;
    const goal = (t ? (t.reps ? `Goal ${t.sets} × ${esc(t.reps)} · ` : `Goal ${t.sets} ${t.sets === 1 ? 'set' : 'sets'} · `) : '') + (en.rest > 0 ? `Rest ${fmtSecs(en.rest)} · ` : '');
    const best = bestBefore(en.exId, Infinity);
    const lastLine = last ? `Last time (${esc(shortDate(last.start))}): ${esc(setsSummary(last.sets, last.unit))}${best ? ` · Best ${esc(fmtNum(conv(best.w, best.unit, a.unit)) + ' ' + a.unit)} × ${best.r}` : ''}` : 'First time';
    const doneSets = en.sets.filter(s => s.done).map(s => { const w = parseW(s.w); return { w: w === undefined ? null : w, r: parseInt(s.r, 10) || 0 }; });
    const nudge = hitTop(t, doneSets) ? `Top of ${t.reps} on every set. Go heavier next time.` : (last && last.top && !doneSets.length ? 'Last time you hit the top of the range on every set. Go heavier today.' : '');
    b += `<div class="card"><div class="row"><div class="grow"><h3>${esc(exName(en.exId, en.name))}</h3><div class="small muted">${goal}${lastLine}</div></div><button class="btn ghost sm" data-a="ex-menu" data-e="${i}" aria-label="Exercise options">•••</button></div>${nudge ? `<div class="nudge">${esc(nudge)}</div>` : ''}`;
    b += `<table class="sets"><tr><th>Set</th><th>${a.unit}</th><th>Reps${t && !blank(t.reps) ? ` <span class="rng">${esc(t.reps)}</span>` : ''}</th><th></th></tr>`;
    const nb = newBestIndex(en, a.unit);
    en.sets.forEach((s, k) => {
      const h = hintFor(last, en, k, a.unit);
      b += `<tr class="${s.done ? 'done' : ''}"><td class="setno">${k + 1}</td><td><input inputmode="decimal" enterkeyhint="next" data-in="w" data-e="${i}" data-s="${k}" value="${esc(s.w)}" placeholder="${esc(h.w)}" aria-label="Weight, set ${k + 1}"></td><td><input inputmode="numeric" enterkeyhint="done" data-in="r" data-e="${i}" data-s="${k}" value="${esc(s.r)}" placeholder="${esc(h.r)}" aria-label="Reps, set ${k + 1}"></td><td><button class="check" data-a="set-done" data-e="${i}" data-s="${k}" aria-label="Set ${k + 1} done">✓</button></td></tr>`;
      if (s.done) {

  });
  b += `<button class="btn block" data-a="workout-add-ex">+ Add exercise</button>`;
  b += `<h2>Notes</h2><textarea rows="3" data-in="notes" placeholder="How did it feel?">${esc(a.notes)}</textarea>`;
  b += `<button class="btn primary block" style="margin-top:14px" data-a="finish">Finish workout</button><button class="btn danger block" data-a="discard">Discard workout</button>`;
  return { title: a.name, right: `<button class="btn primary sm" data-a="finish">Finish</button>`, body: b };
}

function viewPlan() {

    const on = sp.id === S.activeSplitId;
    b += `<div class="card"><div class="row"><div class="grow"><h3>${esc(sp.name)}${on ? '<span class="tag acc">In use</span>' : ''}</h3></div>${on ? '' : `<button class="btn sm" data-a="use-split" data-split="${sp.id}">Use this</button>`}<button class="btn ghost sm" data-a="split-menu" data-split="${sp.id}" aria-label="Split options">•••</button></div><div class="list">`;

        (sp.days.length > 1 ? `<div><button class="btn ghost sm arrow" data-a="day-move" data-split="${sp.id}" data-i="${i}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="Move ${esc(d.name)} up">${UP}</button><br><button class="btn ghost sm arrow" data-a="day-move" data-split="${sp.id}" data-i="${i}" data-d="1" ${i === sp.days.length - 1 ? 'disabled' : ''} aria-label="Move ${esc(d.name)} down">${DOWN}</button></div>` : '') +

function filterEx(search, group) {
  const q = search.trim().toLowerCase();
  return S.exercises.filter(e => (group === 'All' || e.group === group) && (!q || e.name.toLowerCase().includes(q)))
    .sort((a, b) => GROUPS.indexOf(a.group) - GROUPS.indexOf(b.group) || a.name.localeCompare(b.name));
}
function exListHtml() {
  const list = filterEx(ui.exSearch, ui.exFilter);
  if (!list.length) return `<div class="card muted">No matches. Tap <b>New exercise</b> to add it.</div>`;
  let b = '', g = null;
  for (const e of list) {
    if (e.group !== g) { if (g !== null) b += '</div>'; g = e.group; b += `<div class="grouphead">${esc(g)}</div><div class="card list">`; }
    b += `<div class="item" data-a="view-ex" data-ex="${esc(e.id)}"><div class="grow">${esc(e.name)}${e.custom ? '<span class="tag">Mine</span>' : ''}</div><span class="muted">›</span></div>`;
  }
  return b + '</div>';
}
function viewExercises() {
  let b = `<input class="txt" type="search" placeholder="Search exercises" data-in="ex-search" value="${esc(ui.exSearch)}">` + chips(['All', ...GROUPS], ui.exFilter, 'ex-filter');
  b += `<div id="exlist">${exListHtml()}</div><button class="btn primary block" data-a="new-ex">+ New exercise</button>`;
  return { title: 'Exercises', right: '', body: b };
}
function viewExercise() {
  const ex = exById(ui.viewEx);
  if (!ex) { ui.viewEx = null; return viewExercises(); }
  const hist = sessionsSorted().map(s => ({ s, en: s.entries.find(e => e.exId === ex.id) })).filter(x => x.en);
  let best = null;
  for (const { s, en } of hist) for (const x of en.sets) if (x.w != null) { const lb = conv(x.w, s.unit, 'lb'); if (!best || lb > best.lb || (lb === best.lb && x.r > best.r)) best = { lb, w: x.w, r: x.r, unit: s.unit }; }
  let b = `<button class="link" data-a="back-ex">‹ Exercises</button><div class="muted small">${esc(ex.group)}${ex.custom ? ' · added by you' : ''}</div>`;
  b += `<div class="card row" style="margin-top:10px"><div class="stat"><b>${hist.length}</b><span class="small muted">times done</span></div><div class="stat"><b>${best ? esc(fmtNum(conv(best.w, best.unit, S.unit)) + ' ' + S.unit) : '–'}</b><span class="small muted">${best ? 'heaviest, × ' + best.r : 'heaviest'}</span></div><div class="stat"><b>${hist.length ? new Date(hist[0].s.start).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '–'}</b><span class="small muted">last done</span></div></div>`;
  const chrono = hist.slice().reverse().slice(-20);
  const weighted = chrono.some(({ en }) => en.sets.some(x => x.w != null));
  if (hist.length) b += `<h2>Progress</h2>` + chartSvg(chrono.map(({ s, en }) => {
    const t = topSet(weighted ? en.sets.filter(x => x.w != null) : en.sets, s.unit);
    return t ? { t: s.start, v: weighted ? conv(t.w, s.unit, S.unit) : t.r } : null;
  }).filter(Boolean), weighted ? S.unit : 'reps');
  b += hist.length ? `<h2>History</h2><div class="card list">` + hist.map(({ s, en }, i) => {
    const older = hist[i + 1];
    const ch = older ? changeLabel(topSet(en.sets, s.unit), s.unit, topSet(older.en.sets, older.s.unit), older.s.unit) : null;
    return `<div class="item"><div class="grow"><b>${fmtDate(s.start)}</b> <span class="small muted">${esc(s.name)}</span><div class="small">${esc(setsSummary(en.sets, s.unit))}</div></div>${ch ? `<span class="badge ${ch.cls}">${esc(ch.t)}</span>` : ''}</div>`;
  }).join('') + `</div>` : `<div class="card muted">Not done yet.</div>`;
  if (ex.custom) b += `<div class="row wrap" style="margin-top:12px"><button class="btn sm" data-a="rename-ex">Rename</button><button class="btn sm" data-a="regroup-ex">Change group</button><button class="btn danger sm" data-a="delete-ex">Delete</button></div>`;
  return { title: ex.name, right: '', body: b };
}

function sessionRow(s) {

}
function viewHistory() {
  const ss = sessionsSorted();
  if (!ss.length) return { title: 'History', right: '', body: `<div class="card muted">No workouts yet. Finished workouts show up here.</div>` };
  let b = '', m = null;
  for (const s of ss) {
    const mm = new Date(s.start).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    if (mm !== m) { if (m !== null) b += '</div>'; m = mm; b += `<div class="grouphead">${esc(mm)}</div><div class="card list">`; }
    b += sessionRow(s);
  }
  return { title: 'History', right: '', body: b + '</div>' };
}
function viewSession() {
  const s = S.sessions.find(x => x.id === ui.viewSession);
  if (!s) { ui.viewSession = null; return viewHistory(); }
  const st = sessionStats(s);
  let b = `<button class="link" data-a="back-history">‹ History</button>`;
  if (ui.justSaved) b += `<div class="card" style="border-color:var(--ok)"><h3>Workout saved. Nice work!</h3></div>`;
  b += `<div class="muted small">${fmtDate(s.start)}, ${fmtTime(s.start)}</div><div class="card row" style="margin-top:10px"><div class="stat"><b>${st.mins}</b><span class="small muted">${st.mins === 1 ? 'minute' : 'minutes'}</span></div><div class="stat"><b>${st.sets}</b><span class="small muted">${st.sets === 1 ? 'set' : 'sets'}</span></div>${st.restAvg ? `<div class="stat"><b>${fmtSecs(st.restAvg)}</b><span class="small muted">between sets</span></div>` : ''}<div class="stat"><b>${st.vol.toLocaleString()}</b><span class="small muted">${s.unit} lifted</span></div></div>`;
  let compared = 0; const ups = [];
  for (const en of s.entries) {
    const prev = prevEntry(en.exId, s.start); if (!prev) continue;
    compared++;
    const cur = topSet(en.sets, s.unit), p = topSet(prev.sets, prev.unit);
    const up = beatLabel(cur, s.unit, p, prev.unit);
    const best = bestBefore(en.exId, s.start);
    const isBest = cur && cur.lb != null && best && (cur.lb > best.lb || (cur.lb === best.lb && cur.r > best.r));
    if (up || isBest) ups.push(`<div class="item"><div class="grow"><b>${esc(exName(en.exId, en.name))}</b><div class="small">${esc(setStr(cur, s.unit))} <span class="muted">· was ${esc(setStr(p, prev.unit))} on ${esc(shortDate(prev.start))}</span></div></div><div>${up ? `<span class="badge up">${esc(up)}</span>` : ''}${isBest ? '<span class="badge best">New best</span>' : ''}</div></div>`);

    const t = TEMPLATES.find(x => x[0] === sheet.tpl) || TEMPLATES[0];
    const name = $('#sheetText').value.trim() || (t[0] === 'blank' ? 'My split' : t[1]);
    const sp = { id: uid(), name, days: t[2].map(n => ({ id: uid(), name: n, items: [] })) };
    S.splits.push(sp); S.activeSplitId = sp.id; closeSheet(); save(); render(); toast('Split created. Tap a day to pick its exercises.');
  },
  'use-split'(el) { S.activeSplitId = el.dataset.split; save(); render(); toast('Now using this split'); },
  'split-menu'(el) {
    const sp = S.splits.find(s => s.id === el.dataset.split);
    openMenu(sp.name, [
      { label: 'Rename split', run() { setTimeout(() => askText('Rename split', sp.name, v => { sp.name = v; }), 0); } },
      { label: 'Delete split', danger: true, run() { if (!confirm(`Delete "${sp.name}"? Past workouts stay in History.`)) return; S.splits = S.splits.filter(s => s !== sp); if (S.activeSplitId === sp.id) S.activeSplitId = S.splits.length ? S.splits[0].id : null; } }
    ]);
  },
  'add-day'(el) { const sp = S.splits.find(s => s.id === el.dataset.split); askText('New day', '', v => { const d = { id: uid(), name: v, items: [] }; sp.days.push(d); ui.editDay = { splitId: sp.id, dayId: d.id }; }, 'e.g. Legs, Upper, Glutes'); },
  'day-move'(el) { const sp = S.splits.find(s => s.id === el.dataset.split); if (!sp) return; const i = +el.dataset.i, j = i + (+el.dataset.d); if (j < 0 || j >= sp.days.length) return; sp.days.splice(j, 0, sp.days.splice(i, 1)[0]); save(); render(); },
  'back-plan'() { ui.editDay = null; render(true); },
  'rename-day'() { const { d } = findDay(ui.editDay); askText('Rename day', d.name, v => { d.name = v; }); },
  'delete-day'() { const { sp, d } = findDay(ui.editDay); if (!confirm(`Delete the "${d.name}" day? Past workouts stay in History.`)) return; sp.days = sp.days.filter(x => x !== d); ui.editDay = null; save(); render(true); },
  'day-add-ex'() { const { d } = findDay(ui.editDay); openPicker('Add to ' + d.name, d.name, d.items.map(it => it.exId), ids => { for (const id of ids) d.items.push({ exId: id, sets: 3, reps: repsFor(id) }); }); },
  'item-move'(el) { const { d } = findDay(ui.editDay); const i = +el.dataset.i, j = i + (+el.dataset.d); if (j < 0 || j >= d.items.length) return; d.items.splice(j, 0, d.items.splice(i, 1)[0]); save(); render(); },
  'item-remove'(el) { const { d } = findDay(ui.editDay); d.items.splice(+el.dataset.i, 1); save(); render(); },
  'day-start'() { const { sp, d } = findDay(ui.editDay); ui.editDay = null; startWorkout(sp, d); },
  'ex-filter'(el) { ui.exFilter = el.dataset.g; render(); },
  'view-ex'(el) { ui.viewEx = el.dataset.ex; render(true); },
  'back-ex'() { ui.viewEx = null; render(true); },
  'new-ex'() { openExerciseForm(null); },
  'rename-ex'() { openExerciseForm(exById(ui.viewEx)); },
  'regroup-ex'() { openExerciseForm(exById(ui.viewEx)); },
  'exform-group'(el) { sheet.group = el.dataset.g; $('#exGroup').innerHTML = chips(GROUPS, sheet.group, 'exform-group'); },
  'exform-save'() {
    const name = $('#sheetText').value.trim();
    if (!name) { toast('Please enter a name'); return; }
    if (nameTaken(name, sheet.id)) { toast('That exercise is already in the list'); return; }
    if (sheet.id) { const e = exById(sheet.id); e.name = name; e.group = sheet.group; } else { const e = addCustomExercise(name, sheet.group); ui.exSearch = ''; ui.viewEx = e.id; }
    closeSheet(); save(); render(true);
  },
  'delete-ex'() {
    const ex = exById(ui.viewEx);
    if (!confirm(`Delete "${ex.name}"? It comes off your plan days. Past workouts keep it in History.`)) return;
    S.exercises = S.exercises.filter(e => e !== ex);
    for (const sp of S.splits) for (const d of sp.days) d.items = d.items.filter(it => it.exId !== ex.id);
    ui.viewEx = null; save(); render(true);
  },
  'view-session'(el) { ui.tab = 'history'; ui.viewSession = el.dataset.id; ui.justSaved = false; render(true); },
  'back-history'() { ui.viewSession = null; ui.justSaved = false; render(true); },
  'delete-session'() { if (!confirm('Delete this workout from History?')) return; S.sessions = S.sessions.filter(s => s.id !== ui.viewSession); ui.viewSession = null; ui.justSaved = false; save(); render(true); },
  unit(el) { S.unit = el.dataset.g; save(); render(); },
  export() { exportData(); },
  import() { $('#importFile').click(); },
  erase() { if (confirm('Erase everything: splits, workouts and your own exercises?') && confirm('Are you sure? This cannot be undone unless you have a backup.')) { wakeOff(); S = freshState(); save(); ui.settings = false; render(true); toast('Erased'); } },
  'sheet-close'() { closeSheet(); },
  'sheet-save'() { const v = $('#sheetText').value.trim(); if (!v) { toast('Please enter a name'); return; } const f = sheet.onSave; closeSheet(); f(v); save(); render(true); },
  'menu-pick'(el) { const it = sheet.items[+el.dataset.i]; closeSheet(); const jump = it.run(); save(); render(!!jump); },
  'pick-filter'(el) { sheet.filter = el.dataset.g; drawPicker(); },
  'pick-toggle'(el) { const id = el.dataset.ex, i = sheet.sel.indexOf(id); if (i >= 0) sheet.sel.splice(i, 1); else sheet.sel.push(id); drawPicker(); },
  'pick-create'(el) { const e = addCustomExercise(sheet.search.trim(), el.dataset.g); sheet.sel.push(e.id); sheet.search = ''; $('#pickSearch').value = ''; save(); drawPicker(); toast('Added "' + e.name + '" to your exercises'); },
  'pick-done'() { const ids = sheet.sel.slice(), f = sheet.onDone; closeSheet(); if (ids.length) f(ids); save(); render(); }
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.a];
  if (fn) { ev.preventDefault(); fn(el, ev); }
});
document.addEventListener('input', ev => {
  const el = ev.target, k = el.dataset && el.dataset.in; if (!k) return;
  if (k === 'w' || k === 'r') { const en = S.active && S.active.entries[+el.dataset.e]; const s = en && en.sets[+el.dataset.s]; if (s) { s[k] = el.value; save(); } return; }
  if (k === 'notes') { if (S.active) { S.active.notes = el.value; save(); } return; }
  if (k === 'item-sets' || k === 'item-reps') { const { d } = findDay(ui.editDay); const it = d && d.items[+el.dataset.i]; if (!it) return; if (k === 'item-reps') it.reps = el.value.slice(0, 12); else { const n = parseInt(el.value, 10); if (n >= 1 && n <= 20) it.sets = n; } save(); return; }
  if (k === 'item-rest') { setItemRest(el); return; }
  if (k === 'ex-search') { ui.exSearch = el.value; $('#exlist').innerHTML = exListHtml(); return; }
  if (k === 'pick-search') { sheet.search = el.value; drawPicker(); }
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter') return;
  const el = ev.target;
  if ((el.id === 'tgSets' || el.id === 'tgReps') && sheet) { ev.preventDefault(); A['target-save'](); return; }
  if (el.id === 'sheetText' && sheet) { ev.preventDefault(); const t = sheet.type; A[t === 'newsplit' ? 'create-split' : t === 'exform' ? 'exform-save' : 'sheet-save'](); return; }
  if (el.dataset && el.dataset.in === 'w') { ev.preventDefault(); const r = document.querySelector(`input[data-in="r"][data-e="${el.dataset.e}"][data-s="${el.dataset.s}"]`); if (r) r.focus(); return; }
  if (el.dataset && el.dataset.in === 'r') { ev.preventDefault(); el.blur(); }
});
// Leaving the item-sets box blank or invalid snaps it back to the saved value.
document.addEventListener('change', ev => { const k = ev.target.dataset && ev.target.dataset.in; if (k === 'item-sets') render(); if (k === 'item-rest') setItemRest(ev.target); });
function setItemRest(el) { const { d } = findDay(ui.editDay); const it = d && d.items[+el.dataset.i]; if (!it) return; const n = parseInt(el.value, 10); if (n > 0) it.rest = n; else delete it.rest; save(); }

setInterval(() => { const el = $('#elapsed'); if (el && S.active) el.textContent = fmtDur(Date.now() - S.active.start); renderRest(); }, 1000);
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(p => { ui.persisted = p; }).catch(() => { });
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => { });
render(true);
</script>
</body>
</html>
