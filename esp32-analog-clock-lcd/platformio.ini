; PlatformIO project file for the ESP32-C3 Super Mini analog clock.
; https://docs.platformio.org/page/projectconf.html

; The sketch lives in analog_clock/analog_clock.ino rather than src/, so
; that the same file opens directly in the Arduino IDE (which requires the
; folder and the .ino to share a name). PlatformIO compiles .ino sources
; just as happily, it only needs pointing at the right directory.
[platformio]
src_dir = analog_clock

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; The "Super Mini" boards expose only the native USB-Serial/JTAG port, not a
; separate USB-UART bridge, so Serial must be routed over the native USB CDC.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    moononournation/GFX Library for Arduino
