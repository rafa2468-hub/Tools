<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Link Test">
<meta name="robots" content="noindex">
<title>Lift Log link test</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f4f4f7;--card:#fff;--text:#17171c;--muted:#6b6b76;--line:#e4e4ea;--accent:#6c4cf1;--ok:#1f9d55;--bad:#d93a3a}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f13;--card:#1b1b22;--text:#f2f2f5;--muted:#a0a0ab;--line:#2c2c36;--accent:#8b72ff;--ok:#2fb86a;--bad:#ff6b6b}}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);max-width:480px;margin:0 auto}
h1{font-size:24px;margin:0 0 4px}
p{margin:6px 0}
.muted{color:var(--muted);font-size:14px}
.txt{width:100%;font:inherit;padding:11px 12px;margin-top:4px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
button{width:100%;font:inherit;font-weight:700;margin:14px 0;padding:14px;min-height:50px;border:0;border-radius:12px;background:var(--accent);color:#fff}
button:disabled{opacity:.4}
.res{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.res b{display:block;font-size:34px;font-weight:800;letter-spacing:-.01em}
.res.pass b{color:var(--ok)}
.res.fail b{color:var(--bad)}
.res .d{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>Lift Log link test</h1>
<p class="muted" id="where"></p>
<div id="box" hidden><label class="muted">Paste the test link here<input class="txt" id="url" autocomplete="off" autocapitalize="off" spellcheck="false"></label></div>
<button id="run">Run test</button>
<div class="res" id="send"><span class="muted">Send to Google</span><b>Not run</b><div class="d"></div></div>
<div class="res" id="recv"><span class="muted">Get back from Google</span><b>Not run</b><div class="d"></div></div>
</main>
<script>
'use strict';
// A one-off check: can a home-screen web app on an iPhone send to and read from a Google Apps Script web app?
// It stores nothing and doesn't touch Lift Log's data. The script's address comes from the link, not this file.
const SIZE = 200000, TIMEOUT = 60000;
const VALID = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/;
const $ = s => document.querySelector(s);
const pattern = n => '0123456789abcdef'.repeat(Math.ceil(n / 16)).slice(0, n);
const fromHash = () => { try { return decodeURIComponent(location.hash.slice(1)).trim(); } catch (e) { return ''; } };
const clean = v => { const t = String(v || '').trim(), i = t.indexOf('#'); return i >= 0 ? t.slice(i + 1).trim() : t; };
const standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
$('#where').textContent = 'Running from: ' + (standalone ? 'Home screen' : 'Browser tab');
if (!VALID.test(fromHash())) $('#box').hidden = false;
const endpoint = () => { const h = fromHash(); return VALID.test(h) ? h : clean($('#url').value); };
function show(id, ok, text, detail) {
  const el = $(id); el.className = 'res ' + (ok === null ? '' : ok ? 'pass' : 'fail');
  el.querySelector('b').textContent = text; el.querySelector('.d').textContent = detail || '';
}
async function call(url, init) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), TIMEOUT), t0 = performance.now();
  try {
    const res = await fetch(url, { ...init, redirect: 'follow', cache: 'no-store', signal: ctl.signal });
    const text = await res.text();
    return { status: res.status, type: res.type, text, ms: Math.round(performance.now() - t0) };
  } finally { clearTimeout(timer); }
}
const nonce = () => Math.random().toString(36).slice(2, 12);
const why = e => (e && e.name === 'AbortError') ? 'Timed out after 60 seconds' : (e && e.name ? e.name + ': ' + e.message : String(e));
async function testSend(url) {
  try {
    const n = nonce(), body = JSON.stringify({ nonce: n, data: pattern(SIZE) });
    const r = await call(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });
    let j = null; try { j = JSON.parse(r.text); } catch (e) { }
    const ok = !!j && j.ok === true && j.bytes === body.length && j.nonce === n;
    show('#send', ok, ok ? 'PASS' : 'FAIL', ok ? `${body.length.toLocaleString()} characters sent and counted, ${r.ms} ms` : `HTTP ${r.status}, ${r.type}, sent ${body.length}, reply: ${r.text.slice(0, 160)}`);
  } catch (e) { show('#send', false, 'FAIL', why(e)); }
}
async function testRecv(url) {
  try {
    const n = nonce(), r = await call(url + '?size=' + SIZE + '&nonce=' + n, { method: 'GET' });
    let j = null; try { j = JSON.parse(r.text); } catch (e) { }
    const ok = !!j && j.ok === true && j.nonce === n && j.data === pattern(SIZE);
    show('#recv', ok, ok ? 'PASS' : 'FAIL', ok ? `${SIZE.toLocaleString()} characters back and matching, ${r.ms} ms` : `HTTP ${r.status}, ${r.type}, ${r.text.length} characters, reply: ${r.text.slice(0, 160)}`);
  } catch (e) { show('#recv', false, 'FAIL', why(e)); }
}
$('#run').addEventListener('click', async () => {
  const url = endpoint(), btn = $('#run');
  if (!VALID.test(url)) { show('#send', false, 'No link', 'That is not a Google script link ending in /exec.'); return; }
  btn.disabled = true; show('#send', null, 'Running'); show('#recv', null, 'Waiting');
  await testSend(url); show('#recv', null, 'Running'); await testRecv(url);
  btn.disabled = false;
});
</script>
</body>
</html>
