name: paperless_scanner
description: Document scanner that uploads directly to Paperless-ngx.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ML Kit document scanner (edge detection, perspective correction, auto-capture)
  google_mlkit_document_scanner: ^0.4.0

  # PDF generation
  pdf: ^3.10.8
  printing: ^5.12.0

  # HTTP client for Paperless-ngx REST API
  http: ^1.2.0

  # Secure storage for server URL and API token
  flutter_secure_storage: ^9.0.0

  # File system
  path_provider: ^2.1.4

  # Share sheet (fallback: share PDF to other apps)
  share_plus: ^9.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
